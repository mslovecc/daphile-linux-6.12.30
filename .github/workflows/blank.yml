name: Build Linux 6.12.30 Kernel Build Tree

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_VERSION: "6.12.30"
  RELEASE_TAG: "v6.12.30-build1"

jobs:
  build-kernel:
    name: Prepare Linux 6.12.30
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install dependencies
      # --------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-11 \
            g++-11 \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            kmod \
            wget \
            xz-utils \
            zstd

      # --------------------------------------------------
      # 3. Download Linux 6.12.30
      # --------------------------------------------------
      - name: Download Linux 6.12.30
        run: |
          wget -q \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz

          tar -xf linux-${KERNEL_VERSION}.tar.xz

          test -d linux-${KERNEL_VERSION}
          test -f linux-${KERNEL_VERSION}/Makefile

      # --------------------------------------------------
      # 4. Prepare kernel
      # --------------------------------------------------
      - name: Prepare kernel
        run: |
          cd linux-${KERNEL_VERSION}

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            defconfig

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            olddefconfig

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            modules_prepare

      # --------------------------------------------------
      # 5. Verify build tree
      # --------------------------------------------------
      - name: Verify kernel build tree
        run: |
          cd linux-${KERNEL_VERSION}

          echo "=== KERNEL ==="
          make kernelversion

          echo
          echo "=== CONFIG ==="
          test -f .config
          ls -lh .config

          echo
          echo "=== MAKEFILE ==="
          test -f Makefile

          echo
          echo "=== MODULE PREPARE ==="
          test -f include/generated/autoconf.h || true

          echo
          echo "=== ARCH ==="
          ls -ld arch/x86

      # --------------------------------------------------
      # 6. Build kernel symbol information
      # --------------------------------------------------
      - name: Build kernel
        run: |
          make \
            -C linux-${KERNEL_VERSION} \
            ARCH=x86_64 \
            CC=gcc-11 \
            -j2 \
            bzImage \
            modules

          test -f linux-${KERNEL_VERSION}/Module.symvers

          echo
          echo "=== Module.symvers ==="
          ls -lh linux-${KERNEL_VERSION}/Module.symvers

      # --------------------------------------------------
      # 7. Verify final build tree
      # --------------------------------------------------
      - name: Verify final build tree
        run: |
          cd linux-${KERNEL_VERSION}

          echo "========================================"
          echo "Kernel version"
          echo "========================================"
          make kernelversion

          echo
          echo "========================================"
          echo "Config"
          echo "========================================"
          ls -lh .config

          echo
          echo "========================================"
          echo "Module.symvers"
          echo "========================================"
          ls -lh Module.symvers

          echo
          echo "========================================"
          echo "Kernel release"
          echo "========================================"
          make kernelrelease

          echo
          echo "========================================"
          echo "Generated files"
          echo "========================================"

          test -d include/generated
          test -d include/config
          test -d scripts

      # --------------------------------------------------
      # 8. Remove unnecessary build output
      # --------------------------------------------------
      - name: Clean unnecessary files
        run: |
          cd linux-${KERNEL_VERSION}

          rm -f \
            arch/x86/boot/bzImage

          find . \
            -type f \
            \( \
              -name "*.o" \
              -o -name "*.a" \
              -o -name "*.cmd" \
            \) \
            -delete

      # --------------------------------------------------
      # 9. Package
      # --------------------------------------------------
      - name: Package kernel build tree
        run: |
          tar \
            --zstd \
            -cf \
            daphile-linux-${KERNEL_VERSION}-build.tar.zst \
            linux-${KERNEL_VERSION}

          ls -lh \
            daphile-linux-${KERNEL_VERSION}-build.tar.zst

      # --------------------------------------------------
      # 10. Create checksum
      # --------------------------------------------------
      - name: Create checksum
        run: |
          sha256sum \
            daphile-linux-${KERNEL_VERSION}-build.tar.zst \
            > \
            daphile-linux-${KERNEL_VERSION}-build.tar.zst.sha256

          cat \
            daphile-linux-${KERNEL_VERSION}-build.tar.zst.sha256

      # --------------------------------------------------
      # 11. Upload artifact
      # --------------------------------------------------
      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: daphile-linux-${{ env.KERNEL_VERSION }}-build
          path: |
            daphile-linux-${{ env.KERNEL_VERSION }}-build.tar.zst
            daphile-linux-${{ env.KERNEL_VERSION }}-build.tar.zst.sha256

      # --------------------------------------------------
      # 12. Create GitHub Release
      # --------------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Linux ${{ env.KERNEL_VERSION }} Build Tree
          generate_release_notes: true
          files: |
            daphile-linux-${{ env.KERNEL_VERSION }}-build.tar.zst
            daphile-linux-${{ env.KERNEL_VERSION }}-build.tar.zst.sha256
