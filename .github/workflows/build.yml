name: Build Daphile Linux 6.12.30

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  RT_VERSION: "6.12.28-rt10"
  DAPHILE_SUFFIX: "-daphile"

jobs:

  build-kernel:

    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Install build dependencies
      # ==========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch


      # ==========================================================
      # 3. Download Linux 6.12.30
      # ==========================================================

      - name: Download Linux 6.12.30
        run: |
          set -e

          echo "Downloading Linux ${LINUX_VERSION}"

          wget -nv \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          test -f \
            "linux-${LINUX_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

          test -d \
            "linux-${LINUX_VERSION}-daphile"

          echo "Linux source prepared."


      # ==========================================================
      # 4. Download PREEMPT_RT
      #
      # 6.12.28-rt10 is stored in the official 6.12/older tree.
      # ==========================================================

      - name: Download PREEMPT RT
        run: |
          set -e

          echo "Downloading PREEMPT_RT ${RT_VERSION}"

          wget -nv \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz"

          test -f \
            "patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          test -f \
            "patch-${RT_VERSION}.patch"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt.patch"

          test -f rt.patch

          echo "RT patch prepared."


      # ==========================================================
      # 5. Test RT patch
      # ==========================================================

      - name: Test RT patch
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Testing PREEMPT_RT patch"
          echo "=========================================="

          patch \
            --dry-run \
            -p1 \
            < ../rt.patch

          echo
          echo "RT patch dry-run successful."


      # ==========================================================
      # 6. Apply RT patch
      # ==========================================================

      - name: Apply RT patch
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Applying PREEMPT_RT"
          echo "=========================================="

          patch \
            -p1 \
            < ../rt.patch

          echo
          echo "Checking rejected hunks..."

          if find . -type f -name "*.rej" | grep -q .; then
            echo "ERROR: rejected patch hunks detected:"
            find . -type f -name "*.rej"
            exit 1
          fi

          echo
          echo "Checking conflict markers..."

          if grep -R \
              -n \
              -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              . \
              2>/dev/null; then

            echo "ERROR: conflict markers detected."
            exit 1
          fi

          echo
          echo "PREEMPT_RT patch applied successfully."


      # ==========================================================
      # 7. Set Daphile kernel suffix
      # ==========================================================

      - name: Set Daphile kernel suffix
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          printf '%s\n' "${DAPHILE_SUFFIX}" > localversion-daphile

          echo "localversion-daphile:"
          cat localversion-daphile


      # ==========================================================
      # 8. Create kernel configuration
      # ==========================================================

      - name: Create kernel configuration
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "Creating x86_64 defconfig..."

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "Kernel configuration created."


      # ==========================================================
      # 9. Configure module support
      #
      # These are important for external modules.
      # ==========================================================

      - name: Configure external module support
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          ./scripts/config \
            --enable CONFIG_MODULES

          ./scripts/config \
            --enable CONFIG_MODULE_UNLOAD

          ./scripts/config \
            --enable CONFIG_MODVERSIONS

          make \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "External module configuration:"

          grep \
            -E \
            '^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=|^CONFIG_MODVERSIONS=' \
            .config


      # ==========================================================
      # 10. Show PREEMPT_RT configuration
      # ==========================================================

      - name: Check PREEMPT RT configuration
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo
          echo "PREEMPT configuration:"

          grep \
            -E \
            '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT' \
            .config \
            || true


      # ==========================================================
      # 11. Prepare kernel
      # ==========================================================

      - name: Prepare kernel
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare

          echo
          echo "Kernel preparation completed."


      # ==========================================================
      # 12. Build kernel
      #
      # Building the kernel is necessary because we need
      # a real Module.symvers for external modules.
      # ==========================================================

      - name: Build kernel
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          JOBS="$(nproc)"

          echo "Building with ${JOBS} CPU threads."

          make \
            ARCH=x86_64 \
            -j"${JOBS}" \
            bzImage \
            modules

          echo
          echo "Kernel build completed."


      # ==========================================================
      # 13. Verify build outputs
      # ==========================================================

      - name: Verify kernel build tree
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Kernel build verification"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "Checking .config..."
          test -f .config
          ls -lh .config

          echo
          echo "Checking Module.symvers..."
          test -f Module.symvers
          ls -lh Module.symvers

          echo
          echo "Checking System.map..."
          test -f System.map
          ls -lh System.map

          echo
          echo "Checking bzImage..."
          test -f arch/x86/boot/bzImage
          ls -lh arch/x86/boot/bzImage

          echo
          echo "Checking generated headers..."
          test -d include/generated
          test -d arch/x86/include/generated

          echo
          echo "All required kernel build files exist."


      # ==========================================================
      # 14. Create release directory
      # ==========================================================

      - name: Create release directory
        run: |
          set -e

          rm -rf release

          mkdir -p release


      # ==========================================================
      # 15. Export kernel metadata
      # ==========================================================

      - name: Export kernel metadata
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          (
            cd "${KERNEL_DIR}"
            make kernelrelease
          ) > release/kernel.release

          cat > release/build-info.txt <<EOF
Linux version: ${LINUX_VERSION}
PREEMPT_RT: ${RT_VERSION}
Daphile suffix: ${DAPHILE_SUFFIX}

Kernel release:
$(cat release/kernel.release)

Compiler:
$(gcc --version | head -1)

Build date:
$(date -u '+%Y-%m-%d %H:%M:%S UTC')
EOF

          echo
          echo "Release metadata:"
          ls -lh release


      # ==========================================================
      # 16. Create complete build tree
      #
      # IMPORTANT:
      # Do NOT remove .o files.
      # Do NOT remove generated files.
      # Do NOT remove Module.symvers.
      #
      # Repository 2 will use this tree to compile
      # alsa_bridge.ko.
      # ==========================================================

      - name: Package kernel build tree
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          tar \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          test -f \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz"

          echo
          echo "Build tree package:"
          ls -lh \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz"


      # ==========================================================
      # 17. Upload Actions artifact
      # ==========================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.LINUX_VERSION }}-daphile-build
          path: release/
          retention-days: 30


      # ==========================================================
      # 18. Create GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: linux-${{ env.LINUX_VERSION }}-daphile-rt

          name: Daphile Linux ${{ env.LINUX_VERSION }} PREEMPT_RT

          generate_release_notes: false

          body: |
            Daphile Linux kernel build tree.

            Linux:
            ${{ env.LINUX_VERSION }}

            PREEMPT_RT:
            ${{ env.RT_VERSION }}

            Daphile suffix:
            ${{ env.DAPHILE_SUFFIX }}

            This release is intended for building
            external kernel modules.

            Important files:

            config
            Module.symvers
            System.map
            kernel.release
            build-info.txt

            Complete build tree:

            linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz

            Intended external module:

            Diretta alsa_bridge.ko

          files: |
            release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/build-info.txt
