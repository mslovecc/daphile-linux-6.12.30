name: Build Daphile Linux Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"
  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-11 \
            g++-11 \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch \
            fakeroot

      - name: Download Linux kernel
        shell: bash
        run: |
          set -e

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

      - name: Download PREEMPT RT patch
        shell: bash
        run: |
          set -e

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/${RT_BASE_VERSION}/patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

          ls -lh "rt-${RT_VERSION}.patch"

      - name: Apply PREEMPT RT patch
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "PREEMPT RT PATCH"
          echo "=========================================="

          echo "Linux version: ${LINUX_VERSION}"
          echo "RT version: ${RT_VERSION}"

          echo
          echo "Testing patch..."

          patch \
            --dry-run \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "Applying patch..."

          patch \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "Checking rejected hunks..."

          if find . -type f -name "*.rej" | grep -q .; then
            echo "ERROR: rejected hunks found"
            find . -type f -name "*.rej"
            exit 1
          fi

          echo
          echo "Checking conflict markers..."

          if grep -R \
            -n \
            -E '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            . \
            2>/dev/null | head -20; then

            echo "ERROR: merge conflict markers detected"
            exit 1
          fi

          echo
          echo "PREEMPT RT patch applied successfully"

      - name: Set Daphile kernel version
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          printf '%s\n' "${DAPHILE_RELEASE}" > localversion-daphile

          echo "=== Kernel version ==="
          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            kernelversion

      - name: Create kernel configuration
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            defconfig

          echo
          echo "=== PREEMPT CONFIG ==="

          grep \
            -E '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT' \
            .config \
            || true

      - name: Configure PREEMPT RT
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          if grep -q '^CONFIG_PREEMPT_RT=y' .config; then
            echo "CONFIG_PREEMPT_RT already enabled"
          else
            echo "CONFIG_PREEMPT_RT=y" >> .config
          fi

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            olddefconfig

          echo
          echo "=== FINAL PREEMPT CONFIG ==="

          grep \
            -E '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT' \
            .config \
            || true

      - name: Prepare kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            prepare

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            modules_prepare

      - name: Build kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          NPROC="$(nproc)"

          echo "CPU threads: ${NPROC}"

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify kernel build
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo
          echo "=========================================="
          echo "KERNEL BUILD VERIFICATION"
          echo "=========================================="

          echo
          echo "Kernel release:"
          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            kernelrelease

          echo
          echo "Config:"
          ls -lh .config

          echo
          echo "Module.symvers:"
          ls -lh Module.symvers

          echo
          echo "System.map:"
          ls -lh System.map

          echo
          echo "Kernel image:"
          ls -lh arch/x86/boot/bzImage

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          rm -rf release

          mkdir -p release

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          (
            cd "${KERNEL_DIR}"

            make \
              ARCH=x86_64 \
              CC=gcc-11 \
              kernelrelease
          ) > release/kernel.release

          KERNEL_RELEASE="$(cat release/kernel.release)"
          COMPILER="$(gcc-11 --version | head -1)"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          printf '%s\n' \
            "Linux version: ${LINUX_VERSION}" \
            "PREEMPT_RT: ${RT_VERSION}" \
            "Daphile suffix: ${DAPHILE_RELEASE}" \
            "" \
            "Kernel release: ${KERNEL_RELEASE}" \
            "Compiler: ${COMPILER}" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo
          echo "=== build-info.txt ==="
          cat release/build-info.txt

      - name: Create kernel build tree archive
        shell: bash
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          tar \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ko' \
            --exclude='*.tmp' \
            --exclude='*.cmd' \
            --exclude='*.d' \
            --exclude='*.dtb' \
            --exclude='*.dtbo' \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=== RELEASE FILES ==="
          ls -lh release

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.LINUX_VERSION }}-daphile-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-${{ env.LINUX_VERSION }}-daphile-rt
          name: Daphile Linux ${{ env.LINUX_VERSION }} RT
          generate_release_notes: false
          body: |
            Daphile Linux kernel build tree.

            Linux version: ${{ env.LINUX_VERSION }}
            PREEMPT_RT: ${{ env.RT_VERSION }}
            Daphile suffix: ${{ env.DAPHILE_RELEASE }}

            This release contains the kernel build environment
            required for building external kernel modules.

            Intended for external modules such as:
            Diretta alsa_bridge.ko
          files: |
            release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/build-info.txt
