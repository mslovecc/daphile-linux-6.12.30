name: Build Daphile Linux Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"
  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-11 \
            g++-11 \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch

      - name: Download Linux 6.12.30
        shell: bash
        run: |
          set -e

          echo "Downloading Linux ${LINUX_VERSION}"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" \
            -O "linux-${LINUX_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

          echo "Linux source ready"

      - name: Download PREEMPT RT patch
        shell: bash
        run: |
          set -e

          echo "Downloading RT ${RT_VERSION}"

          wget -q \
            "https://www.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-6.12.28-rt10.patch.xz" \
            -O "patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

          ls -lh \
            "rt-${RT_VERSION}.patch"

      - name: Apply PREEMPT RT patch
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Applying PREEMPT_RT"
          echo "=========================================="

          patch \
            --dry-run \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          patch \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "Checking rejected hunks"

          REJECTS="$(find . -type f -name '*.rej' -print)"

          if [ -n "${REJECTS}" ]; then
            echo "ERROR: rejected hunks detected"
            echo "${REJECTS}"
            exit 1
          fi

          echo
          echo "Checking conflict markers"

          CONFLICTS="$(
            grep -R \
              -l \
              -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              . \
              2>/dev/null || true
          )"

          if [ -n "${CONFLICTS}" ]; then
            echo "ERROR: conflict markers detected"
            echo "${CONFLICTS}"
            exit 1
          fi

          echo
          echo "PREEMPT_RT patch applied successfully"

      - name: Set Daphile kernel version
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "${DAPHILE_RELEASE}" > localversion-daphile

          rm -f localversion-rt

          echo "=== localversion-daphile ==="
          cat localversion-daphile

          echo
          echo "=== localversion-rt ==="

          if [ -f localversion-rt ]; then
            cat localversion-rt
          else
            echo "(none)"
          fi

      - name: Create PREEMPT RT configuration
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Creating kernel configuration"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "Enabling CONFIG_PREEMPT_RT"

          ./scripts/config \
            --enable CONFIG_PREEMPT_RT

          echo
          echo "Disabling CONFIG_PREEMPT_DYNAMIC"

          ./scripts/config \
            --disable CONFIG_PREEMPT_DYNAMIC

          echo
          echo "Enabling CONFIG_PREEMPT"

          ./scripts/config \
            --enable CONFIG_PREEMPT

          echo
          echo "Enabling CONFIG_MODULES"

          ./scripts/config \
            --enable CONFIG_MODULES

          echo
          echo "Enabling CONFIG_MODULE_UNLOAD"

          ./scripts/config \
            --enable CONFIG_MODULE_UNLOAD

          echo
          echo "Normalizing configuration"

          make \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "PREEMPT CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^(CONFIG_PREEMPT=|CONFIG_PREEMPT_RT=|CONFIG_PREEMPT_DYNAMIC=|CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=)' \
            .config \
            || true

          echo
          echo "Checking CONFIG_PREEMPT_RT"

          if ! grep -q '^CONFIG_PREEMPT_RT=y' .config; then
            echo "ERROR: CONFIG_PREEMPT_RT is not enabled"
            exit 1
          fi

          echo "CONFIG_PREEMPT_RT=y"

      - name: Verify kernel release before build
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Checking kernel release"
          echo "=========================================="

          KERNEL_RELEASE="$(make kernelrelease)"

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Expected:"
          echo "${LINUX_VERSION}-daphile"

          if [ "${KERNEL_RELEASE}" != "${LINUX_VERSION}-daphile" ]; then
            echo "ERROR: kernel release is incorrect"
            exit 1
          fi

          echo
          echo "Kernel release is correct"

      - name: Prepare kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Preparing kernel"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare

          echo
          echo "Kernel preparation complete"

      - name: Build kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          NPROC="$(nproc)"

          echo "=========================================="
          echo "Building kernel"
          echo "=========================================="

          echo "CPU threads: ${NPROC}"

          make \
            ARCH=x86_64 \
            CC=gcc-11 \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify PREEMPT RT kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT KERNEL"
          echo "=========================================="

          KERNEL_RELEASE="$(make kernelrelease)"

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          if [ "${KERNEL_RELEASE}" != "6.12.30-daphile" ]; then
            echo "ERROR: unexpected kernel release"
            exit 1
          fi

          echo
          echo "PREEMPT configuration:"

          grep -E \
            '^(CONFIG_PREEMPT=|CONFIG_PREEMPT_RT=|CONFIG_PREEMPT_DYNAMIC=)' \
            .config \
            || true

          echo
          echo "Checking CONFIG_PREEMPT_RT"

          if ! grep -q '^CONFIG_PREEMPT_RT=y' .config; then
            echo "ERROR: CONFIG_PREEMPT_RT=y not found"
            exit 1
          fi

          echo "CONFIG_PREEMPT_RT=y"

          echo
          echo "Checking Module.symvers"

          if [ ! -f Module.symvers ]; then
            echo "ERROR: Module.symvers not found"
            exit 1
          fi

          ls -lh Module.symvers

          echo
          echo "Checking System.map"

          if [ ! -f System.map ]; then
            echo "ERROR: System.map not found"
            exit 1
          fi

          ls -lh System.map

          echo
          echo "Checking kernel image"

          if [ ! -f arch/x86/boot/bzImage ]; then
            echo "ERROR: bzImage not found"
            exit 1
          fi

          ls -lh arch/x86/boot/bzImage

          echo
          echo "=========================================="
          echo "PREEMPT_RT KERNEL VERIFIED"
          echo "=========================================="

      - name: Prepare release package
        shell: bash
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          rm -rf release

          mkdir -p release

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          cd "${KERNEL_DIR}"

          make kernelrelease > ../release/kernel.release

          cd ..

          echo
          echo "=== Kernel release ==="

          cat release/kernel.release

          echo
          echo "=== Release files ==="

          ls -lh release

      - name: Create build information
        shell: bash
        run: |
          set -e

          KERNEL_RELEASE_ACTUAL="$(cat release/kernel.release)"

          COMPILER_VERSION="$(gcc-11 --version | head -1)"

          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          printf '%s\n' \
            "Linux version: ${LINUX_VERSION}" \
            "Kernel release: ${KERNEL_RELEASE_ACTUAL}" \
            "PREEMPT_RT: ${RT_VERSION}" \
            "Daphile suffix: ${DAPHILE_RELEASE}" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build date: ${BUILD_DATE}" \
            > release/build-info.txt

          echo "=== build-info.txt ==="

          cat release/build-info.txt

      - name: Create kernel build tree archive
        shell: bash
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          tar \
            --exclude="${KERNEL_DIR}/.git" \
            --exclude="${KERNEL_DIR}/*.o" \
            --exclude="${KERNEL_DIR}/*.ko" \
            --exclude="${KERNEL_DIR}/*.a" \
            --exclude="${KERNEL_DIR}/.tmp_versions" \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=== Build tree archive ==="

          ls -lh \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz"

      - name: Create checksums
        shell: bash
        run: |
          set -e

          cd release

          sha256sum \
            build-info.txt \
            config \
            kernel.release \
            Module.symvers \
            System.map \
            linux-${LINUX_VERSION}-daphile-build-tree.tar.xz \
            > SHA256SUMS

          echo "=== SHA256SUMS ==="

          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.LINUX_VERSION }}-daphile-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-${{ env.LINUX_VERSION }}-daphile-rt-rebuild1
          name: Daphile Linux ${{ env.LINUX_VERSION }} PREEMPT_RT rebuild 1
          body: |
            Daphile Linux 6.12.30 PREEMPT_RT build tree.

            Linux version:
            6.12.30

            Kernel release:
            6.12.30-daphile

            PREEMPT_RT:
            6.12.28-rt10

            CONFIG_PREEMPT_RT:
            enabled

            This release is intended for building
            external kernel modules such as Diretta alsa_bridge.ko.
          files: |
            release/build-info.txt
            release/config
            release/kernel.release
            release/Module.symvers
            release/System.map
            release/SHA256SUMS
            release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
