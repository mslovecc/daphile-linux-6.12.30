name: Build Daphile Linux 6.12.30

on:
workflow_dispatch:

permissions:
contents: write

env:
LINUX_VERSION: "6.12.30"
RT_VERSION: "6.12.28-rt10"
DAPHILE_SUFFIX: "-daphile"

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        build-essential \
        gcc-11 \
        bc \
        bison \
        flex \
        libssl-dev \
        libelf-dev \
        libdw-dev \
        dwarves \
        cpio \
        rsync \
        kmod \
        xz-utils \
        zstd \
        wget \
        patch

  - name: Download Linux
    run: |
      set -e

      wget -q \
        "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

      tar -xf \
        "linux-${LINUX_VERSION}.tar.xz"

      mv \
        "linux-${LINUX_VERSION}" \
        "linux-${LINUX_VERSION}-daphile"

  - name: Download RT patch
    run: |
      set -e

      wget -q \
        "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/patch-${RT_VERSION}.patch.xz"

      xz -d \
        "patch-${RT_VERSION}.patch.xz"

  - name: Apply RT patch
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      patch \
        --dry-run \
        -p1 \
        < "../patch-${RT_VERSION}.patch"

      patch \
        -p1 \
        < "../patch-${RT_VERSION}.patch"

      if find . -name "*.rej" -type f | grep -q .; then
        echo "ERROR: rejected patch files found"
        find . -name "*.rej" -type f
        exit 1
      fi

      rm -f localversion-rt

  - name: Set Daphile version
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      printf '%s\n' "${DAPHILE_SUFFIX}" > localversion-daphile

      echo "Kernel version:"
      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        kernelversion

      echo "Kernel release:"
      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        kernelrelease

  - name: Configure kernel
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        defconfig

      ./scripts/config \
        --enable CONFIG_PREEMPT_RT

      ./scripts/config \
        --enable CONFIG_MODULES

      ./scripts/config \
        --enable CONFIG_MODVERSIONS

      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        olddefconfig

      echo "=== RT configuration ==="

      grep -E \
        '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT|^CONFIG_MODULES|^CONFIG_MODVERSIONS' \
        .config || true

  - name: Prepare kernel
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        prepare

      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        modules_prepare

  - name: Build kernel
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        -j"$(nproc)" \
        bzImage

  - name: Generate Module.symvers
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        -j"$(nproc)" \
        modules

  - name: Verify
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      echo "======================================"
      echo "Kernel release"
      echo "======================================"

      make \
        ARCH=x86_64 \
        CC=gcc-11 \
        kernelrelease

      echo
      echo "======================================"
      echo "Required files"
      echo "======================================"

      test -f .config
      test -f Module.symvers
      test -f System.map
      test -f arch/x86/boot/bzImage

      ls -lh \
        .config \
        Module.symvers \
        System.map \
        arch/x86/boot/bzImage

  - name: Package build tree
    run: |
      set -e

      KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

      mkdir -p release

      cp \
        "${KERNEL_DIR}/.config" \
        release/config

      cp \
        "${KERNEL_DIR}/Module.symvers" \
        release/Module.symvers

      cp \
        "${KERNEL_DIR}/System.map" \
        release/System.map

      (
        cd "${KERNEL_DIR}"

        make \
          ARCH=x86_64 \
          CC=gcc-11 \
          kernelrelease
      ) > release/kernel.release

      cat > release/build-info.txt <<EOF

Linux version: ${LINUX_VERSION}
PREEMPT_RT: ${RT_VERSION}
Daphile suffix: ${DAPHILE_SUFFIX}
Kernel release: $(cat release/kernel.release)
Compiler: $(gcc-11 --version | head -1)
Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
EOF

      tar \
        -cJf \
        "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
        --exclude=".git" \
        --exclude="*.o" \
        --exclude="*.ko" \
        --exclude="*.a" \
        --exclude="*.tmp" \
        "${KERNEL_DIR}"

      ls -lh release

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: linux-${{ env.LINUX_VERSION }}-daphile-build
      path: release/

  - name: Create Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: linux-${{ env.LINUX_VERSION }}-daphile
      name: Daphile Linux ${{ env.LINUX_VERSION }}
      body: |
        Linux 6.12.30
        PREEMPT_RT 6.12.28-rt10
        Kernel release 6.12.30-daphile

        Build environment for external kernel modules,
        including Diretta alsa_bridge.ko.
      files: |
        release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
        release/config
        release/Module.symvers
        release/System.map
        release/kernel.release
        release/build-info.txt
