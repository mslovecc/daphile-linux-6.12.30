name: Build Daphile 6.12.30 RT Kernel Tree

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"
  DAPHILE_RELEASE: "-daphile"

jobs:
  build-kernel-tree:
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. Basic packages
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            kmod \
            xz-utils \
            zstd \
            rsync \
            wget \
            git \
            patch \
            fakeroot

      # ------------------------------------------------------------
      # 2. Download Linux 6.12.30
      # ------------------------------------------------------------
      - name: Download Linux 6.12.30
        run: |
          set -eux

          wget -q --show-progress \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz

          tar -xf linux-${LINUX_VERSION}.tar.xz

          mv linux-${LINUX_VERSION} linux-${LINUX_VERSION}-daphile

      # ------------------------------------------------------------
      # 3. Download Linux 6.12.28
      #
      # RT patch 6.12.28-rt10 is based on Linux 6.12.28.
      # ------------------------------------------------------------
      - name: Download Linux RT base 6.12.28
        run: |
          set -eux

          wget -q --show-progress \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${RT_BASE_VERSION}.tar.xz

          tar -xf linux-${RT_BASE_VERSION}.tar.xz

      # ------------------------------------------------------------
      # 4. Download official PREEMPT_RT patch
      # ------------------------------------------------------------
      - name: Download official RT patch
        run: |
          set -eux

          wget -q --show-progress \
            https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz

          xz -d patch-${RT_VERSION}.patch.xz

          test -f patch-${RT_VERSION}.patch

      # ------------------------------------------------------------
      # 5. Initialize reference Linux 6.12.28 git repository
      # ------------------------------------------------------------
      - name: Initialize Linux 6.12.28 reference tree
        run: |
          set -eux

          cd linux-${RT_BASE_VERSION}

          git init

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Linux ${RT_BASE_VERSION} base"

          git tag linux-${RT_BASE_VERSION}-base

      # ------------------------------------------------------------
      # 6. Verify official RT patch
      # ------------------------------------------------------------
      - name: Verify RT patch
        run: |
          set -eux

          cd linux-${RT_BASE_VERSION}

          patch --dry-run -p1 < ../patch-${RT_VERSION}.patch

      # ------------------------------------------------------------
      # 7. Apply official PREEMPT_RT patch
      # ------------------------------------------------------------
      - name: Apply official PREEMPT_RT
        run: |
          set -eux

          cd linux-${RT_BASE_VERSION}

          patch -p1 < ../patch-${RT_VERSION}.patch

          echo
          echo "=== Git status after RT patch ==="

          git status --short

      # ------------------------------------------------------------
      # 8. Commit RT changes
      # ------------------------------------------------------------
      - name: Commit PREEMPT_RT tree
        run: |
          set -eux

          cd linux-${RT_BASE_VERSION}

          git add -A

          git commit \
            -m "Apply PREEMPT_RT ${RT_VERSION}"

          git tag rt-${RT_VERSION}

      # ------------------------------------------------------------
      # 9. Export RT-only patch
      # ------------------------------------------------------------
      - name: Export RT patch
        run: |
          set -eux

          cd linux-${RT_BASE_VERSION}

          git diff \
            linux-${RT_BASE_VERSION}-base \
            rt-${RT_VERSION} \
            > ../rt-${RT_VERSION}.patch

          echo
          echo "=== Generated RT patch ==="

          ls -lh ../rt-${RT_VERSION}.patch

          echo
          echo "Patch size:"
          wc -c ../rt-${RT_VERSION}.patch

          echo
          echo "Patch lines:"
          wc -l ../rt-${RT_VERSION}.patch

          test -s ../rt-${RT_VERSION}.patch

      # ------------------------------------------------------------
      # 10. Try applying RT patch to Linux 6.12.30
      #
      # First try normal patch.
      # If that fails, try git apply --3way.
      # ------------------------------------------------------------
      - name: Port PREEMPT_RT to Linux 6.12.30
        id: port_rt
        run: |
          set -u

          cd linux-${LINUX_VERSION}-daphile

          echo "=========================================="
          echo "Attempt 1: normal patch"
          echo "=========================================="

          if patch --dry-run -p1 < ../rt-${RT_VERSION}.patch; then

            echo "Normal patch applies cleanly."

            patch -p1 < ../rt-${RT_VERSION}.patch

          else

            echo
            echo "Normal patch failed."
            echo "Trying Git 3-way merge..."
            echo

            git apply \
              --3way \
              --verbose \
              ../rt-${RT_VERSION}.patch || true

            if git diff --check; then
              echo
              echo "Git 3-way application produced no whitespace errors."
            else
              echo
              echo "git diff --check reported problems."
            fi

          fi

          echo
          echo "=== Git status ==="
          git status --short

          echo
          echo "=== Conflict markers ==="

          CONFLICTS=$(grep -R \
            -n \
            -E '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            . \
            2>/dev/null || true)

          if [ -n "$CONFLICTS" ]; then

            echo "REAL MERGE CONFLICTS DETECTED:"
            echo

            echo "$CONFLICTS"

            mkdir -p ../rt-conflicts

            grep -R \
              -l \
              -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              . \
              2>/dev/null \
              | while read f; do
                  mkdir -p "../rt-conflicts/$(dirname "$f")"
                  cp "$f" "../rt-conflicts/$f"
                done

            echo "conflict" > ../rt-conflicts/STATUS

            exit 1
          fi

          echo
          echo "=========================================="
          echo "RT patch successfully ported"
          echo "=========================================="

      # ------------------------------------------------------------
      # 11. Configure kernel for external module build
      #
      # We do NOT build the complete kernel.
      #
      # The purpose of this repository is to provide:
      #
      #   .config
      #   Module.symvers
      #   generated headers
      #   scripts
      #   kernel source
      #
      # for Diretta ALSA module compilation.
      # ------------------------------------------------------------
      - name: Configure 6.12.30-daphile
        if: success()
        run: |
          set -eux

          cd linux-${LINUX_VERSION}-daphile

          make ARCH=x86_64 defconfig

          ./scripts/config \
            --enable CONFIG_PREEMPT_RT \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_MODVERSIONS

          ./scripts/config \
            --set-str CONFIG_LOCALVERSION "${DAPHILE_RELEASE}"

          make ARCH=x86_64 olddefconfig

          echo
          echo "=== Kernel release ==="

          make -s ARCH=x86_64 kernelrelease

          echo
          echo "=== RT configuration ==="

          grep -E \
            'CONFIG_PREEMPT|CONFIG_PREEMPT_RT|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_LOCALVERSION' \
            .config || true

      # ------------------------------------------------------------
      # 12. Prepare kernel build tree
      #
      # This is the important part for Diretta.
      # ------------------------------------------------------------
      - name: Prepare kernel build tree
        if: success()
        run: |
          set -eux

          cd linux-${LINUX_VERSION}-daphile

          make ARCH=x86_64 prepare
          make ARCH=x86_64 modules_prepare

          echo
          echo "=== Build tree prepared ==="

          test -f Makefile
          test -f .config

      # ------------------------------------------------------------
      # 13. Generate Module.symvers
      #
      # modules_prepare alone does NOT generate Module.symvers
      # when CONFIG_MODVERSIONS is enabled.
      #
      # Build enough kernel infrastructure to obtain exported
      # symbol information.
      # ------------------------------------------------------------
      - name: Generate Module.symvers
        if: success()
        run: |
          set -eux

          cd linux-${LINUX_VERSION}-daphile

          make -j"$(nproc)" \
            ARCH=x86_64 \
            modules

          if [ ! -f Module.symvers ]; then
            echo
            echo "ERROR: Module.symvers was not generated."
            exit 1
          fi

          ls -lh Module.symvers

      # ------------------------------------------------------------
      # 14. Set exact Daphile release string
      # ------------------------------------------------------------
      - name: Verify kernel release
        if: success()
        run: |
          set -eux

          cd linux-${LINUX_VERSION}-daphile

          RELEASE=$(make -s ARCH=x86_64 kernelrelease)

          echo "Kernel release: ${RELEASE}"

          case "${RELEASE}" in
            6.12.30-daphile)
              echo "Kernel release is correct."
              ;;
            *)
              echo "ERROR: unexpected kernel release: ${RELEASE}"
              exit 1
              ;;
          esac

      # ------------------------------------------------------------
      # 15. Remove unnecessary build output
      #
      # Keep source + generated build information.
      # This is intended to be consumed by repository 2.
      # ------------------------------------------------------------
      - name: Cleanup build tree
        if: success()
        run: |
          set -eux

          cd linux-${LINUX_VERSION}-daphile

          rm -rf \
            .git \
            Documentation \
            tools/testing \
            samples

          find . \
            -type f \
            \( \
              -name '*.o' \
              -o -name '*.a' \
              -o -name '*.cmd' \
              \) \
            -delete

      # ------------------------------------------------------------
      # 16. Package
      # ------------------------------------------------------------
      - name: Package kernel build tree
        if: success()
        run: |
          set -eux

          tar \
            --exclude='.git' \
            -cJf \
            linux-${LINUX_VERSION}-daphile-build.tar.xz \
            linux-${LINUX_VERSION}-daphile

          sha256sum \
            linux-${LINUX_VERSION}-daphile-build.tar.xz \
            > linux-${LINUX_VERSION}-daphile-build.sha256

          ls -lh \
            linux-${LINUX_VERSION}-daphile-build.tar.xz \
            linux-${LINUX_VERSION}-daphile-build.sha256

      # ------------------------------------------------------------
      # 17. Upload artifact
      # ------------------------------------------------------------
      - name: Upload build tree artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daphile-linux-${{ env.LINUX_VERSION }}-build
          path: |
            linux-${{ env.LINUX_VERSION }}-daphile-build.tar.xz
            linux-${{ env.LINUX_VERSION }}-daphile-build.sha256
            rt-conflicts/**
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 18. Create Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daphile-${{ env.LINUX_VERSION }}-rt
          name: Daphile Linux ${{ env.LINUX_VERSION }} RT Build Tree
          generate_release_notes: true
          files: |
            linux-${{ env.LINUX_VERSION }}-daphile-build.tar.xz
            linux-${{ env.LINUX_VERSION }}-daphile-build.sha256
