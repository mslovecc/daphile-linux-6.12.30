name: Build Daphile Linux Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"
  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch

      - name: Download Linux
        run: |
          set -eux

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

      - name: Download PREEMPT_RT
        run: |
          set -eux

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/${RT_BASE_VERSION}/patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

      - name: Apply PREEMPT_RT
        shell: bash
        run: |
          set -euo pipefail

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "PREEMPT_RT PORT"
          echo "=========================================="

          echo "Linux : ${LINUX_VERSION}"
          echo "RT    : ${RT_VERSION}"

          test -f Makefile
          test -d arch
          test -d include
          test -d kernel

          echo
          echo "=== RT patch dry-run ==="

          patch \
            --dry-run \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=== Applying RT patch ==="

          patch \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=== Checking rejected hunks ==="

          REJECTS=$(find . -type f -name '*.rej' -print)

          if [ -n "$REJECTS" ]; then
            echo "ERROR: rejected hunks detected:"
            echo "$REJECTS"
            exit 1
          fi

          echo
          echo "=== Checking conflict markers ==="

          CONFLICTS=$(
            grep -R \
              -l \
              -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              . \
              2>/dev/null || true
          )

          if [ -n "$CONFLICTS" ]; then
            echo "ERROR: conflict markers detected:"
            echo "$CONFLICTS"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "PREEMPT_RT SUCCESSFULLY APPLIED"
          echo "=========================================="

          echo
          echo "localversion-rt:"
          cat localversion-rt || true

      - name: Set Daphile version
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          echo "${DAPHILE_RELEASE}" > localversion-daphile

          echo "=== Kernel version ==="
          make kernelversion

      - name: Create kernel configuration
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          make ARCH=x86_64 defconfig

          echo
          echo "=== PREEMPT CONFIG ==="

          grep \
            -E '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT' \
            .config \
            || true

      - name: Prepare kernel
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          make ARCH=x86_64 olddefconfig

          make ARCH=x86_64 prepare

          make ARCH=x86_64 modules_prepare

      - name: Build kernel
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          NPROC=$(nproc)

          echo "CPU threads: ${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify build tree
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          echo
          echo "=========================================="
          echo "VERIFY"
          echo "=========================================="

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "Config:"
          ls -lh .config

          echo
          echo "Module.symvers:"
          ls -lh Module.symvers

          echo
          echo "System.map:"
          ls -lh System.map

          echo
          echo "Kernel image:"
          ls -lh arch/x86/boot/bzImage

      - name: Create release package
        shell: bash
        run: |
          set -eux

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          rm -rf release

          mkdir -p release

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          (
            cd "${KERNEL_DIR}"
            make kernelrelease
          ) > release/kernel.release

          cat > release/build-info.txt <<EOF
Linux version : ${LINUX_VERSION}
RT version    : ${RT_VERSION}
Daphile suffix: ${DAPHILE_RELEASE}

Kernel release:
$(cat release/kernel.release)

Compiler:
$(gcc --version | head -1)

Build date:
$(date -u '+%Y-%m-%d %H:%M:%S UTC')
EOF

          tar \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ko' \
            --exclude='*.tmp' \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=== RELEASE FILES ==="
          ls -lh release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.LINUX_VERSION }}-daphile-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-${{ env.LINUX_VERSION }}-daphile-rt
          name: Daphile Linux ${{ env.LINUX_VERSION }} RT
          body: |
            Daphile Linux kernel build tree.

            Linux: ${{ env.LINUX_VERSION }}
            PREEMPT_RT: ${{ env.RT_VERSION }}
            Daphile suffix: ${{ env.DAPHILE_RELEASE }}

            Intended for external kernel modules,
            including Diretta alsa_bridge.ko.
          files: |
            release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/build-info.txt
