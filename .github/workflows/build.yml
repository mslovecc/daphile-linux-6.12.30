name: Build Daphile Linux 6.12.30 PREEMPT_RT

on:
workflow_dispatch:

permissions:
contents: write

env:
LINUX_VERSION: "6.12.30"
RT_BASE_VERSION: "6.12.28"
RT_VERSION: "6.12.28-rt10"
DAPHILE_SUFFIX: "-daphile"

jobs:
build-kernel:
runs-on: ubuntu-22.04

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      set -e

      sudo apt-get update

      sudo apt-get install -y \
        build-essential \
        bc \
        bison \
        flex \
        libssl-dev \
        libelf-dev \
        libdw-dev \
        dwarves \
        cpio \
        rsync \
        kmod \
        xz-utils \
        zstd \
        wget \
        patch \
        git

  - name: Download Linux 6.12.28
    run: |
      set -e

      echo "Downloading Linux ${RT_BASE_VERSION}"

      wget -q \
        "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${RT_BASE_VERSION}.tar.xz"

      tar -xf \
        "linux-${RT_BASE_VERSION}.tar.xz"

      mv \
        "linux-${RT_BASE_VERSION}" \
        "linux-${LINUX_VERSION}-daphile"

  - name: Download PREEMPT_RT
    run: |
      set -e

      echo "Downloading RT ${RT_VERSION}"

      wget -q \
        "https://www.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz" \
        -O "patch-${RT_VERSION}.patch.xz"

      xz -d \
        "patch-${RT_VERSION}.patch.xz"

      mv \
        "patch-${RT_VERSION}.patch" \
        "rt-${RT_VERSION}.patch"

      ls -lh \
        "rt-${RT_VERSION}.patch"

  - name: Initialize kernel git tree
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      git init

      git config user.name "GitHub Actions"
      git config user.email "actions@github.com"

      git add .

      git commit \
        -m "Linux ${RT_BASE_VERSION}"

  - name: Apply PREEMPT_RT 6.12.28-rt10
    shell: bash
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      echo "=========================================="
      echo "APPLY PREEMPT_RT"
      echo "=========================================="

      echo "Base kernel : ${RT_BASE_VERSION}"
      echo "RT version  : ${RT_VERSION}"

      echo
      echo "Running patch dry-run..."

      patch \
        --dry-run \
        -p1 \
        < "../rt-${RT_VERSION}.patch"

      echo
      echo "Applying RT patch..."

      patch \
        -p1 \
        < "../rt-${RT_VERSION}.patch"

      echo
      echo "Checking rejected hunks..."

      REJECTS=$(find . -type f -name "*.rej" -print)

      if [ -n "${REJECTS}" ]; then
        echo "ERROR: rejected hunks found"
        echo "${REJECTS}"
        exit 1
      fi

      echo
      echo "Checking conflict markers..."

      CONFLICTS=$(
        grep -R \
          -l \
          -E '^(<<<<<<<|=======|>>>>>>>)' \
          --exclude-dir=.git \
          . \
          2>/dev/null || true
      )

      if [ -n "${CONFLICTS}" ]; then
        echo "ERROR: conflict markers found"
        echo "${CONFLICTS}"
        exit 1
      fi

      git add .

      git commit \
        -m "Apply PREEMPT_RT ${RT_VERSION}"

      echo
      echo "PREEMPT_RT applied successfully"

  - name: Download Linux 6.12.28 to 6.12.29 patch
    run: |
      set -e

      wget -q \
        "https://cdn.kernel.org/pub/linux/kernel/v6.x/incr/patch-6.12.28-29.xz" \
        -O patch-6.12.28-29.xz

      xz -d patch-6.12.28-29.xz

      ls -lh patch-6.12.28-29

  - name: Download Linux 6.12.29 to 6.12.30 patch
    run: |
      set -e

      wget -q \
        "https://cdn.kernel.org/pub/linux/kernel/v6.x/incr/patch-6.12.29-30.xz" \
        -O patch-6.12.29-30.xz

      xz -d patch-6.12.29-30.xz

      ls -lh patch-6.12.29-30

  - name: Apply Linux 6.12.28 to 6.12.29
    shell: bash
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      echo "=========================================="
      echo "APPLY STABLE 6.12.28 -> 6.12.29"
      echo "=========================================="

      echo
      echo "Dry run..."

      if patch \
        --dry-run \
        -p1 \
        < "../patch-6.12.28-29"; then

        echo "Dry run successful"

      else

        echo "ERROR: 6.12.28 -> 6.12.29 patch failed"

        find . \
          -type f \
          -name "*.rej" \
          -print

        exit 1
      fi

      echo
      echo "Applying..."

      patch \
        -p1 \
        < "../patch-6.12.28-29"

      if find . -type f -name "*.rej" | grep -q .; then
        echo "ERROR: rejected hunks detected"
        find . -type f -name "*.rej"
        exit 1
      fi

      git add .

      git commit \
        -m "Update Linux 6.12.28 to 6.12.29"

  - name: Apply Linux 6.12.29 to 6.12.30
    shell: bash
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      echo "=========================================="
      echo "APPLY STABLE 6.12.29 -> 6.12.30"
      echo "=========================================="

      echo
      echo "Dry run..."

      if patch \
        --dry-run \
        -p1 \
        < "../patch-6.12.29-30"; then

        echo "Dry run successful"

      else

        echo "ERROR: 6.12.29 -> 6.12.30 patch failed"

        find . \
          -type f \
          -name "*.rej" \
          -print

        exit 1
      fi

      echo
      echo "Applying..."

      patch \
        -p1 \
        < "../patch-6.12.29-30"

      if find . -type f -name "*.rej" | grep -q .; then
        echo "ERROR: rejected hunks detected"
        find . -type f -name "*.rej"
        exit 1
      fi

      git add .

      git commit \
        -m "Update Linux 6.12.29 to 6.12.30"

  - name: Set Daphile kernel version
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      echo "${DAPHILE_SUFFIX}" > localversion-daphile

      echo
      echo "Kernel version:"
      make kernelversion

  - name: Configure PREEMPT_RT
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      make ARCH=x86_64 defconfig

      echo
      echo "=========================================="
      echo "PREEMPT_RT CONFIG"
      echo "=========================================="

      grep \
        -E \
        '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT' \
        .config \
        || true

      echo
      echo "Enabling PREEMPT_RT..."

      ./scripts/config \
        --enable CONFIG_PREEMPT_RT

      ./scripts/config \
        --enable CONFIG_PREEMPT

      ./scripts/config \
        --enable CONFIG_SMP

      ./scripts/config \
        --enable CONFIG_MODULES

      ./scripts/config \
        --enable CONFIG_MODULE_UNLOAD

      make ARCH=x86_64 olddefconfig

      echo
      echo "Final PREEMPT configuration:"

      grep \
        -E \
        '^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
        .config \
        || true

  - name: Prepare kernel
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      make \
        ARCH=x86_64 \
        prepare

      make \
        ARCH=x86_64 \
        modules_prepare

  - name: Build kernel
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      NPROC=$(nproc)

      echo "CPU threads: ${NPROC}"

      make \
        ARCH=x86_64 \
        -j"${NPROC}" \
        bzImage \
        modules

  - name: Verify kernel
    run: |
      set -e

      cd "linux-${LINUX_VERSION}-daphile"

      echo "=========================================="
      echo "KERNEL VERIFICATION"
      echo "=========================================="

      echo
      echo "Kernel version:"
      make kernelversion

      echo
      echo "Kernel release:"
      make kernelrelease

      echo
      echo "PREEMPT_RT:"
      grep \
        -E \
        '^CONFIG_PREEMPT_RT=' \
        .config

      echo
      echo "SMP:"
      grep \
        -E \
        '^CONFIG_SMP=' \
        .config

      echo
      echo "Module unload:"
      grep \
        -E \
        '^CONFIG_MODULE_UNLOAD=' \
        .config

      echo
      echo "Module.symvers:"
      ls -lh Module.symvers

      echo
      echo "System.map:"
      ls -lh System.map

      echo
      echo "Kernel image:"
      ls -lh arch/x86/boot/bzImage

  - name: Create release package
    shell: bash
    run: |
      set -e

      KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

      rm -rf release

      mkdir -p release

      cp \
        "${KERNEL_DIR}/.config" \
        release/config

      cp \
        "${KERNEL_DIR}/Module.symvers" \
        release/Module.symvers

      cp \
        "${KERNEL_DIR}/System.map" \
        release/System.map

      (
        cd "${KERNEL_DIR}"
        make kernelrelease
      ) > release/kernel.release

      KERNEL_RELEASE=$(cat release/kernel.release)

      printf '%s\n' \
        "Linux version: ${LINUX_VERSION}" \
        "Kernel release: ${KERNEL_RELEASE}" \
        "PREEMPT_RT: ${RT_VERSION}" \
        "Compiler: $(gcc --version | head -1)" \
        "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
        "CONFIG_SMP: $(grep '^CONFIG_SMP=' "${KERNEL_DIR}/.config")" \
        "CONFIG_PREEMPT: $(grep '^CONFIG_PREEMPT=' "${KERNEL_DIR}/.config")" \
        "CONFIG_PREEMPT_RT: $(grep '^CONFIG_PREEMPT_RT=' "${KERNEL_DIR}/.config")" \
        "CONFIG_MODULE_UNLOAD: $(grep '^CONFIG_MODULE_UNLOAD=' "${KERNEL_DIR}/.config")" \
        > release/build-info.txt

      tar \
        --exclude='.git' \
        --exclude='*.o' \
        --exclude='*.a' \
        --exclude='*.ko' \
        --exclude='*.tmp' \
        -cJf \
        "release/linux-${LINUX_VERSION}-daphile-rt-build-tree.tar.xz" \
        "${KERNEL_DIR}"

      echo
      echo "=========================================="
      echo "RELEASE FILES"
      echo "=========================================="

      ls -lh release

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: linux-${{ env.LINUX_VERSION }}-daphile-rt-build
      path: release

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: linux-${{ env.LINUX_VERSION }}-daphile-rt10
      name: Daphile Linux 6.12.30 PREEMPT_RT
      body: |
        Daphile Linux 6.12.30 PREEMPT_RT kernel build tree.

        Base Linux:
        6.12.28 -> 6.12.29 -> 6.12.30

        PREEMPT_RT:
        6.12.28-rt10

        Final kernel release:
        6.12.30-daphile-rt10

        Configuration:
        SMP
        PREEMPT
        PREEMPT_RT
        MODULE_UNLOAD

        Intended for external kernel modules,
        including Diretta alsa_bridge.ko.

      files: |
        release/linux-6.12.30-daphile-rt-build-tree.tar.xz
        release/config
        release/Module.symvers
        release/System.map
        release/kernel.release
        release/build-info.txt
