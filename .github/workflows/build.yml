name: Build Daphile Linux 6.12.30 PREEMPT_RT

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"
  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch

      - name: Download Linux 6.12.30
        run: |
          set -e

          echo "=========================================="
          echo "Download Linux ${LINUX_VERSION}"
          echo "=========================================="

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

          echo
          echo "Linux source ready:"
          ls -ld \
            "linux-${LINUX_VERSION}-daphile"

      - name: Download official PREEMPT_RT patch
        run: |
          set -e

          echo "=========================================="
          echo "Download PREEMPT_RT"
          echo "=========================================="

          echo "Linux base : ${RT_BASE_VERSION}"
          echo "RT version  : ${RT_VERSION}"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz" \
            -O \
            "patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

          echo
          echo "RT patch:"
          ls -lh \
            "rt-${RT_VERSION}.patch"

      - name: Verify RT patch
        run: |
          set -e

          echo "=========================================="
          echo "Verify RT patch"
          echo "=========================================="

          test -s \
            "rt-${RT_VERSION}.patch"

          echo
          echo "Patch header:"
          head -30 \
            "rt-${RT_VERSION}.patch"

      - name: Apply PREEMPT_RT patch
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "Apply PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Linux:"
          echo "${LINUX_VERSION}"

          echo
          echo "RT:"
          echo "${RT_VERSION}"

          echo
          echo "=========================================="
          echo "PATCH DRY RUN"
          echo "=========================================="

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=========================================="
          echo "APPLY PATCH"
          echo "=========================================="

          patch \
            --batch \
            --forward \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=========================================="
          echo "CHECK REJECTED HUNKS"
          echo "=========================================="

          REJECTS=$(find . -type f -name '*.rej' -print)

          if [ -n "${REJECTS}" ]; then
            echo "ERROR: rejected hunks detected:"
            echo "${REJECTS}"
            exit 1
          fi

          echo "No rejected hunks."

          echo
          echo "=========================================="
          echo "CHECK REAL CONFLICT MARKERS"
          echo "=========================================="

          CONFLICTS=$(
            grep -R \
              -n \
              -E '^(<<<<<<<|>>>>>>>)( |$)' \
              --exclude-dir=.git \
              . \
              2>/dev/null || true
          )

          if [ -n "${CONFLICTS}" ]; then
            echo "ERROR: unresolved merge conflict markers detected:"
            echo
            echo "${CONFLICTS}"
            exit 1
          fi

          echo "No unresolved conflict markers."

          echo
          echo "=========================================="
          echo "RT PATCH APPLIED SUCCESSFULLY"
          echo "=========================================="

          echo
          echo "localversion-rt:"
          if [ -f localversion-rt ]; then
            cat localversion-rt
          else
            echo "No localversion-rt file"
          fi

      - name: Set Daphile kernel version
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "${DAPHILE_RELEASE}" \
            > localversion-daphile

          echo "=========================================="
          echo "Kernel version"
          echo "=========================================="

          make kernelversion

      - name: Create kernel configuration
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Create kernel configuration"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "=========================================="
          echo "Enable SMP"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_SMP

          echo
          echo "=========================================="
          echo "Enable PREEMPT_RT"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_PREEMPT_RT

          echo
          echo "=========================================="
          echo "Enable module unload"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_MODULE_UNLOAD

          echo
          echo "=========================================="
          echo "Enable modules"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_MODULES

          echo
          echo "=========================================="
          echo "Normalize configuration"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "IMPORTANT CONFIG"
          echo "=========================================="

          grep \
            -E \
            '^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPTION=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
            .config \
            || true

      - name: Prepare kernel
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Prepare kernel"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare

      - name: Build kernel
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Build Linux kernel"
          echo "=========================================="

          NPROC=$(nproc)

          echo "CPU threads: ${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify kernel build tree
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "VERIFY KERNEL BUILD"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "CONFIG_SMP:"
          grep '^CONFIG_SMP=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT:"
          grep '^CONFIG_PREEMPT=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' \
            .config \
            || true

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep '^CONFIG_MODULE_UNLOAD=' \
            .config \
            || true

          echo
          echo "Config:"
          ls -lh \
            .config

          echo
          echo "Module.symvers:"
          ls -lh \
            Module.symvers

          echo
          echo "System.map:"
          ls -lh \
            System.map

          echo
          echo "Kernel image:"
          ls -lh \
            arch/x86/boot/bzImage

      - name: Verify kernel release
        run: |
          set -e

          cd \
            "linux-${LINUX_VERSION}-daphile"

          KERNEL_RELEASE=$(make kernelrelease)

          echo "=========================================="
          echo "KERNEL RELEASE"
          echo "=========================================="

          echo "${KERNEL_RELEASE}"

          echo "${KERNEL_RELEASE}" \
            > ../kernel.release

          echo
          echo "Expected base:"
          echo "${LINUX_VERSION}-daphile"

          case "${KERNEL_RELEASE}" in
            6.12.30-daphile*)
              echo "Kernel release prefix is correct."
              ;;
            *)
              echo "ERROR: unexpected kernel release:"
              echo "${KERNEL_RELEASE}"
              exit 1
              ;;
          esac

      - name: Create release package
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          rm -rf release

          mkdir -p release

          echo "=========================================="
          echo "Create release package"
          echo "=========================================="

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          cp \
            kernel.release \
            release/kernel.release

          cp \
            "${KERNEL_DIR}/arch/x86/boot/bzImage" \
            release/bzImage

          echo "=========================================="
          echo "Build information"
          echo "=========================================="

          KERNEL_RELEASE=$(cat release/kernel.release)

          printf '%s\n' \
            "Linux version: ${LINUX_VERSION}" \
            "PREEMPT_RT: ${RT_VERSION}" \
            "Daphile suffix: ${DAPHILE_RELEASE}" \
            "Kernel release: ${KERNEL_RELEASE}" \
            "Architecture: x86_64" \
            "SMP: enabled" \
            "PREEMPT_RT: enabled" \
            "Module unload: enabled" \
            "Compiler: $(gcc --version | head -1)" \
            "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            > release/build-info.txt

          echo
          cat release/build-info.txt

          echo
          echo "=========================================="
          echo "Create build tree archive"
          echo "=========================================="

          tar \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ko' \
            --exclude='*.tmp' \
            --exclude='*.cmd' \
            --exclude='*.d' \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          sha256sum \
            release/* \
            > release/SHA256SUMS

          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh \
            release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.30-daphile-rt-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-6.12.30-daphile-rt
          name: Daphile Linux 6.12.30 PREEMPT_RT
          body: |
            Daphile Linux 6.12.30 PREEMPT_RT kernel build tree.

            Linux:
            6.12.30

            PREEMPT_RT:
            6.12.28-rt10

            Architecture:
            x86_64

            Configuration:
            SMP enabled
            PREEMPT_RT enabled
            MODULE_UNLOAD enabled

            The build tree is intended for compiling
            external kernel modules such as Diretta
            alsa_bridge.ko.

          files: |
            release/linux-6.12.30-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/bzImage
            release/build-info.txt
            release/SHA256SUMS
