name: Build Daphile Linux Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"

  # PREEMPT_RT
  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch


      # ============================================================
      # Download Linux
      # ============================================================

      - name: Download Linux ${LINUX_VERSION}
        run: |
          set -eux

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

          ls -ld \
            "linux-${LINUX_VERSION}-daphile"


      # ============================================================
      # Download PREEMPT_RT
      # ============================================================

      - name: Download PREEMPT_RT ${RT_VERSION}
        run: |
          set -eux

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/${RT_BASE_VERSION}/patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

          ls -lh \
            "rt-${RT_VERSION}.patch"


      # ============================================================
      # Apply PREEMPT_RT
      # ============================================================

      - name: Apply PREEMPT_RT
        shell: bash
        run: |
          set -euo pipefail

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "PREEMPT_RT PORT"
          echo "=========================================="

          echo "Linux : ${LINUX_VERSION}"
          echo "RT    : ${RT_VERSION}"
          echo

          test -f Makefile
          test -d arch
          test -d include
          test -d kernel

          echo "=========================================="
          echo "RT patch dry-run"
          echo "=========================================="

          if patch \
              --dry-run \
              -p1 \
              < "../rt-${RT_VERSION}.patch"
          then
            echo
            echo "RT patch applies successfully."
          else
            echo
            echo "ERROR: RT patch cannot be applied."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Applying RT patch"
          echo "=========================================="

          patch \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=========================================="
          echo "Checking rejected hunks"
          echo "=========================================="

          REJECTS=$(
            find . \
              -type f \
              -name '*.rej' \
              -print
          )

          if [ -n "$REJECTS" ]; then
            echo
            echo "ERROR: Rejected hunks:"
            echo "$REJECTS"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Checking conflict markers"
          echo "=========================================="

          CONFLICT_FILES=$(
            grep -R \
              -l \
              -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              . \
              2>/dev/null || true
          )

          if [ -n "$CONFLICT_FILES" ]; then
            echo
            echo "ERROR: Conflict markers detected:"
            echo "$CONFLICT_FILES"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "PREEMPT_RT SUCCESSFULLY APPLIED"
          echo "=========================================="

          echo
          echo "localversion-rt:"

          if [ -f localversion-rt ]; then
            cat localversion-rt
          fi


      # ============================================================
      # Daphile kernel version
      # ============================================================

      - name: Set Daphile kernel version
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          echo "${DAPHILE_RELEASE}" > localversion-daphile

          echo
          echo "=== localversion-rt ==="
          cat localversion-rt || true

          echo
          echo "=== localversion-daphile ==="
          cat localversion-daphile

          echo
          echo "=== Kernel version ==="
          make kernelversion


      # ============================================================
      # Create kernel config
      # ============================================================

      - name: Create kernel configuration
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "Creating x86_64 kernel configuration"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "=== PREEMPT CONFIG ==="

          grep \
            -E '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT' \
            .config \
            || true


      # ============================================================
      # Prepare kernel
      # ============================================================

      - name: Prepare kernel build tree
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          make \
            ARCH=x86_64 \
            olddefconfig

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare


      # ============================================================
      # Build kernel
      #
      # This generates Module.symvers.
      # Repository 2 will use this build tree.
      # ============================================================

      - name: Build kernel
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          NPROC=$(nproc)

          echo "CPU threads: ${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules


      # ============================================================
      # Verify
      # ============================================================

      - name: Verify kernel build tree
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          echo
          echo "=========================================="
          echo "VERIFY BUILD TREE"
          echo "=========================================="

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "Config:"
          ls -lh .config

          echo
          echo "Module.symvers:"
          ls -lh Module.symvers

          echo
          echo "System.map:"
          ls -lh System.map

          echo
          echo "Kernel image:"
          ls -lh arch/x86/boot/bzImage


      # ============================================================
      # Create release package
      # ============================================================

      - name: Create release package
        shell: bash
        run: |
          set -eux

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          rm -rf release

          mkdir -p release

          # --------------------------------------------------------
          # Required files
          # --------------------------------------------------------

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          (
            cd "${KERNEL_DIR}"
            make kernelrelease
          ) > release/kernel.release

          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          cat > release/build-info.txt <<EOF
Linux version : ${LINUX_VERSION}
RT version    : ${RT_VERSION}
Daphile suffix: ${DAPHILE_RELEASE}

Kernel release:
$(cat release/kernel.release)

Compiler:
$(gcc --version | head -1)

Build date:
$(date -u '+%Y-%m-%d %H:%M:%S UTC')
EOF

          # --------------------------------------------------------
          # Package complete kernel build tree
          # --------------------------------------------------------

          tar \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ko' \
            --exclude='*.tmp' \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh release


      # ============================================================
      # GitHub Actions artifact
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.LINUX_VERSION }}-daphile-build
          path: release/


      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "linux-${{ env.LINUX_VERSION }}-daphile-rt"
          name: "Daphile Linux ${{ env.LINUX_VERSION }} RT"
          body: |
            Daphile Linux kernel build tree.

            Linux:
            ${{ env.LINUX_VERSION }}

            PREEMPT_RT:
            ${{ env.RT_VERSION }}

            Daphile suffix:
            ${{ env.DAPHILE_RELEASE }}

            This release is intended for building
            external kernel modules such as Diretta
            alsa_bridge.ko.

            Included:

            - linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
            - config
            - Module.symvers
            - System.map
            - kernel.release
            - build-info.txt

          files: |
            release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/build-info.txt

          fail_on_unmatched_files: false
