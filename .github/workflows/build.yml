name: Build Daphile Linux 6.12.30 RT Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"

  # 当前已经验证可以 clean apply 的 RT patch
  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"

  DAPHILE_RELEASE: "-daphile"

jobs:
  build-kernel:

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch \
            python3


      # ============================================================
      # 3. Download Linux 6.12.30
      # ============================================================

      - name: Download Linux kernel
        run: |
          set -eux

          KERNEL_TARBALL="linux-${LINUX_VERSION}.tar.xz"
          KERNEL_URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/${KERNEL_TARBALL}"

          echo "Downloading:"
          echo "${KERNEL_URL}"

          wget -nv \
            "${KERNEL_URL}"

          test -f "${KERNEL_TARBALL}"

          tar -xf "${KERNEL_TARBALL}"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

          echo
          echo "Linux source ready:"
          ls -ld "linux-${LINUX_VERSION}-daphile"


      # ============================================================
      # 4. Download PREEMPT_RT
      # ============================================================

      - name: Download PREEMPT RT
        run: |
          set -eux

          RT_TARBALL="patch-${RT_VERSION}.patch.xz"

          RT_URL="https://cdn.kernel.org/pub/linux/kernel/projects/rt/${RT_BASE_VERSION}/older/${RT_TARBALL}"

          echo "Downloading:"
          echo "${RT_URL}"

          wget -nv \
            "${RT_URL}"

          test -f "${RT_TARBALL}"

          xz -d \
            "${RT_TARBALL}"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

          test -f "rt-${RT_VERSION}.patch"

          echo
          echo "RT patch:"
          ls -lh "rt-${RT_VERSION}.patch"


      # ============================================================
      # 5. Apply PREEMPT_RT
      #
      # 不依赖 git
      # ============================================================

      - name: Apply PREEMPT RT
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "PREEMPT_RT PATCH"
          echo "=========================================="

          echo "Linux:"
          make kernelversion

          echo
          echo "RT:"
          echo "${RT_VERSION}"

          echo
          echo "=== Patch dry-run ==="

          patch \
            --dry-run \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=== Applying patch ==="

          patch \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=== Checking .rej files ==="

          if find . \
              -type f \
              -name '*.rej' \
              -print \
              | grep -q .; then

            echo "ERROR: rejected hunks found"

            find . \
              -type f \
              -name '*.rej' \
              -print

            exit 1
          fi

          echo
          echo "=== Checking .orig files ==="

          find . \
            -type f \
            -name '*.orig' \
            -print \
            || true

          echo
          echo "=== Checking conflict markers ==="

          if grep -R \
              -n \
              -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              . \
              2>/dev/null; then

            echo
            echo "ERROR: merge conflict markers detected"

            exit 1
          fi

          echo
          echo "=== RT localversion ==="

          if [ -f localversion-rt ]; then
            cat localversion-rt
          fi

          echo
          echo "PREEMPT_RT patch applied successfully."


      # ============================================================
      # 6. Daphile local version
      # ============================================================

      - name: Set Daphile kernel version
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          echo "${DAPHILE_RELEASE}" > localversion-daphile

          echo
          echo "=== Kernel version ==="

          make kernelversion

          echo
          echo "=== Kernel release before config ==="

          make kernelrelease || true


      # ============================================================
      # 7. Kernel configuration
      #
      # 注意：
      # 这里使用 upstream defconfig。
      #
      # 这不是 Daphile 官方 .config。
      # 如果以后找到官方 Daphile config，
      # 在这里替换即可。
      # ============================================================

      - name: Create kernel configuration
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "=== PREEMPT CONFIG ==="

          grep \
            -E \
            '^CONFIG_PREEMPT|^CONFIG_PREEMPT_RT' \
            .config \
            || true

          echo
          echo "=== MODULE CONFIG ==="

          grep \
            -E \
            '^CONFIG_MODULES=' \
            .config \
            || true


      # ============================================================
      # 8. Force required module configuration
      #
      # 对外部 alsa_bridge.ko 很重要
      # ============================================================

      - name: Configure kernel modules
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          ./scripts/config \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_MODVERSIONS

          make \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "=== Final module configuration ==="

          grep \
            -E \
            '^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=|^CONFIG_MODVERSIONS=' \
            .config


      # ============================================================
      # 9. Prepare kernel build tree
      # ============================================================

      - name: Prepare kernel
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare


      # ============================================================
      # 10. Build kernel
      #
      # 必须真正编译 kernel/modules，
      # 这样才能得到可靠的 Module.symvers。
      # ============================================================

      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          NPROC="$(nproc)"

          echo "CPU threads:"
          echo "${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules


      # ============================================================
      # 11. Verify build tree
      # ============================================================

      - name: Verify kernel build
        shell: bash
        run: |
          set -eux

          cd "linux-${LINUX_VERSION}-daphile"

          echo
          echo "=========================================="
          echo "KERNEL BUILD VERIFICATION"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "Config:"
          test -f .config
          ls -lh .config

          echo
          echo "Module.symvers:"
          test -f Module.symvers
          ls -lh Module.symvers

          echo
          echo "System.map:"
          test -f System.map
          ls -lh System.map

          echo
          echo "Kernel image:"
          test -f arch/x86/boot/bzImage
          ls -lh arch/x86/boot/bzImage

          echo
          echo "Generated headers:"
          test -d include/generated
          test -d arch/x86/include/generated

          echo
          echo "Build tree verification successful."


      # ============================================================
      # 12. Create release directory
      # ============================================================

      - name: Create release package
        shell: bash
        run: |
          set -eux

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          rm -rf release

          mkdir -p release


      # ============================================================
      # 13. Export important files
      # ============================================================

      - name: Export kernel metadata
        shell: bash
        run: |
          set -eux

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          (
            cd "${KERNEL_DIR}"
            make kernelrelease
          ) > release/kernel.release

          cat > release/build-info.txt <<EOF
Linux version : ${LINUX_VERSION}
RT version    : ${RT_VERSION}
Daphile suffix: ${DAPHILE_RELEASE}

Kernel release:
$(cat release/kernel.release)

Compiler:
$(gcc --version | head -1)

Build date:
$(date -u '+%Y-%m-%d %H:%M:%S UTC')
EOF

          echo
          echo "=== RELEASE METADATA ==="

          ls -lh release


      # ============================================================
      # 14. Create complete build tree
      #
      # 不删除 .o / generated files。
      #
      # 仓库2需要尽可能完整的 KBUILD tree。
      # ============================================================

      - name: Package complete kernel build tree
        shell: bash
        run: |
          set -eux

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          tar \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=== BUILD TREE ==="

          ls -lh \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz"


      # ============================================================
      # 15. Upload artifact
      # ============================================================

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.LINUX_VERSION }}-daphile-build
          path: release/
          retention-days: 30


      # ============================================================
      # 16. Create GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: linux-${{ env.LINUX_VERSION }}-daphile-rt

          name: Daphile Linux ${{ env.LINUX_VERSION }} PREEMPT_RT

          generate_release_notes: false

          body: |
            # Daphile Linux kernel build tree

            Linux:
            ${{ env.LINUX_VERSION }}

            PREEMPT_RT:
            ${{ env.RT_VERSION }}

            Daphile suffix:
            ${{ env.DAPHILE_RELEASE }}

            This release contains the kernel build tree
            required for building external kernel modules.

            Important files:

            - config
            - Module.symvers
            - System.map
            - kernel.release
            - build-info.txt
            - linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz

            Intended use:

            External kernel modules such as
            Diretta alsa_bridge.ko.

          files: |
            release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/build-info.txt
