name: Build Daphile Linux Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch \
            gcc-11 \
            g++-11

      - name: Download Linux 6.12.30
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOAD LINUX"
          echo "=========================================="

          echo "Linux version: ${LINUX_VERSION}"

          wget \
            -q \
            --show-progress \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" \
            -O "linux-${LINUX_VERSION}.tar.xz"

          test -s "linux-${LINUX_VERSION}.tar.xz"

          echo
          echo "Linux archive:"
          ls -lh "linux-${LINUX_VERSION}.tar.xz"

          tar \
            -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

          test -f "linux-${LINUX_VERSION}-daphile/Makefile"

          echo
          echo "Linux source ready."

      - name: Download PREEMPT_RT
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOAD PREEMPT_RT"
          echo "=========================================="

          echo "RT version: ${RT_VERSION}"

          RT_URL="https://www.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz"

          echo
          echo "RT URL:"
          echo "${RT_URL}"

          wget \
            -q \
            --show-progress \
            "${RT_URL}" \
            -O "patch-${RT_VERSION}.patch.xz"

          test -s "patch-${RT_VERSION}.patch.xz"

          echo
          echo "Downloaded RT patch:"
          ls -lh "patch-${RT_VERSION}.patch.xz"

          xz \
            -d \
            "patch-${RT_VERSION}.patch.xz"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

          test -s "rt-${RT_VERSION}.patch"

          echo
          echo "RT patch ready:"
          ls -lh "rt-${RT_VERSION}.patch"

      - name: Inspect RT patch
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSPECT RT PATCH"
          echo "=========================================="

          echo
          echo "Patch header:"
          head -30 "rt-${RT_VERSION}.patch"

          echo
          echo "Patch statistics:"
          grep -c '^diff --git ' "rt-${RT_VERSION}.patch" || true

          echo
          echo "Patch size:"
          wc -l "rt-${RT_VERSION}.patch"

      - name: Apply PREEMPT_RT
        shell: bash
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"
          RT_PATCH="rt-${RT_VERSION}.patch"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "APPLY PREEMPT_RT"
          echo "=========================================="

          echo "Linux : ${LINUX_VERSION}"
          echo "RT    : ${RT_VERSION}"

          test -f "../${RT_PATCH}"
          test -f Makefile
          test -d arch
          test -d include
          test -d kernel

          echo
          echo "=========================================="
          echo "STEP 1: PATCH DRY RUN"
          echo "=========================================="

          set +e

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "../${RT_PATCH}" \
            > ../rt-dry-run.log \
            2>&1

          DRY_RC=$?

          set -e

          echo
          echo "Dry-run exit code: ${DRY_RC}"

          echo
          echo "Dry-run summary:"

          grep \
            -E \
            'checking file|Hunk|FAILED|Reversed|Skipping|fuzz|offset' \
            ../rt-dry-run.log \
            | tail -100 \
            || true

          if [ "${DRY_RC}" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "DRY RUN FAILED"
            echo "=========================================="

            cat ../rt-dry-run.log

            exit 1
          fi

          echo
          echo "Dry-run passed."

          echo
          echo "=========================================="
          echo "STEP 2: APPLY PATCH"
          echo "=========================================="

          set +e

          patch \
            --batch \
            --forward \
            -p1 \
            < "../${RT_PATCH}" \
            > ../rt-apply.log \
            2>&1

          PATCH_RC=$?

          set -e

          echo
          echo "Patch exit code: ${PATCH_RC}"

          echo
          echo "Patch summary:"

          grep \
            -E \
            'patching file|Hunk|FAILED|Reversed|Skipping|fuzz|offset' \
            ../rt-apply.log \
            | tail -100 \
            || true

          if [ "${PATCH_RC}" -ne 0 ]; then
            echo
            echo "=========================================="
            echo "PATCH APPLICATION FAILED"
            echo "=========================================="

            cat ../rt-apply.log

            exit 1
          fi

          echo
          echo "=========================================="
          echo "STEP 3: CHECK REJECTED HUNKS"
          echo "=========================================="

          REJECT_COUNT=$(find . -type f -name '*.rej' | wc -l)

          echo "Rejected files: ${REJECT_COUNT}"

          if [ "${REJECT_COUNT}" -gt 0 ]; then
            echo
            echo "ERROR: rejected hunks detected."

            find . \
              -type f \
              -name '*.rej' \
              -print

            echo
            echo "Reject contents:"

            while IFS= read -r file; do
              echo
              echo "------------------------------------------"
              echo "${file}"
              echo "------------------------------------------"
              cat "${file}"
            done < <(
              find . \
                -type f \
                -name '*.rej'
            )

            exit 1
          fi

          echo
          echo "No rejected hunks."

          echo
          echo "=========================================="
          echo "STEP 4: CHECK ORIGINAL BACKUPS"
          echo "=========================================="

          ORIG_COUNT=$(find . -type f -name '*.orig' | wc -l)

          echo "Backup files: ${ORIG_COUNT}"

          if [ "${ORIG_COUNT}" -gt 0 ]; then
            echo
            echo "Removing .orig files."

            find . \
              -type f \
              -name '*.orig' \
              -delete
          fi

          echo
          echo "=========================================="
          echo "STEP 5: CHECK CONFLICT MARKERS"
          echo "=========================================="

          CONFLICTS=$(
            grep \
              -R \
              -n \
              -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              . \
              2>/dev/null \
              || true
          )

          if [ -n "${CONFLICTS}" ]; then
            echo
            echo "ERROR: conflict markers detected:"
            echo "${CONFLICTS}"
            exit 1
          fi

          echo
          echo "No conflict markers."

          echo
          echo "=========================================="
          echo "PREEMPT_RT PATCH APPLIED SUCCESSFULLY"
          echo "=========================================="

          echo
          echo "localversion-rt:"

          if [ -f localversion-rt ]; then
            cat localversion-rt
          else
            echo "localversion-rt not found"
          fi

      - name: Configure Daphile kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "CONFIGURE KERNEL"
          echo "=========================================="

          export ARCH=x86_64
          export CC=gcc-11

          make defconfig

          echo
          echo "Enable PREEMPT_RT."

          ./scripts/config \
            --enable PREEMPT_RT

          ./scripts/config \
            --enable PREEMPT

          make olddefconfig

          echo
          echo "=========================================="
          echo "PREEMPT CONFIGURATION"
          echo "=========================================="

          grep \
            -E \
            '^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPTION=' \
            .config \
            || true

      - name: Verify PREEMPT_RT configuration
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT"
          echo "=========================================="

          if grep -q '^CONFIG_PREEMPT_RT=y' .config; then
            echo "CONFIG_PREEMPT_RT=y"
          else
            echo
            echo "ERROR: CONFIG_PREEMPT_RT=y not enabled."
            exit 1
          fi

      - name: Prepare kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          export ARCH=x86_64
          export CC=gcc-11

          echo "=========================================="
          echo "PREPARE KERNEL"
          echo "=========================================="

          make olddefconfig

          make prepare

          make modules_prepare

      - name: Set Daphile kernel version
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "${DAPHILE_RELEASE}" > localversion-daphile

          echo "=========================================="
          echo "KERNEL VERSION"
          echo "=========================================="

          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

      - name: Build kernel
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          export ARCH=x86_64
          export CC=gcc-11

          NPROC=$(nproc)

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          echo "CPU threads: ${NPROC}"

          make \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify kernel build tree
        shell: bash
        run: |
          set -e

          cd "linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "VERIFY BUILD TREE"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' .config

          echo
          echo "PREEMPT:"
          grep '^CONFIG_PREEMPT=' .config

          echo
          echo "Config:"
          ls -lh .config

          echo
          echo "Module.symvers:"
          ls -lh Module.symvers

          echo
          echo "System.map:"
          ls -lh System.map

          echo
          echo "Kernel image:"
          ls -lh arch/x86/boot/bzImage

      - name: Create release package
        shell: bash
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          echo "=========================================="
          echo "CREATE RELEASE PACKAGE"
          echo "=========================================="

          rm -rf release

          mkdir -p release

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          (
            cd "${KERNEL_DIR}"
            make kernelrelease
          ) > release/kernel.release

          KERNEL_RELEASE=$(cat release/kernel.release)

          echo "Linux version: ${LINUX_VERSION}" > release/build-info.txt
          echo "Kernel release: ${KERNEL_RELEASE}" >> release/build-info.txt
          echo "PREEMPT_RT: ${RT_VERSION}" >> release/build-info.txt
          echo "Daphile suffix: ${DAPHILE_RELEASE}" >> release/build-info.txt
          echo "Compiler: $(gcc-11 --version | head -1)" >> release/build-info.txt
          echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release/build-info.txt

          echo
          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="

          cat release/build-info.txt

          echo
          echo "=========================================="
          echo "CREATE BUILD TREE ARCHIVE"
          echo "=========================================="

          ARCHIVE="release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz"

          tar \
            -C "${KERNEL_DIR}" \
            --exclude=.git \
            --exclude='*.o' \
            --exclude='*.ko' \
            --exclude='*.a' \
            --exclude='*.tmp' \
            --exclude='*.cmd' \
            --exclude='*.d' \
            --exclude='*.mod' \
            --exclude='*.mod.c' \
            --exclude='*.order' \
            --exclude='*.symtypes' \
            --exclude='modules.order' \
            -cJf \
            "${GITHUB_WORKSPACE}/${ARCHIVE}" \
            .

          test -s "${ARCHIVE}"

          echo
          echo "Archive:"
          ls -lh "${ARCHIVE}"

          echo
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          sha256sum \
            release/* \
            > release/SHA256SUMS

          echo
          echo "Release files:"
          ls -lh release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.LINUX_VERSION }}-daphile-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-${{ env.LINUX_VERSION }}-daphile-rt
          name: Daphile Linux ${{ env.LINUX_VERSION }} RT
          body: |
            Daphile Linux kernel build tree.

            Linux: ${{ env.LINUX_VERSION }}
            PREEMPT_RT: ${{ env.RT_VERSION }}
            Daphile suffix: ${{ env.DAPHILE_RELEASE }}

            Target module vermagic:

            6.12.30-daphile SMP preempt_rt mod_unload

            Intended for external kernel modules,
            including Diretta alsa_bridge.ko.
          files: |
            release/linux-${{ env.LINUX_VERSION }}-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/build-info.txt
            release/SHA256SUMS
