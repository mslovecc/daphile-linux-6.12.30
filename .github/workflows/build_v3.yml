name: v3 Build Daphile Linux 6.12.30 PREEMPT_RT

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.28"
  TARGET_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"
  RT_VERSION: "6.12.28-rt10"
  KERNEL_RELEASE: "6.12.30-daphile"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch

      - name: Download Linux 6.12.28
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD LINUX ${LINUX_VERSION}"
          echo "=========================================="

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          test -s \
            "linux-${LINUX_VERSION}.tar.xz"

          echo
          echo "Kernel archive:"
          ls -lh \
            "linux-${LINUX_VERSION}.tar.xz"

          echo
          echo "Extracting..."

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${TARGET_VERSION}-daphile"

          echo
          echo "Kernel source:"
          ls -ld \
            "linux-${TARGET_VERSION}-daphile"

      - name: Download official PREEMPT_RT patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD PREEMPT_RT PATCH"
          echo "=========================================="

          echo
          echo "Base kernel:"
          echo "${LINUX_VERSION}"

          echo
          echo "RT version:"
          echo "${RT_VERSION}"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz" \
            -O \
            "patch-${RT_VERSION}.patch.xz"

          test -s \
            "patch-${RT_VERSION}.patch.xz"

          echo
          echo "RT archive:"
          ls -lh \
            "patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          test -s \
            "patch-${RT_VERSION}.patch"

          echo
          echo "RT patch:"
          ls -lh \
            "patch-${RT_VERSION}.patch"

      - name: Verify RT patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY PREEMPT_RT PATCH"
          echo "=========================================="

          test -s \
            "patch-${RT_VERSION}.patch"

          echo
          echo "Patch header:"
          head -30 \
            "patch-${RT_VERSION}.patch"

          echo
          echo "Patch verified."

      - name: Apply PREEMPT_RT patch
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "APPLY PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Kernel source:"
          echo "${KERNEL_DIR}"

          echo
          echo "Base version:"
          echo "${LINUX_VERSION}"

          echo
          echo "RT version:"
          echo "${RT_VERSION}"

          echo
          echo "=========================================="
          echo "PATCH DRY RUN"
          echo "=========================================="

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "../patch-${RT_VERSION}.patch"

          echo
          echo "Dry run successful."

          echo
          echo "=========================================="
          echo "APPLY PATCH"
          echo "=========================================="

          patch \
            --batch \
            --forward \
            -p1 \
            < "../patch-${RT_VERSION}.patch"

          echo
          echo "Patch applied."

          echo
          echo "=========================================="
          echo "CHECK REJECTS"
          echo "=========================================="

          REJECTS="$(find . -type f -name '*.rej' -print)"

          if [ -n "${REJECTS}" ]; then
            echo "ERROR: rejected patch hunks detected:"
            echo
            echo "${REJECTS}"
            exit 1
          fi

          echo "No rejected hunks."

      - name: Force kernel version to 6.12.30-daphile
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "FORCE KERNEL VERSION"
          echo "=========================================="

          echo
          echo "RT patch source version:"
          make kernelversion

          echo
          echo "Changing kernel version fields:"
          echo "6.12.28 -> 6.12.30"

          sed -i \
            -E \
            's/^SUBLEVEL[[:space:]]*=[[:space:]]*28$/SUBLEVEL = 30/' \
            Makefile

          rm -f \
            localversion-rt

          printf '%s\n' \
            "${DAPHILE_RELEASE}" \
            > localversion-daphile

          echo
          echo "Makefile version fields:"
          grep \
            -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          echo
          echo "localversion-daphile:"
          cat \
            localversion-daphile

          echo
          echo "Kernel version:"
          make kernelversion

      - name: Create kernel configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "CREATE KERNEL CONFIGURATION"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "=========================================="
          echo "ENABLE REQUIRED CONFIGURATION"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_EXPERT

          ./scripts/config \
            --enable CONFIG_SMP

          ./scripts/config \
            --enable CONFIG_MODULES

          ./scripts/config \
            --enable CONFIG_MODULE_UNLOAD

          ./scripts/config \
            --enable CONFIG_PREEMPT_RT

          echo
          echo "=========================================="
          echo "DISABLE PREEMPT_DYNAMIC"
          echo "=========================================="

          ./scripts/config \
            --disable CONFIG_PREEMPT_DYNAMIC

          echo
          echo "=========================================="
          echo "NORMALIZE CONFIGURATION"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "IMPORTANT CONFIGURATION"
          echo "=========================================="

          grep \
            -E \
            '^CONFIG_EXPERT=|^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPT_DYNAMIC=|^CONFIG_PREEMPTION=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
            .config \
            || true

      - name: Verify PREEMPT_RT configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT CONFIGURATION"
          echo "=========================================="

          echo
          echo "CONFIG_EXPERT:"
          grep '^CONFIG_EXPERT=' \
            .config \
            || true

          echo
          echo "CONFIG_SMP:"
          grep '^CONFIG_SMP=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT:"
          grep '^CONFIG_PREEMPT=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT_DYNAMIC:"
          grep '^CONFIG_PREEMPT_DYNAMIC=' \
            .config \
            || echo "CONFIG_PREEMPT_DYNAMIC is not set"

          echo
          echo "CONFIG_MODULES:"
          grep '^CONFIG_MODULES=' \
            .config \
            || true

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep '^CONFIG_MODULE_UNLOAD=' \
            .config \
            || true

          echo
          echo "=========================================="
          echo "CHECK REQUIRED CONFIGURATION"
          echo "=========================================="

          grep -q '^CONFIG_EXPERT=y' \
            .config

          grep -q '^CONFIG_SMP=y' \
            .config

          grep -q '^CONFIG_PREEMPT_RT=y' \
            .config

          grep -q '^CONFIG_MODULES=y' \
            .config

          grep -q '^CONFIG_MODULE_UNLOAD=y' \
            .config

          if grep -q '^CONFIG_PREEMPT_DYNAMIC=y' .config; then
            echo
            echo "ERROR: CONFIG_PREEMPT_DYNAMIC=y"
            echo "PREEMPT_DYNAMIC must not be enabled."
            exit 1
          fi

          echo
          echo "PREEMPT_RT configuration is correct."

      - name: Prepare kernel
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "PREPARE KERNEL"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare

          echo
          echo "Kernel preparation completed."

      - name: Verify kernel release before build
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL RELEASE"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(make kernelrelease)"

          echo
          echo "Actual:"
          echo "${KERNEL_RELEASE_ACTUAL}"

          echo
          echo "Expected:"
          echo "${KERNEL_RELEASE}"

          if [ "${KERNEL_RELEASE_ACTUAL}" != "${KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            exit 1
          fi

          echo
          echo "Kernel release verified."

          printf '%s\n' \
            "${KERNEL_RELEASE_ACTUAL}" \
            > "${GITHUB_WORKSPACE}/kernel.release"

      - name: Build kernel
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          NPROC="$(nproc)"

          echo
          echo "CPU threads:"
          echo "${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify kernel build
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL BUILD"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' \
            .config

          echo
          echo "CONFIG_PREEMPT_DYNAMIC:"
          grep '^CONFIG_PREEMPT_DYNAMIC=' \
            .config \
            || echo "CONFIG_PREEMPT_DYNAMIC is not set"

          echo
          echo "Kernel image:"
          ls -lh \
            arch/x86/boot/bzImage

          echo
          echo "Module.symvers:"
          ls -lh \
            Module.symvers

          echo
          echo "System.map:"
          ls -lh \
            System.map

          echo
          echo "Kernel build completed."

      - name: Verify external module PREEMPT_RT
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"
          TEST_DIR="${GITHUB_WORKSPACE}/test-external-module"

          echo "=========================================="
          echo "VERIFY EXTERNAL MODULE PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Kernel build tree:"
          echo "${KERNEL_DIR}"

          echo
          echo "Expected kernel release:"
          echo "${KERNEL_RELEASE}"

          rm -rf \
            "${TEST_DIR}"

          mkdir -p \
            "${TEST_DIR}"

          printf '%s\n' \
            '#include <linux/module.h>' \
            '#include <linux/kernel.h>' \
            '' \
            'static int __init test_module_init(void)' \
            '{' \
            '    pr_info("Daphile PREEMPT_RT module test loaded\n");' \
            '    return 0;' \
            '}' \
            '' \
            'static void __exit test_module_exit(void)' \
            '{' \
            '    pr_info("Daphile PREEMPT_RT module test unloaded\n");' \
            '}' \
            '' \
            'module_init(test_module_init);' \
            'module_exit(test_module_exit);' \
            '' \
            'MODULE_LICENSE("GPL");' \
            'MODULE_AUTHOR("Daphile");' \
            'MODULE_DESCRIPTION("Daphile PREEMPT_RT external module test");' \
            > "${TEST_DIR}/test_module.c"

          printf '%s\n' \
            'obj-m += test_module.o' \
            > "${TEST_DIR}/Makefile"

          echo
          echo "Test source:"
          cat \
            "${TEST_DIR}/test_module.c"

          echo
          echo "Test Makefile:"
          cat \
            "${TEST_DIR}/Makefile"

          echo
          echo "=========================================="
          echo "BUILD TEST MODULE"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${TEST_DIR}" \
            modules

          KO="${TEST_DIR}/test_module.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: test_module.ko was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "VERIFY TEST MODULE"
          echo "=========================================="

          echo
          echo "Module:"
          ls -lh \
            "${KO}"

          echo
          echo "File:"
          file \
            "${KO}"

          echo
          echo "modinfo:"
          modinfo \
            "${KO}"

          TEST_VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo
          echo "=========================================="
          echo "ACTUAL VERMAGIC"
          echo "=========================================="

          echo "${TEST_VERMAGIC}"

          echo
          echo "=========================================="
          echo "VERIFY PREEMPT_RT VERMAGIC"
          echo "=========================================="

          case "${TEST_VERMAGIC}" in
            "${KERNEL_RELEASE}"*"preempt_rt"*"mod_unload"*)
              echo
              echo "PREEMPT_RT vermagic VERIFIED."
              ;;
            *)
              echo
              echo "ERROR: PREEMPT_RT vermagic is incorrect."
              echo
              echo "Expected:"
              echo "${KERNEL_RELEASE} ... preempt_rt ... mod_unload"
              echo
              echo "Actual:"
              echo "${TEST_VERMAGIC}"
              exit 1
              ;;
          esac

          echo
          echo "=========================================="
          echo "EXTERNAL MODULE PREEMPT_RT VERIFIED"
          echo "=========================================="

      - name: Create release package
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          rm -rf \
            release

          mkdir -p \
            release

          echo "=========================================="
          echo "CREATE RELEASE PACKAGE"
          echo "=========================================="

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          cp \
            "${KERNEL_DIR}/arch/x86/boot/bzImage" \
            release/bzImage

          cp \
            "${GITHUB_WORKSPACE}/kernel.release" \
            release/kernel.release

          printf '%s\n' \
            "Linux source: ${LINUX_VERSION}" \
            "Target kernel release: ${KERNEL_RELEASE}" \
            "PREEMPT_RT patch: ${RT_VERSION}" \
            "Architecture: x86_64" \
            "SMP: enabled" \
            "PREEMPT_RT: enabled" \
            "PREEMPT_DYNAMIC: disabled" \
            "MODULES: enabled" \
            "MODULE_UNLOAD: enabled" \
            "External module vermagic: verified" \
            "Compiler: $(gcc --version | head -1)" \
            "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            > release/build-info.txt

          echo
          echo "Build information:"
          cat \
            release/build-info.txt

          echo
          echo "=========================================="
          echo "CREATE BUILD TREE ARCHIVE"
          echo "=========================================="

          tar \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ko' \
            --exclude='*.cmd' \
            --exclude='*.d' \
            --exclude='*.tmp' \
            -cJf \
            "release/linux-${TARGET_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          sha256sum \
            release/* \
            > release/SHA256SUMS

          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh \
            release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.30-daphile-rt-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-6.12.30-daphile-rt
          name: Daphile Linux 6.12.30 PREEMPT_RT
          body: |
            Daphile Linux 6.12.30 PREEMPT_RT kernel build.

            Source kernel:
            Linux 6.12.28

            PREEMPT_RT:
            6.12.28-rt10

            Forced kernel release:
            6.12.30-daphile

            Architecture:
            x86_64

            Configuration:
            CONFIG_EXPERT=y
            CONFIG_SMP=y
            CONFIG_PREEMPT_RT=y
            CONFIG_PREEMPT_DYNAMIC=n
            CONFIG_MODULES=y
            CONFIG_MODULE_UNLOAD=y

            External module verification:
            test_module.ko was compiled against the
            final kernel build tree and its vermagic
            was verified to contain:

            6.12.30-daphile SMP preempt_rt mod_unload

            This build tree is intended for compiling
            external kernel modules such as Diretta
            alsa_bridge.ko.

          files: |
            release/linux-6.12.30-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/bzImage
            release/build-info.txt
            release/SHA256SUMS
