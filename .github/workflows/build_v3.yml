name: v3 Build Daphile Linux 6.12.30 PREEMPT_RT

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_BASE_VERSION: "6.12.28"
  TARGET_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch

      - name: Download Linux 6.12.28
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD LINUX ${LINUX_BASE_VERSION}"
          echo "=========================================="

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_BASE_VERSION}.tar.xz"

          test -s \
            "linux-${LINUX_BASE_VERSION}.tar.xz"

          echo
          echo "Linux archive:"
          ls -lh \
            "linux-${LINUX_BASE_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_BASE_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_BASE_VERSION}" \
            "linux-${TARGET_VERSION}-daphile"

          echo
          echo "Kernel source:"
          ls -ld \
            "linux-${TARGET_VERSION}-daphile"

      - name: Download PREEMPT_RT patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD PREEMPT_RT PATCH"
          echo "=========================================="

          echo "Base kernel:"
          echo "${LINUX_BASE_VERSION}"

          echo
          echo "RT version:"
          echo "${RT_VERSION}"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz" \
            -O \
            "patch-${RT_VERSION}.patch.xz"

          test -s \
            "patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          test -s \
            "patch-${RT_VERSION}.patch"

          echo
          echo "RT patch:"
          ls -lh \
            "patch-${RT_VERSION}.patch"

      - name: Verify RT patch
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY RT PATCH"
          echo "=========================================="

          test -s \
            "patch-${RT_VERSION}.patch"

          echo
          echo "Patch header:"
          head -30 \
            "patch-${RT_VERSION}.patch"

      - name: Apply PREEMPT_RT patch
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "APPLY PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Kernel source:"
          pwd

          echo
          echo "RT patch:"
          echo "${RT_VERSION}"

          echo
          echo "=========================================="
          echo "PATCH DRY RUN"
          echo "=========================================="

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch"

          echo
          echo "=========================================="
          echo "APPLY PATCH"
          echo "=========================================="

          patch \
            --batch \
            --forward \
            -p1 \
            < "${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch"

          echo
          echo "=========================================="
          echo "CHECK PATCH REJECTS"
          echo "=========================================="

          if find . -type f -name "*.rej" | grep -q .; then
            echo "ERROR: rejected patch hunks found:"
            find . -type f -name "*.rej"
            exit 1
          fi

          echo "No rejected hunks."

          echo
          echo "PREEMPT_RT patch applied."

      - name: Force kernel version to 6.12.30-daphile
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "FORCE KERNEL VERSION"
          echo "=========================================="

          echo
          echo "Original Makefile version:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          echo
          echo "Changing SUBLEVEL 28 -> 30"

          sed -i \
            -E \
            's/^SUBLEVEL[[:space:]]*=[[:space:]]*28$/SUBLEVEL = 30/' \
            Makefile

          rm -f \
            localversion-rt

          printf '%s\n' \
            "${DAPHILE_RELEASE}" \
            > localversion-daphile

          echo
          echo "Updated Makefile version:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          echo
          echo "localversion files:"
          ls -la \
            localversion* \
            2>/dev/null || true

          echo
          echo "localversion-daphile:"
          cat \
            localversion-daphile

      - name: Create kernel configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "CREATE KERNEL CONFIGURATION"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "Enable required configuration"

          ./scripts/config \
            --enable CONFIG_EXPERT

          ./scripts/config \
            --enable CONFIG_SMP

          ./scripts/config \
            --enable CONFIG_MODULES

          ./scripts/config \
            --enable CONFIG_MODULE_UNLOAD

          ./scripts/config \
            --enable CONFIG_PREEMPT_RT

          echo
          echo "Disable PREEMPT_DYNAMIC"

          ./scripts/config \
            --disable CONFIG_PREEMPT_DYNAMIC

          echo
          echo "Normalize configuration"

          make \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "IMPORTANT CONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_EXPERT=|^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPT_DYNAMIC=|^CONFIG_PREEMPTION=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
            .config \
            || true

      - name: Verify PREEMPT_RT configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT CONFIGURATION"
          echo "=========================================="

          echo
          echo "CONFIG_EXPERT:"
          grep \
            '^CONFIG_EXPERT=' \
            .config

          echo
          echo "CONFIG_SMP:"
          grep \
            '^CONFIG_SMP=' \
            .config

          echo
          echo "CONFIG_PREEMPT:"
          grep \
            '^CONFIG_PREEMPT=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep \
            '^CONFIG_PREEMPT_RT=' \
            .config

          echo
          echo "CONFIG_PREEMPT_DYNAMIC:"
          grep \
            '^CONFIG_PREEMPT_DYNAMIC=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPTION:"
          grep \
            '^CONFIG_PREEMPTION=' \
            .config \
            || true

          echo
          echo "CONFIG_MODULES:"
          grep \
            '^CONFIG_MODULES=' \
            .config

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep \
            '^CONFIG_MODULE_UNLOAD=' \
            .config

          echo
          echo "=========================================="
          echo "CHECK REQUIRED CONFIG"
          echo "=========================================="

          grep -q \
            '^CONFIG_EXPERT=y$' \
            .config

          grep -q \
            '^CONFIG_SMP=y$' \
            .config

          grep -q \
            '^CONFIG_PREEMPT_RT=y$' \
            .config

          grep -q \
            '^CONFIG_MODULES=y$' \
            .config

          grep -q \
            '^CONFIG_MODULE_UNLOAD=y$' \
            .config

          if grep -q \
            '^CONFIG_PREEMPT_DYNAMIC=y$' \
            .config; then
            echo
            echo "ERROR: CONFIG_PREEMPT_DYNAMIC is enabled."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "PREEMPT_RT CONFIGURATION VERIFIED"
          echo "=========================================="

      - name: Prepare kernel
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "PREPARE KERNEL"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare

      - name: Verify kernel release before build
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL RELEASE"
          echo "=========================================="

          KERNEL_RELEASE="$(make kernelrelease)"

          echo
          echo "Actual:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Expected:"
          echo "6.12.30-daphile"

          if [ "${KERNEL_RELEASE}" != "6.12.30-daphile" ]; then
            echo
            echo "ERROR: kernel release is incorrect."
            exit 1
          fi

          printf '%s\n' \
            "${KERNEL_RELEASE}" \
            > "${GITHUB_WORKSPACE}/kernel.release"

          echo
          echo "Kernel release verified."

      - name: Build kernel
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "BUILD LINUX KERNEL"
          echo "=========================================="

          NPROC="$(nproc)"

          echo
          echo "CPU threads:"
          echo "${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify kernel build
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL BUILD"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Kernel release:"
          make kernelrelease

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep \
            '^CONFIG_PREEMPT_RT=' \
            .config

          echo
          echo "CONFIG_PREEMPT_DYNAMIC:"
          grep \
            '^CONFIG_PREEMPT_DYNAMIC=' \
            .config \
            || true

          echo
          echo "CONFIG_MODULES:"
          grep \
            '^CONFIG_MODULES=' \
            .config

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep \
            '^CONFIG_MODULE_UNLOAD=' \
            .config

          echo
          echo "Kernel image:"
          ls -lh \
            arch/x86/boot/bzImage

          echo
          echo "Module.symvers:"
          ls -lh \
            Module.symvers

          echo
          echo "System.map:"
          ls -lh \
            System.map

      - name: Verify external module PREEMPT_RT
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"
          TEST_DIR="${GITHUB_WORKSPACE}/test-external-module"

          echo "=========================================="
          echo "VERIFY EXTERNAL MODULE PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Kernel build tree:"
          echo "${KERNEL_DIR}"

          echo
          echo "Expected kernel release:"
          echo "6.12.30-daphile"

          ACTUAL_RELEASE="$(make -s -C "${KERNEL_DIR}" kernelrelease)"

          echo
          echo "Actual kernel release:"
          echo "${ACTUAL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "6.12.30-daphile" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            exit 1
          fi

          rm -rf \
            "${TEST_DIR}"

          mkdir -p \
            "${TEST_DIR}"

          cat > "${TEST_DIR}/test_module.c" <<'EOF'
#include <linux/module.h>
#include <linux/kernel.h>

static int __init test_module_init(void)
{
    pr_info("Daphile PREEMPT_RT module test loaded\n");
    return 0;
}

static void __exit test_module_exit(void)
{
    pr_info("Daphile PREEMPT_RT module test unloaded\n");
}

module_init(test_module_init);
module_exit(test_module_exit);

MODULE_LICENSE("GPL");
MODULE_AUTHOR("Daphile");
MODULE_DESCRIPTION("Daphile PREEMPT_RT external module test");
EOF

          cat > "${TEST_DIR}/Makefile" <<'EOF'
obj-m += test_module.o
EOF

          echo
          echo "=========================================="
          echo "BUILD TEST MODULE"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            CC=gcc \
            M="${TEST_DIR}" \
            modules

          KO="${TEST_DIR}/test_module.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: test_module.ko was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "TEST MODULE INFO"
          echo "=========================================="

          ls -lh \
            "${KO}"

          echo
          file \
            "${KO}"

          echo
          modinfo \
            "${KO}"

          TEST_VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo
          echo "=========================================="
          echo "ACTUAL VERMAGIC"
          echo "=========================================="

          echo "${TEST_VERMAGIC}"

          echo
          echo "=========================================="
          echo "VERIFY PREEMPT_RT VERMAGIC"
          echo "=========================================="

          EXPECTED_PREFIX="6.12.30-daphile"

          case "${TEST_VERMAGIC}" in
            "${EXPECTED_PREFIX}"*"preempt_rt"*"mod_unload"*)
              echo
              echo "PREEMPT_RT vermagic VERIFIED."
              ;;
            *)
              echo
              echo "ERROR: PREEMPT_RT vermagic is incorrect."
              echo
              echo "Expected:"
              echo "6.12.30-daphile ... preempt_rt ... mod_unload"
              echo
              echo "Actual:"
              echo "${TEST_VERMAGIC}"
              exit 1
              ;;
          esac

          echo
          echo "=========================================="
          echo "EXTERNAL MODULE PREEMPT_RT VERIFIED"
          echo "=========================================="

      - name: Create release package
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          rm -rf \
            "${GITHUB_WORKSPACE}/release"

          mkdir -p \
            "${GITHUB_WORKSPACE}/release"

          echo "=========================================="
          echo "CREATE RELEASE PACKAGE"
          echo "=========================================="

          cp \
            "${KERNEL_DIR}/.config" \
            "${GITHUB_WORKSPACE}/release/config"

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            "${GITHUB_WORKSPACE}/release/Module.symvers"

          cp \
            "${KERNEL_DIR}/System.map" \
            "${GITHUB_WORKSPACE}/release/System.map"

          cp \
            "${KERNEL_DIR}/arch/x86/boot/bzImage" \
            "${GITHUB_WORKSPACE}/release/bzImage"

          cp \
            "${GITHUB_WORKSPACE}/kernel.release" \
            "${GITHUB_WORKSPACE}/release/kernel.release"

          printf '%s\n' \
            "Linux source base: ${LINUX_BASE_VERSION}" \
            "RT patch: ${RT_VERSION}" \
            "Forced kernel release: 6.12.30-daphile" \
            "Architecture: x86_64" \
            "CONFIG_SMP=y" \
            "CONFIG_PREEMPT_RT=y" \
            "CONFIG_PREEMPT_DYNAMIC=n" \
            "CONFIG_MODULES=y" \
            "CONFIG_MODULE_UNLOAD=y" \
            "External module vermagic verified: preempt_rt" \
            "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            > "${GITHUB_WORKSPACE}/release/build-info.txt"

          echo
          echo "Build information:"
          cat \
            "${GITHUB_WORKSPACE}/release/build-info.txt"

      - name: Create build tree archive
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

          echo "=========================================="
          echo "CREATE BUILD TREE ARCHIVE"
          echo "=========================================="

          tar \
            --exclude=".git" \
            --exclude="*.o" \
            --exclude="*.a" \
            --exclude="*.ko" \
            --exclude="*.tmp" \
            --exclude="*.cmd" \
            --exclude="*.d" \
            -cJf \
            "${GITHUB_WORKSPACE}/release/linux-${TARGET_VERSION}-daphile-build-tree.tar.xz" \
            -C "${GITHUB_WORKSPACE}" \
            "linux-${TARGET_VERSION}-daphile"

          ls -lh \
            "${GITHUB_WORKSPACE}/release/linux-${TARGET_VERSION}-daphile-build-tree.tar.xz"

      - name: Create checksums
        run: |
          set -euo pipefail

          cd \
            "${GITHUB_WORKSPACE}/release"

          sha256sum \
            bzImage \
            config \
            Module.symvers \
            System.map \
            kernel.release \
            build-info.txt \
            "linux-${TARGET_VERSION}-daphile-build-tree.tar.xz" \
            > SHA256SUMS

          echo "=========================================="
          echo "SHA256SUMS"
          echo "=========================================="

          cat \
            SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.30-daphile-rt-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-6.12.30-daphile-rt
          name: Daphile Linux 6.12.30 PREEMPT_RT
          body: |
            Daphile Linux PREEMPT_RT kernel build.

            Source kernel:
            Linux 6.12.28

            PREEMPT_RT:
            6.12.28-rt10

            Forced kernel release:
            6.12.30-daphile

            Architecture:
            x86_64

            Configuration:
            CONFIG_SMP=y
            CONFIG_PREEMPT_RT=y
            CONFIG_PREEMPT_DYNAMIC=n
            CONFIG_MODULES=y
            CONFIG_MODULE_UNLOAD=y

            The build tree was verified by compiling
            an external test module.

            Required external module vermagic:
            6.12.30-daphile SMP preempt_rt mod_unload

            The build tree is intended for compiling
            external kernel modules such as Diretta alsa_bridge.ko.

          files: |
            release/linux-6.12.30-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/bzImage
            release/build-info.txt
            release/SHA256SUMS
