name: Build Daphile Linux 6.12.30 PREEMPT_RT

on:
workflow_dispatch:

permissions:
contents: write

env:
LINUX_VERSION: "6.12.28"
TARGET_VERSION: "6.12.30"
DAPHILE_RELEASE: "-daphile"
RT_VERSION: "6.12.28-rt10"

jobs:
build-kernel:
runs-on: ubuntu-22.04

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install build dependencies
    shell: bash
    run: |
      set -euo pipefail

      sudo apt-get update

      sudo apt-get install -y \
        build-essential \
        bc \
        bison \
        flex \
        libssl-dev \
        libelf-dev \
        libdw-dev \
        dwarves \
        cpio \
        rsync \
        kmod \
        xz-utils \
        zstd \
        wget \
        patch

  - name: Download Linux 6.12.28
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "DOWNLOAD LINUX SOURCE"
      echo "=========================================="

      echo "Source version:"
      echo "${LINUX_VERSION}"

      wget -q \
        "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz" \
        -O \
        "linux-${LINUX_VERSION}.tar.xz"

      echo
      echo "Archive:"
      ls -lh \
        "linux-${LINUX_VERSION}.tar.xz"

      echo
      echo "Extracting..."

      tar -xf \
        "linux-${LINUX_VERSION}.tar.xz"

      mv \
        "linux-${LINUX_VERSION}" \
        "linux-${TARGET_VERSION}-daphile"

      echo
      echo "Kernel source:"
      ls -ld \
        "linux-${TARGET_VERSION}-daphile"

  - name: Download PREEMPT_RT patch
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "DOWNLOAD PREEMPT_RT PATCH"
      echo "=========================================="

      echo "RT patch:"
      echo "${RT_VERSION}"

      wget -q \
        "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz" \
        -O \
        "patch-${RT_VERSION}.patch.xz"

      echo
      echo "RT archive:"
      ls -lh \
        "patch-${RT_VERSION}.patch.xz"

      xz -d \
        "patch-${RT_VERSION}.patch.xz"

      mv \
        "patch-${RT_VERSION}.patch" \
        "rt-${RT_VERSION}.patch"

      echo
      echo "RT patch:"
      ls -lh \
        "rt-${RT_VERSION}.patch"

  - name: Verify RT patch
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "VERIFY PREEMPT_RT PATCH"
      echo "=========================================="

      if [ ! -s "rt-${RT_VERSION}.patch" ]; then
        echo "ERROR: RT patch does not exist."
        exit 1
      fi

      echo
      echo "Patch:"
      ls -lh \
        "rt-${RT_VERSION}.patch"

      echo
      echo "Patch header:"
      head -30 \
        "rt-${RT_VERSION}.patch"

  - name: Apply PREEMPT_RT patch
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

      cd "${KERNEL_DIR}"

      echo "=========================================="
      echo "APPLY PREEMPT_RT"
      echo "=========================================="

      echo
      echo "Kernel source:"
      pwd

      echo
      echo "RT patch:"
      echo "${RT_VERSION}"

      echo
      echo "=========================================="
      echo "PATCH DRY RUN"
      echo "=========================================="

      patch \
        --dry-run \
        --batch \
        --forward \
        -p1 \
        < "../rt-${RT_VERSION}.patch"

      echo
      echo "Dry run successful."

      echo
      echo "=========================================="
      echo "APPLY PATCH"
      echo "=========================================="

      patch \
        --batch \
        --forward \
        -p1 \
        < "../rt-${RT_VERSION}.patch"

      echo
      echo "Patch applied."

      echo
      echo "=========================================="
      echo "CHECK REJECTS"
      echo "=========================================="

      REJECTS="$(find . -type f -name '*.rej' -print)"

      if [ -n "${REJECTS}" ]; then
        echo "ERROR: rejected patch hunks found:"
        echo "${REJECTS}"
        exit 1
      fi

      echo "No rejected hunks."

      echo
      echo "=========================================="
      echo "CHECK CONFLICT MARKERS"
      echo "=========================================="

      CONFLICTS="$(
        grep -R \
          -n \
          -E '^(<<<<<<<|=======|>>>>>>>)' \
          --exclude-dir=.git \
          . \
          2>/dev/null || true
      )"

      if [ -n "${CONFLICTS}" ]; then
        echo "ERROR: conflict markers detected:"
        echo
        echo "${CONFLICTS}"
        exit 1
      fi

      echo "No conflict markers."

  - name: Force kernel version to 6.12.30
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

      cd "${KERNEL_DIR}"

      echo "=========================================="
      echo "FORCE KERNEL VERSION"
      echo "=========================================="

      echo
      echo "Original kernel version:"
      make kernelversion

      echo
      echo "Changing source version:"
      echo "6.12.28 -> 6.12.30"

      sed -i \
        's/^VERSION = 6$/VERSION = 6/' \
        Makefile

      sed -i \
        's/^PATCHLEVEL = 12$/PATCHLEVEL = 12/' \
        Makefile

      sed -i \
        's/^SUBLEVEL = 28$/SUBLEVEL = 30/' \
        Makefile

      rm -f \
        localversion-rt

      printf '%s\n' \
        "${DAPHILE_RELEASE}" \
        > localversion-daphile

      echo
      echo "Kernel Makefile version:"
      grep -E \
        '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
        Makefile

      echo
      echo "localversion-daphile:"
      cat \
        localversion-daphile

      echo
      echo "Kernel version after modification:"
      make kernelversion

  - name: Create PREEMPT_RT configuration
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${TARGET_VERSION}-daphile"

      cd "${KERNEL_DIR}"

      echo "=========================================="
      echo "CREATE PREEMPT_RT CONFIGURATION"
      echo "=========================================="

      make \
        ARCH=x86_64 \
        defconfig

      echo
      echo "=========================================="
      echo "ENABLE REQUIRED OPTIONS"
      echo "=========================================="

      ./scripts/config \
        --enable CONFIG_EXPERT

      ./scripts/config \
        --enable CONFIG_SMP

      ./scripts/config \
        --enable CONFIG_MODULES

      ./scripts/config \
        --enable CONFIG_MODULE_UNLOAD

      ./scripts/config \
        --enable CONFIG_PREEMPT_RT
