name: v3 Build Daphile Linux 6.12.30 PREEMPT_RT

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # IMPORTANT:
  # The actual Linux source is 6.12.28 because the selected
  # PREEMPT_RT patch is 6.12.28-rt10.
  LINUX_SOURCE_VERSION: "6.12.28"

  # Artificial/final Daphile kernel release identifier.
  KERNEL_RELEASE: "6.12.30-daphile"

  DAPHILE_RELEASE: "-daphile"

  RT_BASE_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch


      # ============================================================
      # DOWNLOAD LINUX 6.12.28
      # ============================================================

      - name: Download Linux 6.12.28
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD LINUX SOURCE"
          echo "=========================================="

          echo
          echo "Linux source:"
          echo "${LINUX_SOURCE_VERSION}"

          URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_SOURCE_VERSION}.tar.xz"

          echo
          echo "URL:"
          echo "${URL}"

          wget -q \
            "${URL}" \
            -O \
            "linux-${LINUX_SOURCE_VERSION}.tar.xz"

          echo
          echo "Archive:"
          ls -lh \
            "linux-${LINUX_SOURCE_VERSION}.tar.xz"

          echo
          echo "Extracting..."

          tar -xf \
            "linux-${LINUX_SOURCE_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_SOURCE_VERSION}" \
            "linux-${LINUX_SOURCE_VERSION}-daphile"

          echo
          echo "Kernel source directory:"
          ls -ld \
            "linux-${LINUX_SOURCE_VERSION}-daphile"


      # ============================================================
      # DOWNLOAD RT PATCH
      # ============================================================

      - name: Download PREEMPT_RT patch
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOAD PREEMPT_RT PATCH"
          echo "=========================================="

          echo
          echo "RT base:"
          echo "${RT_BASE_VERSION}"

          echo
          echo "RT version:"
          echo "${RT_VERSION}"

          RT_URL="https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz"

          echo
          echo "RT patch URL:"
          echo "${RT_URL}"

          wget -q \
            "${RT_URL}" \
            -O \
            "patch-${RT_VERSION}.patch.xz"

          echo
          echo "RT archive:"
          ls -lh \
            "patch-${RT_VERSION}.patch.xz"

          xz -d \
            "patch-${RT_VERSION}.patch.xz"

          mv \
            "patch-${RT_VERSION}.patch" \
            "rt-${RT_VERSION}.patch"

          echo
          echo "RT patch:"
          ls -lh \
            "rt-${RT_VERSION}.patch"


      # ============================================================
      # VERIFY RT PATCH
      # ============================================================

      - name: Verify PREEMPT_RT patch
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY PREEMPT_RT PATCH"
          echo "=========================================="

          test -s \
            "rt-${RT_VERSION}.patch"

          echo
          echo "Patch size:"
          ls -lh \
            "rt-${RT_VERSION}.patch"

          echo
          echo "Patch header:"
          head -30 \
            "rt-${RT_VERSION}.patch"


      # ============================================================
      # APPLY RT PATCH
      # ============================================================

      - name: Apply PREEMPT_RT patch
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "APPLY PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Linux source:"
          echo "${LINUX_SOURCE_VERSION}"

          echo
          echo "RT patch:"
          echo "${RT_VERSION}"

          echo
          echo "=========================================="
          echo "PATCH DRY RUN"
          echo "=========================================="

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=========================================="
          echo "APPLY PATCH"
          echo "=========================================="

          patch \
            --batch \
            --forward \
            -p1 \
            < "../rt-${RT_VERSION}.patch"

          echo
          echo "=========================================="
          echo "CHECK REJECTED HUNKS"
          echo "=========================================="

          REJECTS="$(
            find . \
              -type f \
              -name '*.rej' \
              -print
          )"

          if [ -n "${REJECTS}" ]; then
            echo
            echo "ERROR: rejected hunks detected:"
            echo "${REJECTS}"
            exit 1
          fi

          echo "No rejected hunks."

          echo
          echo "=========================================="
          echo "CHECK CONFLICT MARKERS"
          echo "=========================================="

          CONFLICTS="$(
            grep -R \
              -n \
              -E '^(<<<<<<<|>>>>>>>)( |$)' \
              --exclude-dir=.git \
              . \
              2>/dev/null || true
          )"

          if [ -n "${CONFLICTS}" ]; then
            echo
            echo "ERROR: unresolved conflict markers:"
            echo
            echo "${CONFLICTS}"
            exit 1
          fi

          echo
          echo "No unresolved conflict markers."

          echo
          echo "=========================================="
          echo "PREEMPT_RT PATCH APPLIED"
          echo "=========================================="


      # ============================================================
      # SET FINAL DAPHILE KERNEL RELEASE
      # ============================================================

      - name: Set Daphile kernel release
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "SET DAPHILE KERNEL RELEASE"
          echo "=========================================="

          echo
          echo "Source kernel:"
          echo "${LINUX_SOURCE_VERSION}"

          echo
          echo "RT patch:"
          echo "${RT_VERSION}"

          echo
          echo "Target kernel release:"
          echo "${KERNEL_RELEASE}"

          # Do NOT use the RT patch localversion.
          rm -f \
            localversion-rt

          # Daphile release suffix.
          printf '%s\n' \
            "${DAPHILE_RELEASE}" \
            > localversion-daphile

          echo
          echo "localversion files:"

          ls -la \
            localversion* \
            2>/dev/null || true

          echo
          echo "localversion-daphile:"
          cat \
            localversion-daphile

          echo
          echo "Kernel version:"
          make \
            ARCH=x86_64 \
            kernelversion


      # ============================================================
      # CREATE BASE CONFIG
      # ============================================================

      - name: Create kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "CREATE KERNEL CONFIGURATION"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            defconfig

          echo
          echo "=========================================="
          echo "ENABLE REQUIRED OPTIONS"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_EXPERT

          ./scripts/config \
            --enable CONFIG_SMP

          ./scripts/config \
            --enable CONFIG_PREEMPT_RT

          ./scripts/config \
            --disable CONFIG_PREEMPT_DYNAMIC

          ./scripts/config \
            --enable CONFIG_MODULES

          ./scripts/config \
            --enable CONFIG_MODULE_UNLOAD

          echo
          echo "=========================================="
          echo "NORMALIZE CONFIGURATION"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            olddefconfig

          echo
          echo "=========================================="
          echo "IMPORTANT CONFIG"
          echo "=========================================="

          grep \
            -E \
            '^CONFIG_EXPERT=|^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPT_DYNAMIC=|^CONFIG_PREEMPTION=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
            .config \
            || true


      # ============================================================
      # STRICT CONFIG VERIFICATION
      # ============================================================

      - name: Verify PREEMPT_RT configuration
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT CONFIGURATION"
          echo "=========================================="

          echo
          echo "CONFIG_EXPERT:"
          grep \
            '^CONFIG_EXPERT=' \
            .config \
            || true

          echo
          echo "CONFIG_SMP:"
          grep \
            '^CONFIG_SMP=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT:"
          grep \
            '^CONFIG_PREEMPT=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPTION:"
          grep \
            '^CONFIG_PREEMPTION=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep \
            '^CONFIG_PREEMPT_RT=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT_DYNAMIC:"
          grep \
            '^CONFIG_PREEMPT_DYNAMIC=' \
            .config \
            || true

          echo
          echo "CONFIG_MODULES:"
          grep \
            '^CONFIG_MODULES=' \
            .config \
            || true

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep \
            '^CONFIG_MODULE_UNLOAD=' \
            .config \
            || true

          echo
          echo "=========================================="
          echo "STRICT CONFIG CHECK"
          echo "=========================================="

          grep -q \
            '^CONFIG_EXPERT=y$' \
            .config

          grep -q \
            '^CONFIG_SMP=y$' \
            .config

          grep -q \
            '^CONFIG_PREEMPT_RT=y$' \
            .config

          grep -q \
            '^CONFIG_MODULES=y$' \
            .config

          grep -q \
            '^CONFIG_MODULE_UNLOAD=y$' \
            .config

          if grep -q \
            '^CONFIG_PREEMPT_DYNAMIC=y$' \
            .config; then

            echo
            echo "ERROR: CONFIG_PREEMPT_DYNAMIC is enabled."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "RT CONFIGURATION VERIFIED"
          echo "=========================================="


      # ============================================================
      # PREPARE KERNEL
      # ============================================================

      - name: Prepare kernel
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "PREPARE KERNEL"
          echo "=========================================="

          make \
            ARCH=x86_64 \
            prepare

          make \
            ARCH=x86_64 \
            modules_prepare

          echo
          echo "Kernel preparation completed."


      # ============================================================
      # VERIFY KERNEL RELEASE
      # ============================================================

      - name: Verify kernel release before build
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          ACTUAL_RELEASE="$(
            make \
              -s \
              ARCH=x86_64 \
              kernelrelease
          )"

          echo "=========================================="
          echo "KERNEL RELEASE"
          echo "=========================================="

          echo
          echo "Actual:"
          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected:"
          echo "${KERNEL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            echo "Actual:   ${ACTUAL_RELEASE}"
            echo "Expected: ${KERNEL_RELEASE}"
            exit 1
          fi

          printf '%s\n' \
            "${ACTUAL_RELEASE}" \
            > "${GITHUB_WORKSPACE}/kernel.release"

          echo
          echo "Kernel release verified."


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "BUILD LINUX KERNEL"
          echo "=========================================="

          NPROC="$(nproc)"

          echo
          echo "CPU threads:"
          echo "${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules


      # ============================================================
      # VERIFY KERNEL BUILD
      # ============================================================

      - name: Verify kernel build
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          cd \
            "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL BUILD"
          echo "=========================================="

          ACTUAL_RELEASE="$(
            make \
              -s \
              ARCH=x86_64 \
              kernelrelease
          )"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: unexpected kernel release."
            exit 1
          fi

          echo
          echo "CONFIG_EXPERT:"
          grep \
            '^CONFIG_EXPERT=' \
            .config

          echo
          echo "CONFIG_SMP:"
          grep \
            '^CONFIG_SMP=' \
            .config

          echo
          echo "CONFIG_PREEMPT:"
          grep \
            '^CONFIG_PREEMPT=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPTION:"
          grep \
            '^CONFIG_PREEMPTION=' \
            .config \
            || true

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep \
            '^CONFIG_PREEMPT_RT=' \
            .config

          echo
          echo "CONFIG_PREEMPT_DYNAMIC:"
          grep \
            '^CONFIG_PREEMPT_DYNAMIC=' \
            .config \
            || true

          echo
          echo "CONFIG_MODULES:"
          grep \
            '^CONFIG_MODULES=' \
            .config

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep \
            '^CONFIG_MODULE_UNLOAD=' \
            .config

          echo
          echo "Kernel image:"
          ls -lh \
            arch/x86/boot/bzImage

          echo
          echo "Module.symvers:"
          ls -lh \
            Module.symvers

          echo
          echo "System.map:"
          ls -lh \
            System.map


      # ============================================================
      # BUILD A REAL EXTERNAL MODULE
      # ============================================================

      - name: Verify external module PREEMPT_RT vermagic
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"
          TEST_DIR="${GITHUB_WORKSPACE}/test-external-module"

          echo "=========================================="
          echo "VERIFY EXTERNAL MODULE PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Kernel tree:"
          echo "${KERNEL_DIR}"

          cd \
            "${KERNEL_DIR}"

          ACTUAL_KERNEL_RELEASE="$(
            make \
              -s \
              ARCH=x86_64 \
              kernelrelease
          )"

          echo
          echo "Kernel release:"
          echo "${ACTUAL_KERNEL_RELEASE}"

          if [ "${ACTUAL_KERNEL_RELEASE}" != "${KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            exit 1
          fi

          rm -rf \
            "${TEST_DIR}"

          mkdir -p \
            "${TEST_DIR}"

          cat > "${TEST_DIR}/test_module.c" <<'EOF'
#include <linux/module.h>
#include <linux/kernel.h>

static int __init test_module_init(void)
{
    pr_info("Daphile PREEMPT_RT module test loaded\n");
    return 0;
}

static void __exit test_module_exit(void)
{
    pr_info("Daphile PREEMPT_RT module test unloaded\n");
}

module_init(test_module_init);
module_exit(test_module_exit);

MODULE_LICENSE("GPL");
MODULE_AUTHOR("Daphile");
MODULE_DESCRIPTION("Daphile PREEMPT_RT external module test");
EOF

          cat > "${TEST_DIR}/Makefile" <<'EOF'
obj-m += test_module.o
EOF

          echo
          echo "=========================================="
          echo "BUILD TEST MODULE"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${TEST_DIR}" \
            modules

          KO="${TEST_DIR}/test_module.ko"

          if [ ! -f "${KO}" ]; then
            echo
            echo "ERROR: test_module.ko was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "TEST MODULE"
          echo "=========================================="

          ls -lh \
            "${KO}"

          echo
          echo "File:"
          file \
            "${KO}"

          echo
          echo "modinfo:"
          modinfo \
            "${KO}"

          TEST_VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${KO}"
          )"

          echo
          echo "=========================================="
          echo "ACTUAL VERMAGIC"
          echo "=========================================="

          echo "${TEST_VERMAGIC}"

          EXPECTED_VERMAGIC_PREFIX="${KERNEL_RELEASE} SMP preempt_rt"

          echo
          echo "Expected prefix:"
          echo "${EXPECTED_VERMAGIC_PREFIX}"

          echo
          echo "=========================================="
          echo "VERIFY PREEMPT_RT VERMAGIC"
          echo "=========================================="

          case "${TEST_VERMAGIC}" in
            "${KERNEL_RELEASE}"*"preempt_rt"*"mod_unload"*)
              echo
              echo "PREEMPT_RT vermagic VERIFIED."
              ;;
            *)
              echo
              echo "ERROR: PREEMPT_RT vermagic is incorrect."
              echo
              echo "Expected:"
              echo "${KERNEL_RELEASE} ... preempt_rt ... mod_unload"
              echo
              echo "Actual:"
              echo "${TEST_VERMAGIC}"
              exit 1
              ;;
          esac

          echo
          echo "=========================================="
          echo "EXTERNAL MODULE PREEMPT_RT VERIFIED"
          echo "=========================================="

          echo
          echo "The actual kernel build tree produces"
          echo "external modules with PREEMPT_RT vermagic."


      # ============================================================
      # PREPARE RELEASE
      # ============================================================

      - name: Create release package
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

          rm -rf \
            release

          mkdir -p \
            release

          echo "=========================================="
          echo "CREATE RELEASE PACKAGE"
          echo "=========================================="

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          cp \
            "${KERNEL_DIR}/arch/x86/boot/bzImage" \
            release/bzImage

          cp \
            "${GITHUB_WORKSPACE}/kernel.release" \
            release/kernel.release

          echo
          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="

          ACTUAL_RELEASE="$(
            cat \
              release/kernel.release
          )"

          printf '%s\n' \
            "Linux source version: ${LINUX_SOURCE_VERSION}" \
            "PREEMPT_RT patch: ${RT_VERSION}" \
            "Kernel release: ${ACTUAL_RELEASE}" \
            "Daphile suffix: ${DAPHILE_RELEASE}" \
            "Architecture: x86_64" \
            "SMP: enabled" \
            "PREEMPT_RT: enabled" \
            "PREEMPT_DYNAMIC: disabled" \
            "MODULES: enabled" \
            "MODULE_UNLOAD: enabled" \
            "External module vermagic: verified" \
            "Compiler: $(gcc --version | head -1)" \
            "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            > release/build-info.txt

          echo
          cat \
            release/build-info.txt

          echo
          echo "=========================================="
          echo "CREATE BUILD TREE ARCHIVE"
          echo "=========================================="

          tar \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ko' \
            --exclude='*.tmp' \
            --exclude='*.cmd' \
            --exclude='*.d' \
            -cJf \
            "release/linux-${KERNEL_RELEASE}-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          sha256sum \
            release/* \
            > release/SHA256SUMS

          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh \
            release


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.30-daphile-rt-build
          path: release


      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-6.12.30-daphile-rt
          name: Daphile Linux 6.12.30 PREEMPT_RT
          body: |
            Daphile PREEMPT_RT kernel build.

            IMPORTANT:
            The kernel source is Linux 6.12.28 with
            the official PREEMPT_RT 6.12.28-rt10 patch.

            The final kernel release identifier is:
            6.12.30-daphile

            Linux source:
            6.12.28

            PREEMPT_RT:
            6.12.28-rt10

            Kernel release:
            6.12.30-daphile

            Architecture:
            x86_64

            Configuration:
            CONFIG_EXPERT=y
            CONFIG_SMP=y
            CONFIG_PREEMPT_RT=y
            CONFIG_PREEMPT_DYNAMIC=n
            CONFIG_MODULES=y
            CONFIG_MODULE_UNLOAD=y

            The workflow also builds an independent
            external test module and verifies that its
            actual modinfo vermagic contains:

            6.12.30-daphile SMP preempt_rt mod_unload

            The build tree is intended for compiling
            external kernel modules such as Diretta
            alsa_bridge.ko.

          files: |
            release/linux-6.12.30-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/bzImage
            release/build-info.txt
            release/SHA256SUMS
