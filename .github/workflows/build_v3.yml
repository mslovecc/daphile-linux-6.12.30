name: v3 Build Daphile Linux 6.12.30 PREEMPT_RT

on:
workflow_dispatch:

permissions:
contents: write

env:
LINUX_SOURCE_VERSION: "6.12.28"
KERNEL_RELEASE: "6.12.30-daphile"
DAPHILE_RELEASE: "-daphile"
RT_BASE_VERSION: "6.12.28"
RT_VERSION: "6.12.28-rt10"

jobs:
build-kernel:
runs-on: ubuntu-22.04

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install build dependencies
    shell: bash
    run: |
      set -euo pipefail

      sudo apt-get update

      sudo apt-get install -y \
        build-essential \
        bc \
        bison \
        flex \
        libssl-dev \
        libelf-dev \
        libdw-dev \
        dwarves \
        cpio \
        rsync \
        kmod \
        xz-utils \
        zstd \
        wget \
        patch

  - name: Download Linux 6.12.28
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "DOWNLOAD LINUX SOURCE"
      echo "=========================================="

      URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_SOURCE_VERSION}.tar.xz"

      echo "URL:"
      echo "${URL}"

      wget -q \
        "${URL}" \
        -O \
        "linux-${LINUX_SOURCE_VERSION}.tar.xz"

      test -s \
        "linux-${LINUX_SOURCE_VERSION}.tar.xz"

      tar -xf \
        "linux-${LINUX_SOURCE_VERSION}.tar.xz"

      mv \
        "linux-${LINUX_SOURCE_VERSION}" \
        "linux-${LINUX_SOURCE_VERSION}-daphile"

      echo
      echo "Kernel source:"
      ls -ld \
        "linux-${LINUX_SOURCE_VERSION}-daphile"

  - name: Download PREEMPT_RT patch
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "DOWNLOAD PREEMPT_RT PATCH"
      echo "=========================================="

      echo "Linux base:"
      echo "${RT_BASE_VERSION}"

      echo "RT version:"
      echo "${RT_VERSION}"

      RT_URL="https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/patch-${RT_VERSION}.patch.xz"

      echo
      echo "URL:"
      echo "${RT_URL}"

      wget -q \
        "${RT_URL}" \
        -O \
        "patch-${RT_VERSION}.patch.xz"

      test -s \
        "patch-${RT_VERSION}.patch.xz"

      xz -d \
        "patch-${RT_VERSION}.patch.xz"

      mv \
        "patch-${RT_VERSION}.patch" \
        "rt-${RT_VERSION}.patch"

      test -s \
        "rt-${RT_VERSION}.patch"

      echo
      echo "RT patch:"
      ls -lh \
        "rt-${RT_VERSION}.patch"

  - name: Verify PREEMPT_RT patch
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "VERIFY PREEMPT_RT PATCH"
      echo "=========================================="

      test -s \
        "rt-${RT_VERSION}.patch"

      echo
      echo "Patch header:"
      head -30 \
        "rt-${RT_VERSION}.patch"

  - name: Apply PREEMPT_RT patch
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      echo "=========================================="
      echo "PATCH PREEMPT_RT"
      echo "=========================================="

      echo "Linux source:"
      echo "${LINUX_SOURCE_VERSION}"

      echo "RT patch:"
      echo "${RT_VERSION}"

      echo
      echo "PATCH DRY RUN"

      patch \
        --dry-run \
        --batch \
        --forward \
        -p1 \
        < "../rt-${RT_VERSION}.patch"

      echo
      echo "APPLY PATCH"

      patch \
        --batch \
        --forward \
        -p1 \
        < "../rt-${RT_VERSION}.patch"

      echo
      echo "CHECK REJECTED HUNKS"

      REJECTS="$(
        find . \
          -type f \
          -name '*.rej' \
          -print
      )"

      if [ -n "${REJECTS}" ]; then
        echo "ERROR: rejected hunks detected:"
        echo "${REJECTS}"
        exit 1
      fi

      echo "No rejected hunks."

      echo
      echo "CHECK CONFLICT MARKERS"

      CONFLICTS="$(
        grep -R \
          -n \
          -E '^(<<<<<<<|>>>>>>>)( |$)' \
          --exclude-dir=.git \
          . \
          2>/dev/null || true
      )"

      if [ -n "${CONFLICTS}" ]; then
        echo "ERROR: unresolved conflict markers detected:"
        echo "${CONFLICTS}"
        exit 1
      fi

      echo "No unresolved conflict markers."

      echo
      echo "PREEMPT_RT PATCH APPLIED"

  - name: Set Daphile kernel release
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      echo "=========================================="
      echo "SET DAPHILE KERNEL RELEASE"
      echo "=========================================="

      echo "Source kernel:"
      echo "${LINUX_SOURCE_VERSION}"

      echo "RT patch:"
      echo "${RT_VERSION}"

      echo "Target release:"
      echo "${KERNEL_RELEASE}"

      rm -f \
        localversion-rt

      printf '%s\n' \
        "${DAPHILE_RELEASE}" \
        > localversion-daphile

      echo
      echo "localversion files:"

      ls -la \
        localversion* \
        2>/dev/null || true

      echo
      echo "localversion-daphile:"
      cat \
        localversion-daphile

  - name: Create kernel configuration
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      echo "=========================================="
      echo "CREATE KERNEL CONFIGURATION"
      echo "=========================================="

      make \
        ARCH=x86_64 \
        defconfig

      echo
      echo "Enable CONFIG_EXPERT"

      ./scripts/config \
        --enable CONFIG_EXPERT

      echo
      echo "Enable CONFIG_SMP"

      ./scripts/config \
        --enable CONFIG_SMP

      echo
      echo "Enable CONFIG_PREEMPT_RT"

      ./scripts/config \
        --enable CONFIG_PREEMPT_RT

      echo
      echo "Disable CONFIG_PREEMPT_DYNAMIC"

      ./scripts/config \
        --disable CONFIG_PREEMPT_DYNAMIC

      echo
      echo "Enable CONFIG_MODULES"

      ./scripts/config \
        --enable CONFIG_MODULES

      echo
      echo "Enable CONFIG_MODULE_UNLOAD"

      ./scripts/config \
        --enable CONFIG_MODULE_UNLOAD

      echo
      echo "Normalize configuration"

      make \
        ARCH=x86_64 \
        olddefconfig

      echo
      echo "IMPORTANT CONFIGURATION"

      grep \
        -E \
        '^CONFIG_EXPERT=|^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPT_DYNAMIC=|^CONFIG_PREEMPTION=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
        .config \
        || true

  - name: Verify PREEMPT_RT configuration
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      echo "=========================================="
      echo "VERIFY PREEMPT_RT CONFIGURATION"
      echo "=========================================="

      echo
      grep \
        '^CONFIG_EXPERT=' \
        .config \
        || true

      echo
      grep \
        '^CONFIG_SMP=' \
        .config \
        || true

      echo
      grep \
        '^CONFIG_PREEMPT=' \
        .config \
        || true

      echo
      grep \
        '^CONFIG_PREEMPTION=' \
        .config \
        || true

      echo
      grep \
        '^CONFIG_PREEMPT_RT=' \
        .config \
        || true

      echo
      grep \
        '^CONFIG_PREEMPT_DYNAMIC=' \
        .config \
        || true

      echo
      grep \
        '^CONFIG_MODULES=' \
        .config \
        || true

      echo
      grep \
        '^CONFIG_MODULE_UNLOAD=' \
        .config \
        || true

      echo
      echo "=========================================="
      echo "STRICT CHECK"
      echo "=========================================="

      grep -q \
        '^CONFIG_EXPERT=y$' \
        .config

      grep -q \
        '^CONFIG_SMP=y$' \
        .config

      grep -q \
        '^CONFIG_PREEMPT_RT=y$' \
        .config

      grep -q \
        '^CONFIG_MODULES=y$' \
        .config

      grep -q \
        '^CONFIG_MODULE_UNLOAD=y$' \
        .config

      if grep -q \
        '^CONFIG_PREEMPT_DYNAMIC=y$' \
        .config; then

        echo
        echo "ERROR: CONFIG_PREEMPT_DYNAMIC=y"
        exit 1
      fi

      echo
      echo "PREEMPT_RT CONFIGURATION VERIFIED"

  - name: Prepare kernel
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      echo "=========================================="
      echo "PREPARE KERNEL"
      echo "=========================================="

      make \
        ARCH=x86_64 \
        prepare

      make \
        ARCH=x86_64 \
        modules_prepare

      echo
      echo "Kernel preparation completed."

  - name: Verify kernel release before build
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      ACTUAL_RELEASE="$(
        make \
          -s \
          ARCH=x86_64 \
          kernelrelease
      )"

      echo "=========================================="
      echo "KERNEL RELEASE"
      echo "=========================================="

      echo "Actual:"
      echo "${ACTUAL_RELEASE}"

      echo
      echo "Expected:"
      echo "${KERNEL_RELEASE}"

      if [ "${ACTUAL_RELEASE}" != "${KERNEL_RELEASE}" ]; then
        echo
        echo "ERROR: kernel release mismatch"
        echo "Actual:   ${ACTUAL_RELEASE}"
        echo "Expected: ${KERNEL_RELEASE}"
        exit 1
      fi

      printf '%s\n' \
        "${ACTUAL_RELEASE}" \
        > "${GITHUB_WORKSPACE}/kernel.release"

      echo
      echo "Kernel release verified."

  - name: Build kernel
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      echo "=========================================="
      echo "BUILD LINUX KERNEL"
      echo "=========================================="

      NPROC="$(nproc)"

      echo "CPU threads:"
      echo "${NPROC}"

      make \
        ARCH=x86_64 \
        -j"${NPROC}" \
        bzImage \
        modules

  - name: Verify kernel build
    shell: bash
    run: |
      set -euo pipefail

      KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_SOURCE_VERSION}-daphile"

      cd \
        "${KERNEL_DIR}"

      echo "=========================================="
      echo "VERIFY KERNEL BUILD"
      echo "=========================================="

      ACTUAL_RELEASE="$(
        make \
          -s \
          ARCH=x86_64 \
          kernelrelease
      )"

      echo
      echo "Kernel release:"
      echo "${ACTUAL_RELEASE}"

      if [ "${ACTUAL_RELEASE}" != "${KERNEL_RELEASE}" ]; then
        echo
        echo "ERROR: kernel release mismatch"
        exit 1
      fi

      echo
      echo "CONFIG_EXPERT:"
      grep \
        '^CONFIG_EXPERT=' \
        .config

      echo
      echo "CONFIG_SMP:"
      grep \
        '^CONFIG_SMP=' \
        .config

      echo
      echo "CONFIG_PREEMPT:"
      grep \
        '^CONFIG_PREEMPT=' \
        .config \
        || true

      echo
      echo "CONFIG_PREEMPTION:"
      grep \
        '^CONFIG_PREEMPTION=' \
        .config \
        || true

      echo
      echo "CONFIG_PREEMPT_RT:"
      grep \
        '^CONFIG_PREEMPT_RT=' \
        .config

      echo
      echo "CONFIG_PREEMPT_DYNAMIC:"
      grep \
        '^CONFIG_PREEMPT_DYNAMIC=' \
        .config \
        || true

      echo
      echo "CONFIG_MODULES:"
      grep \
        '^CONFIG_MODULES=' \
        .config

      echo
      echo "CONFIG_MODULE_
