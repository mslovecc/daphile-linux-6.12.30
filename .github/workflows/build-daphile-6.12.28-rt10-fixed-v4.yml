name: Build Daphile Linux 6.12.28 PREEMPT_RT

on:
  workflow_dispatch:

env:
  LINUX_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"
  KERNEL_RELEASE: "6.12.28-daphile"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            pkg-config \
            wget \
            xz-utils

      - name: Download Linux 6.12.28
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          rm -rf "linux-${LINUX_VERSION}"
          rm -f "linux-${LINUX_VERSION}.tar.xz"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf "linux-${LINUX_VERSION}.tar.xz"

          test -d "${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

      - name: Download PREEMPT_RT 6.12.28-rt10
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          PATCH_ARCHIVE="patch-${RT_VERSION}.patch.xz"
          PATCH_FILE="${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch"
          PATCH_URL="https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/${PATCH_ARCHIVE}"

          rm -f "${PATCH_ARCHIVE}"
          rm -f "${PATCH_FILE}"

          echo "=========================================="
          echo "DOWNLOAD PREEMPT_RT PATCH"
          echo "=========================================="
          echo
          echo "RT version:"
          echo "${RT_VERSION}"
          echo
          echo "Patch URL:"
          echo "${PATCH_URL}"
          echo

          wget -q \
            "${PATCH_URL}"

          test -f "${PATCH_ARCHIVE}"

          echo
          echo "Downloaded archive:"
          ls -lh "${PATCH_ARCHIVE}"

          echo
          echo "=========================================="
          echo "EXTRACT PREEMPT_RT PATCH"
          echo "=========================================="

          unxz \
            "${PATCH_ARCHIVE}"

          test -f "${PATCH_FILE}"

          echo
          echo "PREEMPT_RT patch ready:"
          echo "${PATCH_FILE}"
          ls -lh "${PATCH_FILE}"

          echo
          echo "Patch header:"
          head -n 12 "${PATCH_FILE}"

          echo
          echo "SHA256:"
          sha256sum "${PATCH_FILE}"

      - name: Verify pristine kernel source
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL SOURCE"
          echo "=========================================="

          ACTUAL_VERSION="$(make -s kernelversion)"

          echo "Expected:"
          echo "${LINUX_VERSION}"

          echo
          echo "Actual:"
          echo "${ACTUAL_VERSION}"

          test "${ACTUAL_VERSION}" = "${LINUX_VERSION}"

      - name: Apply PREEMPT_RT patch
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          PATCH_FILE="${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT PATCH FILE"
          echo "=========================================="

          test -f "${PATCH_FILE}"
          test -s "${PATCH_FILE}"

          echo
          echo "Patch file:"
          echo "${PATCH_FILE}"
          echo
          ls -lh "${PATCH_FILE}"

          echo
          echo "=========================================="
          echo "PREEMPT_RT PATCH DRY RUN"
          echo "=========================================="

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "${PATCH_FILE}"

          echo
          echo "PATCH DRY RUN PASSED"

          echo
          echo "=========================================="
          echo "APPLY PREEMPT_RT PATCH"
          echo "=========================================="

          patch \
            --batch \
            --forward \
            -p1 \
            < "${PATCH_FILE}"

          echo
          echo "PATCH APPLIED"

          echo
          echo "=========================================="
          echo "VERIFY PATCH REJECTS"
          echo "=========================================="

          REJECTS="$(find . -type f -name '*.rej' -print)"

          if [ -n "${REJECTS}" ]; then
            echo "ERROR: rejected patch hunks found:"
            echo "${REJECTS}"
            exit 1
          fi

          echo "No rejected patch hunks."

          echo
          echo "=========================================="
          echo "VERIFY RT PATCH MARKER"
          echo "=========================================="

          test -f localversion-rt

          echo "localversion-rt:"
          cat localversion-rt

          echo
          echo "PREEMPT_RT PATCH VERIFIED."

      - name: Prepare x86_64 kernel configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "CREATE KERNEL CONFIG"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make -s kernelversion

          echo
          echo "=========================================="
          echo "BASE DEFCONFIG"
          echo "=========================================="

          make ARCH=x86_64 defconfig

          echo
          echo "=========================================="
          echo "ENABLE REQUIRED RT OPTIONS"
          echo "=========================================="

          # CONFIG_PREEMPT_RT is exposed through the RT Kconfig
          # only when CONFIG_EXPERT is enabled.
          ./scripts/config --enable CONFIG_EXPERT
          ./scripts/config --enable CONFIG_PREEMPT_RT
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD

          echo
          echo "Configuration before olddefconfig:"
          grep -E '^(CONFIG_EXPERT|CONFIG_PREEMPT_RT|CONFIG_MODULES|CONFIG_MODULE_UNLOAD)=' .config || true

          echo
          echo "=========================================="
          echo "RUN OLDDEFCONFIG"
          echo "=========================================="

          make ARCH=x86_64 olddefconfig

          echo
          echo "=========================================="
          echo "FINAL KERNEL CONFIGURATION"
          echo "=========================================="

          echo
          echo "CONFIG_EXPERT:"
          grep '^CONFIG_EXPERT=' .config || true

          echo
          echo "CONFIG_PREEMPT:"
          grep '^CONFIG_PREEMPT=' .config || true

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' .config || true

          echo
          echo "CONFIG_MODULES:"
          grep '^CONFIG_MODULES=' .config || true

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep '^CONFIG_MODULE_UNLOAD=' .config || true

          echo
          echo "=========================================="
          echo "CHECK REQUIRED CONFIGURATION"
          echo "=========================================="

          if ! grep -q '^CONFIG_EXPERT=y$' .config; then
            echo "ERROR: CONFIG_EXPERT=y is required for CONFIG_PREEMPT_RT."
            exit 1
          fi

          if ! grep -q '^CONFIG_PREEMPT_RT=y$' .config; then
            echo "ERROR: CONFIG_PREEMPT_RT=y was not retained by olddefconfig."
            echo
            echo "Relevant configuration:"
            grep -E '^(CONFIG_EXPERT|CONFIG_PREEMPT|CONFIG_PREEMPT_RT|CONFIG_ARCH_SUPPORTS_RT)=' .config || true
            exit 1
          fi

          if ! grep -q '^CONFIG_MODULES=y$' .config; then
            echo "ERROR: CONFIG_MODULES=y is required."
            exit 1
          fi

          if ! grep -q '^CONFIG_MODULE_UNLOAD=y$' .config; then
            echo "ERROR: CONFIG_MODULE_UNLOAD=y is required."
            exit 1
          fi

          echo
          echo "KERNEL CONFIGURATION PASSED."

      - name: Verify RT kernel configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT CONFIGURATION"
          echo "=========================================="

          echo
          echo "CONFIG_EXPERT:"
          grep '^CONFIG_EXPERT=' .config

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' .config

          echo
          echo "CONFIG_MODULES:"
          grep '^CONFIG_MODULES=' .config

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep '^CONFIG_MODULE_UNLOAD=' .config

          echo
          echo "=========================================="
          echo "CHECK REQUIRED OPTIONS"
          echo "=========================================="

          grep -q '^CONFIG_EXPERT=y$' .config
          grep -q '^CONFIG_PREEMPT_RT=y$' .config
          grep -q '^CONFIG_MODULES=y$' .config
          grep -q '^CONFIG_MODULE_UNLOAD=y$' .config

          echo
          echo "PREEMPT_RT CONFIGURATION VERIFIED."

      - name: Build Linux 6.12.28 PREEMPT_RT
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make -j"$(nproc)" \
            ARCH=x86_64 \
            LOCALVERSION=-daphile \
            bzImage \
            modules

      - name: Verify kernel release
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL RELEASE"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(make -s ARCH=x86_64 LOCALVERSION=-daphile kernelrelease)"

          echo "Expected:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Actual:"
          echo "${KERNEL_RELEASE_ACTUAL}"

          if [ "${KERNEL_RELEASE_ACTUAL}" != "${KERNEL_RELEASE}" ]; then
            echo "ERROR: kernel release mismatch."
            exit 1
          fi

          test -f arch/x86/boot/bzImage

          echo
          echo "Kernel release VERIFIED."
          echo "bzImage VERIFIED."

      - name: Verify external module PREEMPT_RT vermagic
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          TEST_DIR="${GITHUB_WORKSPACE}/test-external-module"

          rm -rf "${TEST_DIR}"
          mkdir -p "${TEST_DIR}"

          printf '%s\n' \
            '#include <linux/module.h>' \
            '#include <linux/kernel.h>' \
            '' \
            'static int __init test_module_init(void)' \
            '{' \
            '    pr_info("Daphile PREEMPT_RT module test loaded\n");' \
            '    return 0;' \
            '}' \
            '' \
            'static void __exit test_module_exit(void)' \
            '{' \
            '    pr_info("Daphile PREEMPT_RT module test unloaded\n");' \
            '}' \
            '' \
            'module_init(test_module_init);' \
            'module_exit(test_module_exit);' \
            '' \
            'MODULE_LICENSE("GPL");' \
            'MODULE_AUTHOR("Daphile");' \
            'MODULE_DESCRIPTION("Daphile PREEMPT_RT external module test");' \
            > "${TEST_DIR}/test_module.c"

          printf '%s\n' \
            'obj-m += test_module.o' \
            > "${TEST_DIR}/Makefile"

          echo "=========================================="
          echo "BUILD EXTERNAL TEST MODULE"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${TEST_DIR}" \
            modules

          KO="${TEST_DIR}/test_module.ko"

          if [ ! -f "${KO}" ]; then
            echo "ERROR: test_module.ko was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "MODULE INFORMATION"
          echo "=========================================="

          modinfo "${KO}"

          TEST_VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo
          echo "=========================================="
          echo "ACTUAL VERMAGIC"
          echo "=========================================="

          echo "${TEST_VERMAGIC}"

          echo
          echo "=========================================="
          echo "VERIFY PREEMPT_RT VERMAGIC"
          echo "=========================================="

          case "${TEST_VERMAGIC}" in
            "${KERNEL_RELEASE}"*"preempt_rt"*)
              echo
              echo "PREEMPT_RT vermagic VERIFIED."
              ;;
            *)
              echo
              echo "ERROR: PREEMPT_RT vermagic is incorrect."
              echo
              echo "Expected:"
              echo "${KERNEL_RELEASE} ... preempt_rt ..."
              echo
              echo "Actual:"
              echo "${TEST_VERMAGIC}"
              exit 1
              ;;
          esac

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daphile-linux-${{ env.LINUX_VERSION }}-rt10
          if-no-files-found: error
          path: |
            linux-${{ env.LINUX_VERSION }}/arch/x86/boot/bzImage
            linux-${{ env.LINUX_VERSION }}/.config
            linux-${{ env.LINUX_VERSION }}/System.map
            test-external-module/test_module.ko
