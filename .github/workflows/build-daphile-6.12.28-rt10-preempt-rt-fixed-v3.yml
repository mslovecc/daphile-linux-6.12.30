name: Build Daphile Linux 6.12.28 PREEMPT_RT

on:
  workflow_dispatch:

env:
  LINUX_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"
  KERNEL_RELEASE: "6.12.28-rt10-daphile"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            pkg-config \
            wget \
            xz-utils \
            kmod

      - name: Download Linux kernel
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          rm -rf "linux-${LINUX_VERSION}"
          rm -f "linux-${LINUX_VERSION}.tar.xz"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf "linux-${LINUX_VERSION}.tar.xz"

          test -d "${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

      - name: Download PREEMPT_RT patch
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          PATCH_ARCHIVE="patch-${RT_VERSION}.patch.xz"
          PATCH_FILE="patch-${RT_VERSION}.patch"
          PATCH_URL="https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/${PATCH_ARCHIVE}"

          rm -f "${PATCH_ARCHIVE}" "${PATCH_FILE}"

          echo "=========================================="
          echo "DOWNLOAD PREEMPT_RT PATCH"
          echo "=========================================="
          echo "RT version: ${RT_VERSION}"
          echo "Download URL: ${PATCH_URL}"
          echo

          wget -q "${PATCH_URL}"

          test -s "${PATCH_ARCHIVE}"

          echo "Downloaded:"
          ls -lh "${PATCH_ARCHIVE}"

          unxz "${PATCH_ARCHIVE}"

          test -s "${PATCH_FILE}"

          echo
          echo "Patch ready:"
          ls -lh "${PATCH_FILE}"

      - name: Apply PREEMPT_RT patch
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          PATCH_FILE="${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT PATCH"
          echo "=========================================="

          test -s "${PATCH_FILE}"

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "${PATCH_FILE}"

          patch \
            --batch \
            --forward \
            -p1 \
            < "${PATCH_FILE}"

          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            echo "ERROR: rejected patch hunks found."
            find . -type f -name '*.rej' -print
            exit 1
          fi

          echo
          echo "=========================================="
          echo "VERIFY RT PATCH MARKERS"
          echo "=========================================="

          test -f localversion-rt

          echo "localversion-rt:"
          cat localversion-rt

          echo
          echo "Check PREEMPT_RT Kconfig:"
          grep -n -A18 -B3 'config PREEMPT_RT' kernel/Kconfig.preempt || true

          echo
          echo "Check architecture RT support:"
          grep -R -n 'config ARCH_SUPPORTS_RT' arch/x86 kernel 2>/dev/null | head -20 || true

          echo
          echo "PREEMPT_RT source patch applied."

      - name: Prepare kernel configuration with PREEMPT_RT
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "CREATE PREEMPT_RT KERNEL CONFIG"
          echo "=========================================="

          make ARCH=x86_64 defconfig
          ./scripts/config --enable CONFIG_EXPERT
          make ARCH=x86_64 olddefconfig

          ./scripts/config --enable CONFIG_PREEMPT_RT
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD

          make ARCH=x86_64 olddefconfig

          echo
          echo "=========================================="
          echo "FINAL PREEMPT_RT CONFIGURATION"
          echo "=========================================="

          grep -E '^(CONFIG_ARCH_SUPPORTS_RT|CONFIG_EXPERT|CONFIG_PREEMPT(_BUILD|_NONE_BUILD|_VOLUNTARY_BUILD|_DYNAMIC)?|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION|CONFIG_MODULES|CONFIG_MODULE_UNLOAD)=' .config || true

          test "$(grep '^CONFIG_EXPERT=' .config)" = "CONFIG_EXPERT=y"
          test "$(grep '^CONFIG_PREEMPT_RT=' .config)" = "CONFIG_PREEMPT_RT=y"
          test "$(grep '^CONFIG_MODULES=' .config)" = "CONFIG_MODULES=y"
          test "$(grep '^CONFIG_MODULE_UNLOAD=' .config)" = "CONFIG_MODULE_UNLOAD=y"

          echo
          echo "CONFIG_PREEMPT_RT=y VERIFIED."
          echo "CONFIG_PREEMPT_BUILD may also be y in this RT tree."
          echo "VERMAGIC precedence is corrected in the next step."
      - name: Prepare generated kernel headers and verify PREEMPT_RT before build
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "PREPARE GENERATED KERNEL STATE"
          echo "=========================================="

          test "$(grep '^CONFIG_PREEMPT_RT=' .config)" = "CONFIG_PREEMPT_RT=y"

          make ARCH=x86_64 prepare
          make ARCH=x86_64 modules_prepare

          echo
          echo "=========================================="
          echo "VERIFY GENERATED CONFIG"
          echo "=========================================="

          grep -E '^CONFIG_(EXPERT|PREEMPT_RT|PREEMPT|PREEMPT_BUILD|PREEMPT_DYNAMIC|MODULES|MODULE_UNLOAD)=' include/config/auto.conf || true
          test "$(grep '^CONFIG_PREEMPT_RT=' include/config/auto.conf)" = "CONFIG_PREEMPT_RT=y"

          echo
          echo "=========================================="
          echo "FIX PREEMPT_RT VERMAGIC PRECEDENCE"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/vermagic.h")
          s = p.read_text()

          old = "\n".join([
              "#ifdef CONFIG_PREEMPT_BUILD",
              '#define MODULE_VERMAGIC_PREEMPT "preempt "',
              "#elif defined(CONFIG_PREEMPT_RT)",
              '#define MODULE_VERMAGIC_PREEMPT "preempt_rt "',
              "#else",
              '#define MODULE_VERMAGIC_PREEMPT ""',
              "#endif",
          ])

          new = "\n".join([
              "#ifdef CONFIG_PREEMPT_RT",
              '#define MODULE_VERMAGIC_PREEMPT "preempt_rt "',
              "#elif defined(CONFIG_PREEMPT_BUILD)",
              '#define MODULE_VERMAGIC_PREEMPT "preempt "',
              "#else",
              '#define MODULE_VERMAGIC_PREEMPT ""',
              "#endif",
          ])

          if new in s:
              print("PREEMPT_RT vermagic precedence is already correct.")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("PREEMPT_RT vermagic precedence corrected.")
          else:
              raise SystemExit("ERROR: expected MODULE_VERMAGIC_PREEMPT block not found.")
          PY

          echo
          echo "VERMAGIC SOURCE:"
          grep -n -A7 -B2 'MODULE_VERMAGIC_PREEMPT' include/linux/vermagic.h

          grep -q '#ifdef CONFIG_PREEMPT_RT' include/linux/vermagic.h
          grep -q '#elif defined(CONFIG_PREEMPT_BUILD)' include/linux/vermagic.h
          grep -q '#define MODULE_VERMAGIC_PREEMPT "preempt_rt "' include/linux/vermagic.h

          echo
          echo "=========================================="
          echo "VERIFY GENERATED VERMAGIC MACRO"
          echo "=========================================="

          cat > /tmp/check_vermagic.c <<'EOF'
          #define INCLUDE_VERMAGIC
          #include <linux/vermagic.h>
          const char *daphile_vermagic = VERMAGIC_STRING;
          EOF

          ${HOSTCC:-cc}             -Iinclude             -Iinclude/generated             -Iarch/x86/include             -Iarch/x86/include/generated             -Iinclude/uapi             -Iarch/x86/include/uapi             -Iinclude/generated/uapi             -Iarch/x86/include/generated/uapi             -E /tmp/check_vermagic.c > /tmp/check_vermagic.i

          grep -F 'preempt_rt' /tmp/check_vermagic.i

          echo
          echo "PREEMPT_RT IS ACTIVE BEFORE KERNEL BUILD."
          echo "VERMAGIC WILL USE preempt_rt."
      - name: Build Linux PREEMPT_RT kernel
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "BUILD PREEMPT_RT KERNEL"
          echo "=========================================="

          echo "Configuration immediately before build:"
          grep -E '^(CONFIG_EXPERT|CONFIG_PREEMPT|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION|CONFIG_MODULES|CONFIG_MODULE_UNLOAD)=' .config

          test "$(grep '^CONFIG_PREEMPT_RT=' .config)" = "CONFIG_PREEMPT_RT=y"
          grep -q '^CONFIG_PREEMPT_RT=y$' include/config/auto.conf
          grep -q '#define MODULE_VERMAGIC_PREEMPT "preempt_rt "' include/linux/vermagic.h

          make -j"$(nproc)" \
            ARCH=x86_64 \
            LOCALVERSION=-daphile \
            bzImage \
            modules

          test -f arch/x86/boot/bzImage

      - name: Verify built kernel really used PREEMPT_RT
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY BUILT KERNEL PREEMPT_RT"
          echo "=========================================="

          echo
          echo "Final .config:"
          grep -E '^(CONFIG_EXPERT|CONFIG_PREEMPT|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION|CONFIG_MODULES|CONFIG_MODULE_UNLOAD)=' .config

          test "$(grep '^CONFIG_PREEMPT_RT=' .config)" = "CONFIG_PREEMPT_RT=y"

          echo
          echo "Kernel release:"
          make -s ARCH=x86_64 LOCALVERSION=-daphile kernelrelease

          echo
          echo "Kernel UTS version:"
          grep -R -n 'PREEMPT_RT' include/generated/utsversion.h include/generated/compile.h 2>/dev/null || true

          echo
          echo "Kernel image:"
          ls -lh arch/x86/boot/bzImage

          echo
          echo "PREEMPT_RT kernel build VERIFIED."

      - name: Verify kernel release
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL RELEASE"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(make -s ARCH=x86_64 LOCALVERSION=-daphile kernelrelease)"

          echo "Expected:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Actual:"
          echo "${KERNEL_RELEASE_ACTUAL}"

          test "${KERNEL_RELEASE_ACTUAL}" = "${KERNEL_RELEASE}"
          test -f arch/x86/boot/bzImage

          echo
          echo "Kernel release VERIFIED."
          echo "bzImage VERIFIED."

      - name: Build external module and require preempt_rt vermagic
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          TEST_DIR="${GITHUB_WORKSPACE}/test-external-module"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "FINAL PRE-BUILD CONFIG CHECK"
          echo "=========================================="

          test "$(grep '^CONFIG_PREEMPT_RT=' .config)" = "CONFIG_PREEMPT_RT=y"
          grep -q '^CONFIG_PREEMPT_RT=y$' include/config/auto.conf
          grep -q '#define MODULE_VERMAGIC_PREEMPT "preempt_rt "' include/linux/vermagic.h

          rm -rf "${TEST_DIR}"
          mkdir -p "${TEST_DIR}"

          cat > "${TEST_DIR}/test_module.c" <<'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>

          static int __init test_module_init(void)
          {
              pr_info("Daphile PREEMPT_RT module test loaded\n");
              return 0;
          }

          static void __exit test_module_exit(void)
          {
              pr_info("Daphile PREEMPT_RT module test unloaded\n");
          }

          module_init(test_module_init);
          module_exit(test_module_exit);

          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("Daphile");
          MODULE_DESCRIPTION("Daphile PREEMPT_RT external module test");
          EOF

          cat > "${TEST_DIR}/Makefile" <<'EOF'
          obj-m += test_module.o
          EOF

          echo "=========================================="
          echo "BUILD EXTERNAL TEST MODULE"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${TEST_DIR}" \
            modules

          KO="${TEST_DIR}/test_module.ko"

          test -f "${KO}"

          echo
          echo "=========================================="
          echo "MODULE INFORMATION"
          echo "=========================================="

          modinfo "${KO}"

          TEST_VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo
          echo "=========================================="
          echo "ACTUAL VERMAGIC"
          echo "=========================================="

          echo "${TEST_VERMAGIC}"

          echo
          echo "=========================================="
          echo "VERIFY PREEMPT_RT VERMAGIC"
          echo "=========================================="

          EXPECTED_RELEASE="${KERNEL_RELEASE}"

          case "${TEST_VERMAGIC}" in
            "${EXPECTED_RELEASE} "*)
              echo "Kernel release in vermagic VERIFIED."
              ;;
            *)
              echo "ERROR: kernel release in vermagic is incorrect."
              echo "Expected prefix: ${EXPECTED_RELEASE} "
              echo "Actual: ${TEST_VERMAGIC}"
              exit 1
              ;;
          esac

          if [[ "${TEST_VERMAGIC}" != *"SMP"* ]]; then
            echo "ERROR: SMP token is missing."
            exit 1
          fi

          if [[ "${TEST_VERMAGIC}" != *"preempt_rt"* ]]; then
            echo
            echo "ERROR: PREEMPT_RT vermagic is NOT active."
            echo "Expected vermagic to contain: preempt_rt"
            echo "Actual vermagic:"
            echo "${TEST_VERMAGIC}"
            echo
            echo "Kernel .config:"
            grep -E '^(CONFIG_EXPERT|CONFIG_PREEMPT|CONFIG_PREEMPT_BUILD|CONFIG_PREEMPT_DYNAMIC|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION)=' \
              "${KERNEL_DIR}/.config" || true
            echo
            echo "Generated config:"
            grep -E '^CONFIG_(EXPERT|PREEMPT_RT|PREEMPT|PREEMPT_BUILD|PREEMPT_DYNAMIC|PREEMPTION)=' \
              "${KERNEL_DIR}/include/config/auto.conf" || true
            exit 1
          fi

          if [[ "${TEST_VERMAGIC}" != *"mod_unload"* ]]; then
            echo "ERROR: mod_unload token is missing."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "PREEMPT_RT VERMAGIC VERIFIED"
          echo "=========================================="
          echo
          echo "${TEST_VERMAGIC}"
          echo
          echo "CONFIG_PREEMPT_RT=y VERIFIED."
          echo "preempt_rt VERIFIED."
          echo "SMP VERIFIED."
          echo "mod_unload VERIFIED."

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daphile-linux-${{ env.LINUX_VERSION }}-${{ env.RT_VERSION }}
          if-no-files-found: error
          path: |
            linux-${{ env.LINUX_VERSION }}/arch/x86/boot/bzImage
            linux-${{ env.LINUX_VERSION }}/.config
            linux-${{ env.LINUX_VERSION }}/System.map
            linux-${{ env.LINUX_VERSION }}/vmlinux
            test-external-module/test_module.ko
