name: v2 Build Daphile Linux 6.12.30 PREEMPT_RT 

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINUX_VERSION: "6.12.30"
  DAPHILE_RELEASE: "-daphile"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            kmod \
            xz-utils \
            zstd \
            wget \
            patch

      - name: Download Linux 6.12.30
        run: |
          set -e

          echo "=========================================="
          echo "Download Linux ${LINUX_VERSION}"
          echo "=========================================="

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf \
            "linux-${LINUX_VERSION}.tar.xz"

          mv \
            "linux-${LINUX_VERSION}" \
            "linux-${LINUX_VERSION}-daphile"

          echo
          echo "Linux source ready:"
          ls -ld \
            "linux-${LINUX_VERSION}-daphile"

      - name: Set Daphile local version
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "Set Daphile kernel local version"
          echo "=========================================="

          rm -f localversion-rt

          printf '%s\n' "${DAPHILE_RELEASE}" > localversion-daphile

          echo
          echo "localversion files:"

          ls -la localversion* 2>/dev/null || true

          echo
          echo "localversion-daphile:"

          cat localversion-daphile

      - name: Create kernel configuration
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "Create kernel configuration"
          echo "=========================================="

          make ARCH=x86_64 defconfig

          echo
          echo "=========================================="
          echo "Enable EXPERT"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_EXPERT

          echo
          echo "=========================================="
          echo "Enable SMP"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_SMP

          echo
          echo "=========================================="
          echo "Enable PREEMPT_RT"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_PREEMPT_RT

          echo
          echo "=========================================="
          echo "Enable kernel modules"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_MODULES

          echo
          echo "=========================================="
          echo "Enable module unload"
          echo "=========================================="

          ./scripts/config \
            --enable CONFIG_MODULE_UNLOAD

          echo
          echo "=========================================="
          echo "Clear CONFIG_LOCALVERSION"
          echo "=========================================="

          ./scripts/config \
            --set-str CONFIG_LOCALVERSION ""

          echo
          echo "=========================================="
          echo "Normalize configuration"
          echo "=========================================="

          make ARCH=x86_64 olddefconfig

          echo
          echo "=========================================="
          echo "IMPORTANT CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^CONFIG_EXPERT=|^CONFIG_SMP=|^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPTION=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=|^CONFIG_LOCALVERSION=' \
            .config \
            || true

      - name: Verify PREEMPT_RT configuration
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT CONFIGURATION"
          echo "=========================================="

          echo
          echo "CONFIG_EXPERT:"
          grep '^CONFIG_EXPERT=' .config || true

          echo
          echo "CONFIG_SMP:"
          grep '^CONFIG_SMP=' .config || true

          echo
          echo "CONFIG_PREEMPT:"
          grep '^CONFIG_PREEMPT=' .config || true

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' .config || true

          echo
          echo "CONFIG_PREEMPTION:"
          grep '^CONFIG_PREEMPTION=' .config || true

          echo
          echo "CONFIG_MODULES:"
          grep '^CONFIG_MODULES=' .config || true

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep '^CONFIG_MODULE_UNLOAD=' .config || true

          if ! grep -q '^CONFIG_EXPERT=y' .config; then
            echo
            echo "ERROR: CONFIG_EXPERT is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_SMP=y' .config; then
            echo
            echo "ERROR: CONFIG_SMP is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_PREEMPT_RT=y' .config; then
            echo
            echo "ERROR: CONFIG_PREEMPT_RT is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_MODULES=y' .config; then
            echo
            echo "ERROR: CONFIG_MODULES is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_MODULE_UNLOAD=y' .config; then
            echo
            echo "ERROR: CONFIG_MODULE_UNLOAD is not enabled."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "PREEMPT_RT CONFIGURATION IS CORRECT"
          echo "=========================================="

      - name: Prepare kernel
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "Prepare kernel"
          echo "=========================================="

          make ARCH=x86_64 prepare

          make ARCH=x86_64 modules_prepare

          echo
          echo "Generated configuration files:"

          test -f include/config/auto.conf
          test -f include/config/tristate.conf

          echo
          echo "Kernel preparation completed."

      - name: Verify kernel release
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL RELEASE"
          echo "=========================================="

          KERNEL_RELEASE="$(make -s kernelrelease)"

          echo
          echo "Actual:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Expected:"
          echo "6.12.30-daphile"

          if [ "${KERNEL_RELEASE}" != "6.12.30-daphile" ]; then
            echo
            echo "ERROR: unexpected kernel release"
            echo "Actual:   ${KERNEL_RELEASE}"
            echo "Expected: 6.12.30-daphile"
            exit 1
          fi

          echo
          echo "Kernel release is EXACTLY correct."

          printf '%s\n' \
            "${KERNEL_RELEASE}" \
            > ../kernel.release

      - name: Build Linux kernel
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "BUILD LINUX KERNEL"
          echo "=========================================="

          NPROC="$(nproc)"

          echo
          echo "CPU threads:"
          echo "${NPROC}"

          make \
            ARCH=x86_64 \
            -j"${NPROC}" \
            bzImage \
            modules

      - name: Verify kernel build
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL BUILD"
          echo "=========================================="

          echo
          echo "Kernel version:"
          make -s kernelversion

          echo
          echo "Kernel release:"
          make -s kernelrelease

          echo
          echo "CONFIG_EXPERT:"
          grep '^CONFIG_EXPERT=' .config

          echo
          echo "CONFIG_SMP:"
          grep '^CONFIG_SMP=' .config

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' .config

          echo
          echo "CONFIG_MODULES:"
          grep '^CONFIG_MODULES=' .config

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep '^CONFIG_MODULE_UNLOAD=' .config

          echo
          echo "Config:"
          ls -lh .config

          echo
          echo "Module.symvers:"
          ls -lh Module.symvers

          echo
          echo "System.map:"
          ls -lh System.map

          echo
          echo "Kernel image:"
          ls -lh arch/x86/boot/bzImage

      - name: Final kernel release verification
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          cd "${KERNEL_DIR}"

          KERNEL_RELEASE="$(make -s kernelrelease)"

          echo "=========================================="
          echo "FINAL KERNEL RELEASE"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Expected:"
          echo "6.12.30-daphile"

          if [ "${KERNEL_RELEASE}" != "6.12.30-daphile" ]; then
            echo
            echo "ERROR: final kernel release is incorrect."
            echo "Expected: 6.12.30-daphile"
            echo "Actual:   ${KERNEL_RELEASE}"
            exit 1
          fi

          if ! grep -q '^CONFIG_SMP=y' .config; then
            echo "ERROR: CONFIG_SMP is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_PREEMPT_RT=y' .config; then
            echo "ERROR: CONFIG_PREEMPT_RT is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_MODULE_UNLOAD=y' .config; then
            echo "ERROR: CONFIG_MODULE_UNLOAD is not enabled."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "FINAL RELEASE VERIFIED"
          echo "=========================================="

          echo
          echo "Kernel:        ${KERNEL_RELEASE}"
          echo "SMP:            enabled"
          echo "PREEMPT_RT:    enabled"
          echo "MODULE_UNLOAD: enabled"

      - name: Create release package
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          rm -rf release

          mkdir -p release

          echo "=========================================="
          echo "CREATE RELEASE PACKAGE"
          echo "=========================================="

          cp \
            "${KERNEL_DIR}/.config" \
            release/config

          cp \
            "${KERNEL_DIR}/Module.symvers" \
            release/Module.symvers

          cp \
            "${KERNEL_DIR}/System.map" \
            release/System.map

          cp \
            "${KERNEL_DIR}/arch/x86/boot/bzImage" \
            release/bzImage

          cp \
            kernel.release \
            release/kernel.release

          echo
          echo "=========================================="
          echo "CREATE BUILD INFO"
          echo "=========================================="

          KERNEL_RELEASE="$(cat release/kernel.release)"

          printf '%s\n' \
            "Linux version: ${LINUX_VERSION}" \
            "Daphile suffix: ${DAPHILE_RELEASE}" \
            "Kernel release: ${KERNEL_RELEASE}" \
            "Architecture: x86_64" \
            "SMP: enabled" \
            "PREEMPT_RT: enabled" \
            "MODULE_UNLOAD: enabled" \
            "Compiler: $(gcc --version | head -1)" \
            "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            > release/build-info.txt

          echo
          cat release/build-info.txt

          echo
          echo "=========================================="
          echo "CREATE BUILD TREE ARCHIVE"
          echo "=========================================="

          tar \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ko' \
            --exclude='*.tmp' \
            --exclude='*.cmd' \
            --exclude='*.d' \
            -cJf \
            "release/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz" \
            "${KERNEL_DIR}"

          echo
          echo "=========================================="
          echo "CREATE SHA256"
          echo "=========================================="

          sha256sum \
            release/* \
            > release/SHA256SUMS

          echo
          echo "=========================================="
          echo "RELEASE FILES"
          echo "=========================================="

          ls -lh release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.12.30-daphile-preempt-rt-build
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-6.12.30-daphile-preempt-rt
          name: Daphile Linux 6.12.30 PREEMPT_RT
          body: |
            Daphile Linux 6.12.30 PREEMPT_RT kernel.

            Linux:
            6.12.30

            Kernel release:
            6.12.30-daphile

            Architecture:
            x86_64

            Configuration:
            CONFIG_EXPERT=y
            CONFIG_SMP=y
            CONFIG_PREEMPT_RT=y
            CONFIG_MODULES=y
            CONFIG_MODULE_UNLOAD=y

            The kernel is built from the Linux 6.12.30
            mainline source with PREEMPT_RT enabled.

            The build tree is intended for compiling
            external kernel modules such as Diretta
            alsa_bridge.ko.

          files: |
            release/linux-6.12.30-daphile-build-tree.tar.xz
            release/config
            release/Module.symvers
            release/System.map
            release/kernel.release
            release/bzImage
            release/build-info.txt
            release/SHA256SUMS
