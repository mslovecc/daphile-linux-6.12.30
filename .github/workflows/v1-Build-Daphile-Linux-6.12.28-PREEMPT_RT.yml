name: v1 Build Daphile Linux 6.12.28 PREEMPT_RT
true:
  workflow_dispatch: null
env:
  LINUX_VERSION: 6.12.28
  RT_VERSION: 6.12.28-rt10
  KERNEL_RELEASE: 6.12.28-rt10-daphile
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install build dependencies
      run: "set -euo pipefail\n\nsudo apt-get update\nsudo apt-get install -y \\\n\
        \  bc \\\n  bison \\\n  build-essential \\\n  cpio \\\n  flex \\\n  gcc \\\
        \n  git \\\n  libelf-dev \\\n  libncurses-dev \\\n  libssl-dev \\\n  patch\
        \ \\\n  pkg-config \\\n  wget \\\n  xz-utils \\\n  kmod\n"
    - name: Download Linux kernel
      run: "set -euo pipefail\n\ncd \"${GITHUB_WORKSPACE}\"\n\nrm -rf \"linux-${LINUX_VERSION}\"\
        \nrm -f \"linux-${LINUX_VERSION}.tar.xz\"\n\nwget -q \\\n  \"https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz\"\
        \n\ntar -xf \"linux-${LINUX_VERSION}.tar.xz\"\n\ntest -d \"${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}\"\
        \n"
    - name: Download PREEMPT_RT patch
      run: 'set -euo pipefail


        cd "${GITHUB_WORKSPACE}"


        PATCH_ARCHIVE="patch-${RT_VERSION}.patch.xz"

        PATCH_FILE="patch-${RT_VERSION}.patch"

        PATCH_URL="https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/older/${PATCH_ARCHIVE}"


        rm -f "${PATCH_ARCHIVE}" "${PATCH_FILE}"


        echo "=========================================="

        echo "DOWNLOAD PREEMPT_RT PATCH"

        echo "=========================================="

        echo "RT version: ${RT_VERSION}"

        echo "Download URL: ${PATCH_URL}"

        echo


        wget -q "${PATCH_URL}"


        test -s "${PATCH_ARCHIVE}"


        echo "Downloaded:"

        ls -lh "${PATCH_ARCHIVE}"


        unxz "${PATCH_ARCHIVE}"


        test -s "${PATCH_FILE}"


        echo

        echo "Patch ready:"

        ls -lh "${PATCH_FILE}"

        '
    - name: Apply PREEMPT_RT patch
      run: "set -euo pipefail\n\nKERNEL_DIR=\"${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}\"\
        \nPATCH_FILE=\"${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch\"\n\ncd \"${KERNEL_DIR}\"\
        \n\necho \"==========================================\"\necho \"VERIFY PREEMPT_RT\
        \ PATCH\"\necho \"==========================================\"\n\ntest -s\
        \ \"${PATCH_FILE}\"\n\npatch \\\n  --dry-run \\\n  --batch \\\n  --forward\
        \ \\\n  -p1 \\\n  < \"${PATCH_FILE}\"\n\npatch \\\n  --batch \\\n  --forward\
        \ \\\n  -p1 \\\n  < \"${PATCH_FILE}\"\n\nif find . -type f -name '*.rej' -print\
        \ -quit | grep -q .; then\n  echo \"ERROR: rejected patch hunks found.\"\n\
        \  find . -type f -name '*.rej' -print\n  exit 1\nfi\n\necho\necho \"==========================================\"\
        \necho \"VERIFY RT PATCH MARKERS\"\necho \"==========================================\"\
        \n\ntest -f localversion-rt\n\necho \"localversion-rt:\"\ncat localversion-rt\n\
        \necho\necho \"Check PREEMPT_RT Kconfig:\"\ngrep -n -A18 -B3 'config PREEMPT_RT'\
        \ kernel/Kconfig.preempt || true\n\necho\necho \"Check architecture RT support:\"\
        \ngrep -R -n 'config ARCH_SUPPORTS_RT' arch/x86 kernel 2>/dev/null | head\
        \ -20 || true\n\necho\necho \"PREEMPT_RT source patch applied.\"\n"
    - name: Prepare kernel configuration with PREEMPT_RT
      run: 'set -euo pipefail


        KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

        cd "${KERNEL_DIR}"


        echo "=========================================="

        echo "CREATE PREEMPT_RT KERNEL CONFIG"

        echo "=========================================="


        make ARCH=x86_64 defconfig

        ./scripts/config --enable CONFIG_EXPERT

        make ARCH=x86_64 olddefconfig


        ./scripts/config --enable CONFIG_PREEMPT_RT

        ./scripts/config --enable CONFIG_MODULES

        ./scripts/config --enable CONFIG_MODULE_UNLOAD


        make ARCH=x86_64 olddefconfig


        echo

        echo "=========================================="

        echo "FINAL PREEMPT_RT CONFIGURATION"

        echo "=========================================="


        grep -E ''^(CONFIG_ARCH_SUPPORTS_RT|CONFIG_EXPERT|CONFIG_PREEMPT(_BUILD|_NONE_BUILD|_VOLUNTARY_BUILD|_DYNAMIC)?|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION|CONFIG_MODULES|CONFIG_MODULE_UNLOAD)=''
        .config || true


        test "$(grep ''^CONFIG_EXPERT='' .config)" = "CONFIG_EXPERT=y"

        test "$(grep ''^CONFIG_PREEMPT_RT='' .config)" = "CONFIG_PREEMPT_RT=y"

        test "$(grep ''^CONFIG_MODULES='' .config)" = "CONFIG_MODULES=y"

        test "$(grep ''^CONFIG_MODULE_UNLOAD='' .config)" = "CONFIG_MODULE_UNLOAD=y"


        echo

        echo "CONFIG_PREEMPT_RT=y VERIFIED."

        echo "CONFIG_PREEMPT_BUILD may also be y in this RT tree."

        echo "VERMAGIC precedence is corrected in the next step."

        '
    - name: Prepare generated kernel headers and verify PREEMPT_RT before build
      run: "set -euo pipefail\n\nKERNEL_DIR=\"${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}\"\
        \ncd \"${KERNEL_DIR}\"\n\necho \"==========================================\"\
        \necho \"PREPARE GENERATED KERNEL STATE\"\necho \"==========================================\"\
        \n\ntest \"$(grep '^CONFIG_PREEMPT_RT=' .config)\" = \"CONFIG_PREEMPT_RT=y\"\
        \n\nmake ARCH=x86_64 prepare\nmake ARCH=x86_64 modules_prepare\n\necho\necho\
        \ \"==========================================\"\necho \"VERIFY GENERATED\
        \ CONFIG\"\necho \"==========================================\"\n\ngrep -E\
        \ '^CONFIG_(EXPERT|PREEMPT_RT|PREEMPT|PREEMPT_BUILD|PREEMPT_DYNAMIC|MODULES|MODULE_UNLOAD)='\
        \ include/config/auto.conf || true\ntest \"$(grep '^CONFIG_PREEMPT_RT=' include/config/auto.conf)\"\
        \ = \"CONFIG_PREEMPT_RT=y\"\n\necho\necho \"==========================================\"\
        \necho \"FIX PREEMPT_RT VERMAGIC PRECEDENCE\"\necho \"==========================================\"\
        \n\npython3 - <<'PY'\nfrom pathlib import Path\n\np = Path(\"include/linux/vermagic.h\"\
        )\ns = p.read_text()\n\nold = \"\\n\".join([\n    \"#ifdef CONFIG_PREEMPT_BUILD\"\
        ,\n    '#define MODULE_VERMAGIC_PREEMPT \"preempt \"',\n    \"#elif defined(CONFIG_PREEMPT_RT)\"\
        ,\n    '#define MODULE_VERMAGIC_PREEMPT \"preempt_rt \"',\n    \"#else\",\n\
        \    '#define MODULE_VERMAGIC_PREEMPT \"\"',\n    \"#endif\",\n])\n\nnew =\
        \ \"\\n\".join([\n    \"#ifdef CONFIG_PREEMPT_RT\",\n    '#define MODULE_VERMAGIC_PREEMPT\
        \ \"preempt_rt \"',\n    \"#elif defined(CONFIG_PREEMPT_BUILD)\",\n    '#define\
        \ MODULE_VERMAGIC_PREEMPT \"preempt \"',\n    \"#else\",\n    '#define MODULE_VERMAGIC_PREEMPT\
        \ \"\"',\n    \"#endif\",\n])\n\nif new in s:\n    print(\"PREEMPT_RT vermagic\
        \ precedence is already correct.\")\nelif old in s:\n    p.write_text(s.replace(old,\
        \ new, 1))\n    print(\"PREEMPT_RT vermagic precedence corrected.\")\nelse:\n\
        \    raise SystemExit(\"ERROR: expected MODULE_VERMAGIC_PREEMPT block not\
        \ found.\")\nPY\n\necho\necho \"VERMAGIC SOURCE:\"\ngrep -n -A7 -B2 'MODULE_VERMAGIC_PREEMPT'\
        \ include/linux/vermagic.h\n\ngrep -q '#ifdef CONFIG_PREEMPT_RT' include/linux/vermagic.h\n\
        grep -q '#elif defined(CONFIG_PREEMPT_BUILD)' include/linux/vermagic.h\ngrep\
        \ -q '#define MODULE_VERMAGIC_PREEMPT \"preempt_rt \"' include/linux/vermagic.h\n\
        \necho\necho \"==========================================\"\necho \"VERIFY\
        \ GENERATED VERMAGIC MACRO\"\necho \"==========================================\"\
        \n\ncat > /tmp/check_vermagic.c <<'EOF'\n#define __KERNEL__\n#define MODULE\n\
        #include <linux/vermagic.h>\nconst char *daphile_vermagic = VERMAGIC_STRING;\n\
        EOF\n\n\"${HOSTCC:-cc}\"   -D__KERNEL__   -DMODULE   -include \"${KERNEL_DIR}/include/linux/compiler_types.h\"\
        \   -Iinclude   -Iinclude/generated   -Iarch/x86/include   -Iarch/x86/include/generated\
        \   -Iinclude/uapi   -Iarch/x86/include/uapi   -Iinclude/generated/uapi  \
        \ -Iarch/x86/include/generated/uapi   -E /tmp/check_vermagic.c > /tmp/check_vermagic.i\n\
        \ngrep -F 'preempt_rt' /tmp/check_vermagic.i /tmp/check_vermagic.i\n\necho\n\
        echo \"PREEMPT_RT IS ACTIVE BEFORE KERNEL BUILD.\"\necho \"VERMAGIC WILL USE\
        \ preempt_rt.\"\n"
    - name: Build Linux PREEMPT_RT kernel
      run: "set -euo pipefail\n\nKERNEL_DIR=\"${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}\"\
        \ncd \"${KERNEL_DIR}\"\n\necho \"==========================================\"\
        \necho \"BUILD PREEMPT_RT KERNEL\"\necho \"==========================================\"\
        \n\necho \"Configuration immediately before build:\"\ngrep -E '^(CONFIG_EXPERT|CONFIG_PREEMPT|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION|CONFIG_MODULES|CONFIG_MODULE_UNLOAD)='\
        \ .config\n\ntest \"$(grep '^CONFIG_PREEMPT_RT=' .config)\" = \"CONFIG_PREEMPT_RT=y\"\
        \ngrep -q '^CONFIG_PREEMPT_RT=y$' include/config/auto.conf\ngrep -q '#define\
        \ MODULE_VERMAGIC_PREEMPT \"preempt_rt \"' include/linux/vermagic.h\n\nmake\
        \ -j\"$(nproc)\" \\\n  ARCH=x86_64 \\\n  LOCALVERSION=-daphile \\\n  bzImage\
        \ \\\n  modules\n\ntest -f arch/x86/boot/bzImage\n"
    - name: Verify built kernel really used PREEMPT_RT
      run: 'set -euo pipefail


        KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

        cd "${KERNEL_DIR}"


        echo "=========================================="

        echo "VERIFY BUILT KERNEL PREEMPT_RT"

        echo "=========================================="


        echo

        echo "Final .config:"

        grep -E ''^(CONFIG_EXPERT|CONFIG_PREEMPT|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION|CONFIG_MODULES|CONFIG_MODULE_UNLOAD)=''
        .config


        test "$(grep ''^CONFIG_PREEMPT_RT='' .config)" = "CONFIG_PREEMPT_RT=y"


        echo

        echo "Kernel release:"

        make -s ARCH=x86_64 LOCALVERSION=-daphile kernelrelease


        echo

        echo "Kernel UTS version:"

        grep -R -n ''PREEMPT_RT'' include/generated/utsversion.h include/generated/compile.h
        2>/dev/null || true


        echo

        echo "Kernel image:"

        ls -lh arch/x86/boot/bzImage


        echo

        echo "PREEMPT_RT kernel build VERIFIED."

        '
    - name: Verify kernel release
      run: 'set -euo pipefail


        KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

        cd "${KERNEL_DIR}"


        echo "=========================================="

        echo "VERIFY KERNEL RELEASE"

        echo "=========================================="


        KERNEL_RELEASE_ACTUAL="$(make -s ARCH=x86_64 LOCALVERSION=-daphile kernelrelease)"


        echo "Expected:"

        echo "${KERNEL_RELEASE}"


        echo

        echo "Actual:"

        echo "${KERNEL_RELEASE_ACTUAL}"


        test "${KERNEL_RELEASE_ACTUAL}" = "${KERNEL_RELEASE}"

        test -f arch/x86/boot/bzImage


        echo

        echo "Kernel release VERIFIED."

        echo "bzImage VERIFIED."

        '
    - name: Build external module and require preempt_rt vermagic
      run: "set -euo pipefail\n\nKERNEL_DIR=\"${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}\"\
        \nTEST_DIR=\"${GITHUB_WORKSPACE}/test-external-module\"\n\ncd \"${KERNEL_DIR}\"\
        \n\necho \"==========================================\"\necho \"FINAL PRE-BUILD\
        \ CONFIG CHECK\"\necho \"==========================================\"\n\n\
        test \"$(grep '^CONFIG_PREEMPT_RT=' .config)\" = \"CONFIG_PREEMPT_RT=y\"\n\
        grep -q '^CONFIG_PREEMPT_RT=y$' include/config/auto.conf\ngrep -q '#define\
        \ MODULE_VERMAGIC_PREEMPT \"preempt_rt \"' include/linux/vermagic.h\n\nrm\
        \ -rf \"${TEST_DIR}\"\nmkdir -p \"${TEST_DIR}\"\n\ncat > \"${TEST_DIR}/test_module.c\"\
        \ <<'EOF'\n#include <linux/module.h>\n#include <linux/kernel.h>\n\nstatic\
        \ int __init test_module_init(void)\n{\n    pr_info(\"Daphile PREEMPT_RT module\
        \ test loaded\\n\");\n    return 0;\n}\n\nstatic void __exit test_module_exit(void)\n\
        {\n    pr_info(\"Daphile PREEMPT_RT module test unloaded\\n\");\n}\n\nmodule_init(test_module_init);\n\
        module_exit(test_module_exit);\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"\
        Daphile\");\nMODULE_DESCRIPTION(\"Daphile PREEMPT_RT external module test\"\
        );\nEOF\n\ncat > \"${TEST_DIR}/Makefile\" <<'EOF'\nobj-m += test_module.o\n\
        EOF\n\necho \"==========================================\"\necho \"BUILD EXTERNAL\
        \ TEST MODULE\"\necho \"==========================================\"\n\nmake\
        \ \\\n  -C \"${KERNEL_DIR}\" \\\n  ARCH=x86_64 \\\n  M=\"${TEST_DIR}\" \\\n\
        \  modules\n\nKO=\"${TEST_DIR}/test_module.ko\"\n\ntest -f \"${KO}\"\n\necho\n\
        echo \"==========================================\"\necho \"MODULE INFORMATION\"\
        \necho \"==========================================\"\n\nmodinfo \"${KO}\"\
        \n\nTEST_VERMAGIC=\"$(modinfo -F vermagic \"${KO}\")\"\n\necho\necho \"==========================================\"\
        \necho \"ACTUAL VERMAGIC\"\necho \"==========================================\"\
        \n\necho \"${TEST_VERMAGIC}\"\n\necho\necho \"==========================================\"\
        \necho \"VERIFY PREEMPT_RT VERMAGIC\"\necho \"==========================================\"\
        \n\nEXPECTED_RELEASE=\"${KERNEL_RELEASE}\"\n\ncase \"${TEST_VERMAGIC}\" in\n\
        \  \"${EXPECTED_RELEASE} \"*)\n    echo \"Kernel release in vermagic VERIFIED.\"\
        \n    ;;\n  *)\n    echo \"ERROR: kernel release in vermagic is incorrect.\"\
        \n    echo \"Expected prefix: ${EXPECTED_RELEASE} \"\n    echo \"Actual: ${TEST_VERMAGIC}\"\
        \n    exit 1\n    ;;\nesac\n\nif [[ \"${TEST_VERMAGIC}\" != *\"SMP\"* ]];\
        \ then\n  echo \"ERROR: SMP token is missing.\"\n  exit 1\nfi\n\nif [[ \"\
        ${TEST_VERMAGIC}\" != *\"preempt_rt\"* ]]; then\n  echo\n  echo \"ERROR: PREEMPT_RT\
        \ vermagic is NOT active.\"\n  echo \"Expected vermagic to contain: preempt_rt\"\
        \n  echo \"Actual vermagic:\"\n  echo \"${TEST_VERMAGIC}\"\n  echo\n  echo\
        \ \"Kernel .config:\"\n  grep -E '^(CONFIG_EXPERT|CONFIG_PREEMPT|CONFIG_PREEMPT_BUILD|CONFIG_PREEMPT_DYNAMIC|CONFIG_PREEMPT_RT|CONFIG_PREEMPTION)='\
        \ \\\n    \"${KERNEL_DIR}/.config\" || true\n  echo\n  echo \"Generated config:\"\
        \n  grep -E '^CONFIG_(EXPERT|PREEMPT_RT|PREEMPT|PREEMPT_BUILD|PREEMPT_DYNAMIC|PREEMPTION)='\
        \ \\\n    \"${KERNEL_DIR}/include/config/auto.conf\" || true\n  exit 1\nfi\n\
        \nif [[ \"${TEST_VERMAGIC}\" != *\"mod_unload\"* ]]; then\n  echo \"ERROR:\
        \ mod_unload token is missing.\"\n  exit 1\nfi\n\necho\necho \"==========================================\"\
        \necho \"PREEMPT_RT VERMAGIC VERIFIED\"\necho \"==========================================\"\
        \necho\necho \"${TEST_VERMAGIC}\"\necho\necho \"CONFIG_PREEMPT_RT=y VERIFIED.\"\
        \necho \"preempt_rt VERIFIED.\"\necho \"SMP VERIFIED.\"\necho \"mod_unload\
        \ VERIFIED.\"\n"
    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: daphile-linux-${{ env.LINUX_VERSION }}-${{ env.RT_VERSION }}
        if-no-files-found: error
        path: 'linux-${{ env.LINUX_VERSION }}/arch/x86/boot/bzImage

          linux-${{ env.LINUX_VERSION }}/.config

          linux-${{ env.LINUX_VERSION }}/System.map

          linux-${{ env.LINUX_VERSION }}/vmlinux

          test-external-module/test_module.ko

          '
