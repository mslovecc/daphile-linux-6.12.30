name: Build Diretta ALSA Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_VERSION: "6.12.30"
  KERNEL_RELEASE: "6.12.30-daphile"
  KERNEL_REPO: "mslovecc/daphile-linux-6.12.30"
  KERNEL_TAG: "linux-6.12.30-daphile-rt"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-11 \
            g++-11 \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            wget \
            curl \
            kmod

      - name: Show source files
        run: |
          echo "=== Repository ==="
          pwd

          echo
          echo "=== Files ==="
          find . -maxdepth 3 -type f | sort

      - name: Download kernel build tree
        run: |
          set -e

          KERNEL_URL="https://github.com/${KERNEL_REPO}/releases/download/${KERNEL_TAG}/linux-${LINUX_VERSION}-daphile-build-tree.tar.xz"

          echo "Downloading:"
          echo "${KERNEL_URL}"

          wget -q --show-progress \
            "${KERNEL_URL}" \
            -O linux-${LINUX_VERSION}-daphile-build-tree.tar.xz

          echo
          echo "=== Kernel archive ==="
          ls -lh linux-${LINUX_VERSION}-daphile-build-tree.tar.xz

      - name: Extract kernel build tree
        run: |
          set -e

          tar -xJf \
            linux-${LINUX_VERSION}-daphile-build-tree.tar.xz

          echo "=== Extracted directories ==="
          find . -maxdepth 2 -type d | sort

      - name: Locate kernel tree
        run: |
          set -e

          KERNEL_DIR="linux-${LINUX_VERSION}-daphile"

          if [ ! -d "${KERNEL_DIR}" ]; then
            echo "ERROR: Kernel tree not found:"
            echo "${KERNEL_DIR}"
            exit 1
          fi

          echo "KERNEL_DIR=${KERNEL_DIR}" >> "${GITHUB_ENV}"

          echo
          echo "Kernel tree:"
          echo "${KERNEL_DIR}"

          echo
          echo "=== Kernel files ==="

          ls -lh \
            "${KERNEL_DIR}/.config" \
            "${KERNEL_DIR}/Module.symvers" \
            "${KERNEL_DIR}/System.map"

      - name: Check kernel release
        run: |
          set -e

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "CHECK KERNEL RELEASE"
          echo "=========================================="

          echo
          echo "Kernel release from build tree:"
          ACTUAL_RELEASE="$(make -s kernelrelease)"
          echo "${ACTUAL_RELEASE}"

          echo
          echo "Expected:"
          echo "${KERNEL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            echo "Expected: ${KERNEL_RELEASE}"
            echo "Actual:   ${ACTUAL_RELEASE}"
            exit 1
          fi

          echo
          echo "Kernel release verified."

      - name: Verify PREEMPT_RT build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFY PREEMPT_RT BUILD ENVIRONMENT"
          echo "=========================================="

          echo
          echo "Kernel build tree:"
          echo "${KERNEL_DIR}"

          echo
          echo "=========================================="
          echo "1. .config"
          echo "=========================================="

          if [ ! -f "${KERNEL_DIR}/.config" ]; then
            echo "ERROR: .config not found."
            exit 1
          fi

          echo
          grep -E \
            '^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPT_DYNAMIC=|^CONFIG_PREEMPTION=|^CONFIG_SMP=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
            "${KERNEL_DIR}/.config" \
            || true

          echo
          echo "Checking CONFIG_PREEMPT_RT..."

          PREEMPT_RT_CONFIG="$(
            sed -n \
              's/^CONFIG_PREEMPT_RT=//p' \
              "${KERNEL_DIR}/.config" \
              | tr -d '"'
          )"

          if [ "${PREEMPT_RT_CONFIG}" != "y" ]; then
            echo
            echo "ERROR: CONFIG_PREEMPT_RT is not enabled."
            echo "Actual:"
            grep '^CONFIG_PREEMPT_RT=' \
              "${KERNEL_DIR}/.config" \
              || true
            exit 1
          fi

          echo "CONFIG_PREEMPT_RT=y"

          echo
          echo "=========================================="
          echo "2. include/config/auto.conf"
          echo "=========================================="

          AUTO_CONF="${KERNEL_DIR}/include/config/auto.conf"

          if [ ! -f "${AUTO_CONF}" ]; then
            echo "ERROR: auto.conf not found:"
            echo "${AUTO_CONF}"
            exit 1
          fi

          grep -E \
            '^CONFIG_PREEMPT=|^CONFIG_PREEMPT_RT=|^CONFIG_PREEMPT_DYNAMIC=|^CONFIG_PREEMPTION=|^CONFIG_SMP=|^CONFIG_MODULES=|^CONFIG_MODULE_UNLOAD=' \
            "${AUTO_CONF" \
            || true

          echo
          echo "Checking auto.conf PREEMPT_RT..."

          if ! grep -q '^CONFIG_PREEMPT_RT=y$' "${AUTO_CONF}"; then
            echo
            echo "ERROR: auto.conf does not contain:"
            echo "CONFIG_PREEMPT_RT=y"
            exit 1
          fi

          echo "auto.conf: CONFIG_PREEMPT_RT=y"

          echo
          echo "=========================================="
          echo "3. vermagic.h"
          echo "=========================================="

          VERMAGIC_HEADER="${KERNEL_DIR}/include/linux/vermagic.h"

          if [ ! -f "${VERMAGIC_HEADER}" ]; then
            echo "ERROR: vermagic.h not found:"
            echo "${VERMAGIC_HEADER}"
            exit 1
          fi

          echo
          echo "Relevant vermagic definitions:"
          grep -n \
            -E 'PREEMPT|MODULE_VERMAGIC' \
            "${VERMAGIC_HEADER}" \
            || true

          echo
          echo "=========================================="
          echo "4. Kernel release"
          echo "=========================================="

          ACTUAL_RELEASE="$(
            make \
              -s \
              -C "${KERNEL_DIR}" \
              kernelrelease
          )"

          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          if [ "${ACTUAL_RELEASE}" != "${KERNEL_RELEASE}" ]; then
            echo
            echo "ERROR: kernel release mismatch."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "5. Kernel build metadata"
          echo "=========================================="

          echo
          echo "include/generated/utsrelease.h:"
          if [ -f "${KERNEL_DIR}/include/generated/utsrelease.h" ]; then
            cat "${KERNEL_DIR}/include/generated/utsrelease.h"
          else
            echo "NOT FOUND"
          fi

          echo
          echo "include/config/kernel.release:"
          if [ -f "${KERNEL_DIR}/include/config/kernel.release" ]; then
            cat "${KERNEL_DIR}/include/config/kernel.release"
          else
            echo "NOT FOUND"
          fi

          echo
          echo "=========================================="
          echo "PREEMPT_RT BUILD ENVIRONMENT VERIFIED"
          echo "=========================================="

          echo
          echo "Kernel release:"
          echo "${ACTUAL_RELEASE}"

          echo "CONFIG_PREEMPT_RT:"
          echo "y"

      - name: Build alsa_bridge
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ALSA_BRIDGE"
          echo "=========================================="

          echo
          echo "Kernel:"
          echo "${KERNEL_DIR}"

          echo
          echo "Module source:"
          find daphile-diretta-build \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "=== Makefile ==="
          cat daphile-diretta-build/Makefile

          echo
          echo "=== BUILD ==="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            CC=gcc-11 \
            M="${GITHUB_WORKSPACE}/daphile-diretta-build" \
            modules

      - name: Verify module
        run: |
          set -e

          KO="${GITHUB_WORKSPACE}/daphile-diretta-build/alsa_bridge.ko"

          echo "=========================================="
          echo "VERIFY MODULE"
          echo "=========================================="

          if [ ! -f "${KO}" ]; then
            echo "ERROR: alsa_bridge.ko was not created."
            exit 1
          fi

          echo
          echo "Module:"
          ls -lh "${KO}"

          echo
          echo "=== File ==="
          file "${KO}"

          echo
          echo "=== modinfo ==="
          modinfo "${KO}"

          echo
          echo "=== vermagic ==="
          ACTUAL_VERMAGIC="$(
            modinfo \
              -F vermagic \
              "${KO}"
          )"

          echo "${ACTUAL_VERMAGIC}"

          echo
          echo "=== Expected RT vermagic ==="

          if [[ "${ACTUAL_VERMAGIC}" != *"preempt_rt"* ]]; then
            echo
            echo "ERROR: module vermagic does not contain preempt_rt."
            echo
            echo "This module was NOT accepted."
            exit 1
          fi

          echo
          echo "PREEMPT_RT vermagic detected."

      - name: Prepare release files
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            daphile-diretta-build/alsa_bridge.ko \
            release/alsa_bridge.ko

          cp \
            daphile-diretta-build/alsa_bridge.c \
            release/alsa_bridge.c

          cp \
            daphile-diretta-build/alsa_bridge.h \
            release/alsa_bridge.h

          cp \
            daphile-diretta-build/Makefile \
            release/Makefile

          cd "${KERNEL_DIR}"

          make kernelrelease \
            > ../release/kernel.release

      - name: Create build info
        run: |
          set -e

          KERNEL_RELEASE_ACTUAL="$(
            cat release/kernel.release
          )"

          COMPILER_VERSION="$(
            gcc-11 --version \
            | head -1
          )"

          BUILD_DATE="$(
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          )"

          MODULE_VERMAGIC="$(
            modinfo \
              -F vermagic \
              release/alsa_bridge.ko
          )"

          printf '%s\n' \
            "Linux version: ${LINUX_VERSION}" \
            "Kernel release: ${KERNEL_RELEASE_ACTUAL}" \
            "Module: alsa_bridge" \
            "Module vermagic: ${MODULE_VERMAGIC}" \
            "Compiler: ${COMPILER_VERSION}" \
            "Build date: ${BUILD_DATE}" \
            "Kernel repository: ${KERNEL_REPO}" \
            "Kernel release tag: ${KERNEL_TAG}" \
            > release/build-info.txt

          echo "=== build-info.txt ==="
          cat release/build-info.txt

      - name: Create checksum
        run: |
          set -e

          cd release

          sha256sum \
            alsa_bridge.ko \
            kernel.release \
            build-info.txt \
            > SHA256SUMS

          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa-bridge-${{ env.KERNEL_RELEASE }}
          path: release

      - name: Show final files
        run: |
          set -e

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "=== Release files ==="
          ls -lh release

          echo
          echo "=== Module info ==="
          modinfo release/alsa_bridge.ko

          echo
          echo "=== Final vermagic ==="
          modinfo -F vermagic release/alsa_bridge.ko
