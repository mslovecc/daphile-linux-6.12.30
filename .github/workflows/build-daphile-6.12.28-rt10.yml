name: Build Daphile Linux 6.12.28 PREEMPT_RT

on:
  workflow_dispatch:

env:
  LINUX_VERSION: "6.12.28"
  RT_VERSION: "6.12.28-rt10"
  KERNEL_RELEASE: "6.12.28-daphile"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            pkg-config \
            wget \
            xz-utils

      - name: Download Linux 6.12.28
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          rm -rf "linux-${LINUX_VERSION}"
          rm -f "linux-${LINUX_VERSION}.tar.xz"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VERSION}.tar.xz"

          tar -xf "linux-${LINUX_VERSION}.tar.xz"

          test -d "${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

      - name: Download PREEMPT_RT 6.12.28-rt10
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          rm -f "patch-${RT_VERSION}.patch"
          rm -f "patch-${RT_VERSION}.patch.xz"

          wget -q \
            "https://cdn.kernel.org/pub/linux/kernel/projects/rt/6.12/patch-${RT_VERSION}.patch.xz"

          unxz "patch-${RT_VERSION}.patch.xz"

          test -f "${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch"

      - name: Verify pristine kernel source
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL SOURCE"
          echo "=========================================="

          ACTUAL_VERSION="$(make -s kernelversion)"

          echo "Expected:"
          echo "${LINUX_VERSION}"

          echo
          echo "Actual:"
          echo "${ACTUAL_VERSION}"

          test "${ACTUAL_VERSION}" = "${LINUX_VERSION}"

      - name: Apply PREEMPT_RT patch
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          PATCH_FILE="${GITHUB_WORKSPACE}/patch-${RT_VERSION}.patch"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "PREEMPT_RT PATCH DRY RUN"
          echo "=========================================="

          patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "${PATCH_FILE}"

          echo
          echo "PATCH DRY RUN PASSED"

          echo
          echo "=========================================="
          echo "APPLY PREEMPT_RT PATCH"
          echo "=========================================="

          patch \
            --batch \
            --forward \
            -p1 \
            < "${PATCH_FILE}"

          echo
          echo "PATCH APPLIED"

          echo
          echo "=========================================="
          echo "VERIFY PATCH REJECTS"
          echo "=========================================="

          REJECTS="$(find . -type f -name '*.rej' -print)"

          if [ -n "${REJECTS}" ]; then
            echo "ERROR: rejected patch hunks found:"
            echo "${REJECTS}"
            exit 1
          fi

          echo "No rejected patch hunks."

          echo
          echo "=========================================="
          echo "VERIFY RT PATCH MARKER"
          echo "=========================================="

          test -f localversion-rt

          echo "localversion-rt:"
          cat localversion-rt

          echo
          echo "PREEMPT_RT PATCH VERIFIED."

      - name: Prepare x86_64 kernel configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "CREATE KERNEL CONFIG"
          echo "=========================================="

          make ARCH=x86_64 defconfig

          ./scripts/config --enable CONFIG_PREEMPT
          ./scripts/config --enable CONFIG_PREEMPT_RT
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD

          make ARCH=x86_64 olddefconfig

          echo
          echo "CONFIG_PREEMPT:"
          grep '^CONFIG_PREEMPT=' .config

          echo
          echo "CONFIG_PREEMPT_RT:"
          grep '^CONFIG_PREEMPT_RT=' .config

          echo
          echo "CONFIG_MODULES:"
          grep '^CONFIG_MODULES=' .config

          echo
          echo "CONFIG_MODULE_UNLOAD:"
          grep '^CONFIG_MODULE_UNLOAD=' .config

          test "$(grep '^CONFIG_PREEMPT_RT=' .config)" = "CONFIG_PREEMPT_RT=y"

      - name: Verify RT kernel configuration
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY PREEMPT_RT CONFIGURATION"
          echo "=========================================="

          if ! grep -q '^CONFIG_PREEMPT_RT=y$' .config; then
            echo "ERROR: CONFIG_PREEMPT_RT is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_PREEMPT=y$' .config; then
            echo "ERROR: CONFIG_PREEMPT is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_MODULES=y$' .config; then
            echo "ERROR: CONFIG_MODULES is not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_MODULE_UNLOAD=y$' .config; then
            echo "ERROR: CONFIG_MODULE_UNLOAD is not enabled."
            exit 1
          fi

          echo "CONFIG_PREEMPT_RT=y"
          echo "CONFIG_PREEMPT=y"
          echo "CONFIG_MODULES=y"
          echo "CONFIG_MODULE_UNLOAD=y"

      - name: Build Linux 6.12.28 PREEMPT_RT
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          make -j"$(nproc)" \
            ARCH=x86_64 \
            LOCALVERSION=-daphile \
            bzImage \
            modules

      - name: Verify kernel release
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"

          cd "${KERNEL_DIR}"

          echo "=========================================="
          echo "VERIFY KERNEL RELEASE"
          echo "=========================================="

          KERNEL_RELEASE_ACTUAL="$(make -s kernelrelease)"

          echo "Expected:"
          echo "${KERNEL_RELEASE}"

          echo
          echo "Actual:"
          echo "${KERNEL_RELEASE_ACTUAL}"

          if [ "${KERNEL_RELEASE_ACTUAL}" != "${KERNEL_RELEASE}" ]; then
            echo "ERROR: kernel release mismatch."
            exit 1
          fi

          test -f arch/x86/boot/bzImage

          echo
          echo "Kernel release VERIFIED."
          echo "bzImage VERIFIED."

      - name: Verify external module PREEMPT_RT vermagic
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/linux-${LINUX_VERSION}"
          TEST_DIR="${GITHUB_WORKSPACE}/test-external-module"

          rm -rf "${TEST_DIR}"
          mkdir -p "${TEST_DIR}"

          printf '%s\n' \
            '#include <linux/module.h>' \
            '#include <linux/kernel.h>' \
            '' \
            'static int __init test_module_init(void)' \
            '{' \
            '    pr_info("Daphile PREEMPT_RT module test loaded\n");' \
            '    return 0;' \
            '}' \
            '' \
            'static void __exit test_module_exit(void)' \
            '{' \
            '    pr_info("Daphile PREEMPT_RT module test unloaded\n");' \
            '}' \
            '' \
            'module_init(test_module_init);' \
            'module_exit(test_module_exit);' \
            '' \
            'MODULE_LICENSE("GPL");' \
            'MODULE_AUTHOR("Daphile");' \
            'MODULE_DESCRIPTION("Daphile PREEMPT_RT external module test");' \
            > "${TEST_DIR}/test_module.c"

          printf '%s\n' \
            'obj-m += test_module.o' \
            > "${TEST_DIR}/Makefile"

          echo "=========================================="
          echo "BUILD EXTERNAL TEST MODULE"
          echo "=========================================="

          make \
            -C "${KERNEL_DIR}" \
            ARCH=x86_64 \
            M="${TEST_DIR}" \
            modules

          KO="${TEST_DIR}/test_module.ko"

          if [ ! -f "${KO}" ]; then
            echo "ERROR: test_module.ko was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "MODULE INFORMATION"
          echo "=========================================="

          modinfo "${KO}"

          TEST_VERMAGIC="$(modinfo -F vermagic "${KO}")"

          echo
          echo "=========================================="
          echo "ACTUAL VERMAGIC"
          echo "=========================================="

          echo "${TEST_VERMAGIC}"

          echo
          echo "=========================================="
          echo "VERIFY PREEMPT_RT VERMAGIC"
          echo "=========================================="

          case "${TEST_VERMAGIC}" in
            "${KERNEL_RELEASE}"*"preempt_rt"*)
              echo
              echo "PREEMPT_RT vermagic VERIFIED."
              ;;
            *)
              echo
              echo "ERROR: PREEMPT_RT vermagic is incorrect."
              echo
              echo "Expected:"
              echo "${KERNEL_RELEASE} ... preempt_rt ..."
              echo
              echo "Actual:"
              echo "${TEST_VERMAGIC}"
              exit 1
              ;;
          esac

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daphile-linux-${{ env.LINUX_VERSION }}-rt10
          if-no-files-found: error
          path: |
            linux-${{ env.LINUX_VERSION }}/arch/x86/boot/bzImage
            linux-${{ env.LINUX_VERSION }}/.config
            linux-${{ env.LINUX_VERSION }}/System.map
            test-external-module/test_module.ko
